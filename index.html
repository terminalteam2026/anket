     * kaydedilir. Donus: {ok:true, suggestions} | {ok:false, reason: not_found|old_bank|closed|too_many|too_long|storage}.
     */
    function saveSuggestions(sid, list) {
      reload();
      var s = data.sessions[sid];
      if (!s || !visible(s)) return { ok: false, reason: 'not_found' };
      if (!sameBank(s)) return { ok: false, reason: 'old_bank' };
      if (s.status !== 'completed' || s.feature_suggestions !== undefined) return { ok: false, reason: 'closed' };
      var clean = cleanSuggestions(list);
      if (clean.length > MAX_SUGGESTIONS) return { ok: false, reason: 'too_many' };
      if (clean.some(function (x) { return x.length > MAX_SUGGESTION_LENGTH; })) return { ok: false, reason: 'too_long' };
      var res = commit(function (d) {
        var ds = d.sessions[sid];
        if (!ds || ds.status !== 'completed' || ds.feature_suggestions !== undefined) return false;
        ds.feature_suggestions = clean;
        ds.last_active_at = now();
        ds.rev = (ds.rev || 0) + 1;
      });
      if (res === 'storage') return { ok: false, reason: 'storage' };
      if (res === 'aborted') return { ok: false, reason: 'closed' };
      kick(sid, { now: true }); // anket sonu: kalanlar ve oneriler hemen
      return { ok: true, suggestions: clean.slice() };
    }

    /** Oneri ekrani gosterilmeli mi: tamamlanmis ve henuz onerisi kaydedilmemis oturum. */
    function suggestionsPending(sid) {
      var s = sessionBySid(sid);
      return Boolean(s && sameBank(s) && s.status === 'completed' && s.feature_suggestions === undefined);
    }

    function changeStatus(sid, target) {
      reload();
      var s = data.sessions[sid];
      if (!s || !visible(s) || !sameBank(s) || !isResumable(s)) return false;
      var ok = commit(function (d) {
        d.sessions[sid].status = target;
        d.sessions[sid].last_active_at = now();
        d.sessions[sid].rev = (d.sessions[sid].rev || 0) + 1;
      }) === 'ok';
      if (ok) kick(sid); // durum degisikligi (ara verme, birakma) de gonderilir
      return ok;
    }

    function sessionBySid(sid) {
      reload();
      var s = data.sessions[sid];
      return s && visible(s) ? s : null;
    }

    // ---- gonderim

    /**
     * Gonderi nesnesi: tam (butun satirlar) ya da artimli (yalniz alicinin onaylamadigi satirlar + forceIds; oturum
     * bilgisi her zaman). Alicilar response_id ile tekrari ayiklar, eski oturum guncellemesini yok sayar (K-79).
     */
    function buildSubmission(s, sentAt, full, forceIds) {
      var obj = core.payload.submission(s, {
        study_id: s.study_id,
        study_key: sendCfg.study_key === undefined || sendCfg.study_key === '' ? null : sendCfg.study_key,
        bank_checksum: s.bank_checksum,
        sent_at: sentAt,
      });
      if (!full) {
        var posted = new Set(s.sent_ids || []);
        obj.responses = obj.responses.filter(function (r) { return !posted.has(r.response_id) || forceIds[r.response_id]; });
      }
      return obj;
    }

    function submissionObject(sid, sentAt) {
      var s = sessionBySid(sid);
      if (!s) throw new Error('Oturum yok');
      // oturumun kendi calisma kimligi ve soru havuzu ozeti; baska calismanin yapilandirmasi asla yazilmaz
      return core.payload.submission(s, {
        study_id: s.study_id,
        study_key: sendCfg.study_key === undefined || sendCfg.study_key === '' ? null : sendCfg.study_key,
        bank_checksum: s.bank_checksum,
        sent_at: sentAt === undefined ? now() : sentAt,
      });
    }

    function submissionText(sid) {
      return JSON.stringify(submissionObject(sid));
    }

    function fileText(sid) {
      return JSON.stringify(submissionObject(sid), null, 2);
    }

    /**
     * Gonderilen YUKUN anlik goruntusunu kaydeder (WR1-02): snapshot {status, ids}; gonderim sirasinda eklenen
     * yanitlar "gonderildi" sayilmaz. rejectedIds: alicinin reddettigi yanit kimlikleri (WR1-04).
     */
    function markSent(sid, receipt, sentAt, snapshot, rejectedIds) {
      return commit(function (d) {
        var s = d.sessions[sid];
        if (!s) return false;
        // artimli gonderimde onaylanan kimlikler birikir; yeniden gonderilip kabul edilen eski ret kalkar
        var ids = new Set(s.sent_ids || []);
        snapshot.ids.forEach(function (id) { ids.add(id); });
        var posted = new Set(snapshot.ids);
        var rejected = new Set((s.sent_rejected || []).filter(function (id) { return !posted.has(id); }));
        rejectedIds.forEach(function (id) { rejected.add(id); });
        s.sent_at = sentAt;
        s.receipt = receipt === undefined ? null : receipt;
        s.sent_status = snapshot.status;
        s.sent_rev = snapshot.rev;
        s.sent_ids = Array.from(ids);
        s.sent_count = s.sent_ids.length;
        s.sent_rejected = Array.from(rejected);
      }) === 'ok';
    }

    /**
     * Gonderi: POST text/plain (CORS on ucusu yok). Basari YALNIZ HTTP 2xx + {"ok": true, "receipt": "<metin>"}:
     * Google'in yonlendirme katmani bir POST'a ara sira saglik JSON'u ya da HTML 404 donduruyor (16 Ekim canli
     * olcum); ok:true goren her yaniti basari saymak islenmemis gonderiyi "gonderildi" yapardi. Her HTTP durumunda
     * govde okunur; {"ok":false,"error":"<kod>"} Turkce iletiye cevrilir; geri kalan her yanit 'unexpected' (gecici).
     * Donus: {ok:true, receipt, accepted, rejected, persisted} | {ok:false, code, message[, error, status]}
     */
    function send(sid, o) {
      o = o || {};
      var fetchImpl = o.fetchImpl || (root.fetch ? root.fetch.bind(root) : null);
      var timeoutMs = o.timeoutMs || SEND_TIMEOUT_MS;
      if (sendCfg.type === 'none' || !sendCfg.url) {
        return Promise.resolve({ ok: false, code: 'no_target', message: T.sendNoTarget });
      }
      if (!fetchImpl) {
        return Promise.resolve({ ok: false, code: 'network', message: T.sendNoFetch });
      }
      var session = sessionBySid(sid);
      if (!session) {
        return Promise.resolve({ ok: false, code: 'not_found', message: T.sendNotFound });
      }
      if (!sameBank(session)) {
        return Promise.resolve({ ok: false, code: 'old_bank', message: T.sendOldBank });
      }
      var sentAt = now();
      var posted = buildSubmission(session, sentAt, !o.delta, o.forceIds || {});
      var body = JSON.stringify(posted);
      var snapshot = {
        status: posted.session.status,
        rev: session.rev || 0,
        ids: posted.responses.map(function (r) { return r.response_id; }),
      };
      var controller = typeof AbortController === 'function' ? new AbortController() : null;
      var timedOut = false;
      var timer = null;
      var timeout = new Promise(function (resolve) {
        timer = setTimeout(function () {
          timedOut = true;
          if (controller) controller.abort();
          resolve('timeout'); // fetch abort'u gormezse de zaman asimi sonuclansin
        }, timeoutMs);
      });
      var request = Promise.resolve().then(function () {
        return fetchImpl(sendCfg.url, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: body,
          credentials: 'omit',
          referrerPolicy: 'no-referrer',
          signal: controller ? controller.signal : undefined,
        });
      });
      return Promise.race([request, timeout])
        .then(function (res) {
          if (res === 'timeout') throw Object.assign(new Error('timeout'), { name: 'TimeoutError' });
          return Promise.resolve(res.text()).then(function (text) { return text; }, function () { return ''; }).then(function (text) {
            var reply;
            try {
              reply = JSON.parse(text);
            } catch (e) {
              reply = undefined;
            }
            if (isPlainObject(reply) && reply.ok === true && typeof reply.receipt === 'string' && res.ok) {
              var receipt = reply.receipt;
              var rejectedList = Array.isArray(reply.rejected) ? reply.rejected : [];
              var postedIds = new Set(snapshot.ids);
              var rejectedIds = [];
              rejectedList.forEach(function (e) {
                if (e && typeof e.response_id === 'string' && postedIds.has(e.response_id) && rejectedIds.indexOf(e.response_id) < 0) {
                  rejectedIds.push(e.response_id);
                }
              });
              var persisted = markSent(sid, receipt, sentAt, snapshot, rejectedIds);
              return {
                ok: true,
                receipt: receipt,
                accepted: typeof reply.accepted === 'number' ? reply.accepted : null,
                rejected: rejectedList,
                persisted: persisted,
              };
            }
            if (isErrorReply(reply)) {
              return { ok: false, code: 'rejected', status: res.status, error: reply.error.slice(0, 200), message: errorMessageFor(reply.error) };
            }
            return unexpectedReply(res.status);
          });
        })
        .catch(function (e) {
          if (timedOut || (e && e.name === 'TimeoutError')) {
            return {
              ok: false,
              code: 'timeout',
              message: 'Sunucu ' + Math.round(timeoutMs / 1000) + ' saniye içinde yanıt vermedi. Yanıtların ulaşmış olabilir; tekrar göndermek güvenlidir.',
            };
          }
          return { ok: false, code: 'network', message: T.sendNetwork };
        })
        .then(function (r) {
          clearTimeout(timer);
          return r;
        });
    }

    /**
     * Tek ses dosyasi gonderisi: text/plain POST, govde JSON; zaman asimi ana gonderiyle ayni. Basari YALNIZ HTTP 2xx +
     * {"ok": true} ile "audio_uri" (metin) ya da "duplicate": true; geri kalan sozlesme disi yanit 'unexpected' (gecici).
     * Donus: {ok:true, reply} | {ok:false, code: network|timeout|unexpected|rejected, status, error}.
     */
    function postAudio(fetchImpl, body, timeoutMs) {
      var controller = typeof AbortController === 'function' ? new AbortController() : null;
      var timer = null;
      var timeout = new Promise(function (resolve) {
        timer = setTimeout(function () {
          if (controller) controller.abort();
          resolve({ ok: false, code: 'timeout' });
        }, timeoutMs);
      });
      var request = Promise.resolve().then(function () {
        return fetchImpl(sendCfg.url, {
          method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body,
          credentials: 'omit', referrerPolicy: 'no-referrer', signal: controller ? controller.signal : undefined,
        });
      }).then(function (res) {
        return Promise.resolve(res.text()).then(function (t) { return t; }, function () { return ''; }).then(function (t) {
          var reply;
          try { reply = JSON.parse(t); } catch (e) { reply = undefined; }
          if (isPlainObject(reply) && reply.ok === true && res.ok && (typeof reply.audio_uri === 'string' || reply.duplicate === true)) {
            return { ok: true, reply: reply };
          }
          if (isErrorReply(reply)) return { ok: false, code: 'rejected', status: res.status, error: reply.error.slice(0, 200) };
          return unexpectedReply(res.status);
        });
      }, function () { return { ok: false, code: 'network' }; });
      return Promise.race([request, timeout]).then(function (r) { clearTimeout(timer); return r; });
    }

    function markAudioSent(sid, id) {
      return commit(function (d) {
        var ds = d.sessions[sid];
        if (!ds) return false;
        ds.audio_sent = (ds.audio_sent || []).filter(function (x) { return x !== id; }).concat([id]);
      }) === 'ok';
    }

    // ses gonderisinde bunlar butun gonderimi durdurur (ayni anahtar/calisma ana gonderide de reddedilir)
    var STUDY_ERRORS = ['wrong_study_key', 'wrong_study_id', 'bank_version_mismatch', 'unsupported_format'];

    /** Ses kayitlarini base64 olarak tasiyan dosya metni ("Dosyaya kaydet", TASARIM-v2 §8.1: audio[]). */
    function fileTextWithAudio(sid) {
      var obj = submissionObject(sid);
      var s = sessionBySid(sid);
      var rows = audioRows(s);
      if (rows.length === 0 || !audioStore) return Promise.resolve(JSON.stringify(obj, null, 2));
      var audio = [];
      var chain = Promise.resolve();
      rows.forEach(function (r) {
        chain = chain.then(function () { return audioStore.get(r.response_id); }).then(function (file) {
          if (file && file.data) {
            audio.push({ response_id: r.response_id, mime: file.mime || r.audio_mime, duration_ms: r.audio_duration_ms, data: file.data });
          }
        }, function () { /* okunamayan kayit atlanir */ });
      });
      return chain.then(function () {
        obj.audio = audio;
        return JSON.stringify(obj, null, 2);
      });
    }

    function notify(sid) {
      listeners.slice().forEach(function (fn) {
        try { fn(sid); } catch (e) { /* bir dinleyicinin hatasi digerlerini durdurmaz */ }
      });
    }

    // ---- gonderici (artimli, kullanici karari 16 Ekim): kaydettikce, oturum basina ayni anda tek istek, iki gonderi
    // arasi en az SEND_INTERVAL_MS (birikenler bir sonrakine biner), ses dosyalari yanit satiri alicida onaylaninca
    // sirayla; gecici hatada core.retry beklemesi (busy/rate_limited araligi uzatir), kalici hatada durur.

    /** Alicinin henuz onaylamadigi yanit satirlari (reddedilenler tekrar gitmez). */
    function unsentRows(s) {
      var posted = new Set(s.sent_ids || []);
      return rowList(s).filter(function (r) { return !posted.has(r.response_id); });
    }

    /** Oturum bilgisi (durum, oneriler...) son gonderiden beri degisti mi. */
    function stateDirty(s) {
      return !s.sent_at || s.sent_status !== s.status || (s.rev || 0) !== (s.sent_rev || 0);
    }

    function newSender() {
      return {
        busy: false, timer: null, timerKind: null, waitUntil: null, lastSubmitAt: null, interval: SEND_INTERVAL_MS,
        attempt: 0, lastFailure: null, stopped: null, full: false, now: false, forceRows: {}, resubmitted: {}, dead: {},
        batch: null, waiters: [], manual: null, o: {},
      };
    }

    function senderOf(sid) {
      return senders[sid] || (senders[sid] = newSender());
    }

    function needsSubmission(s, st) {
      return stateDirty(s) || unsentRows(s).length > 0 || Object.keys(st.forceRows).length > 0;
    }

    /** Gonderilebilir ses: satiri alicida kabul edilmis, gonderilmemis, kalici hatali degil. */
    function sendableAudio(s, st) {
      var acc = acceptedSet(s);
      var sent = new Set(s.audio_sent || []);
      return rowList(s).filter(function (r) {
        return r.has_audio === true && acc.has(r.response_id) && !sent.has(r.response_id) && !st.dead[r.response_id] && !st.forceRows[r.response_id];
      });
    }

    function senderFetch(st) {
      return st.o.fetchImpl || defaultFetch || (root.fetch ? root.fetch.bind(root) : null);
    }

    function schedule(sid, ms, kind) {
      var st = senderOf(sid);
      if (st.timer) timers.clearTimeout(st.timer);
      st.timerKind = kind;
      st.waitUntil = now() + ms;
      st.timer = timers.setTimeout(function () {
        st.timer = null;
        st.timerKind = null;
        st.waitUntil = null;
        if (kind === 'backoff') st.now = true; // bekleme bitti: aralik kurali yeniden denemeyi ertelemez
        pump(sid);
      }, Math.max(0, ms));
    }

    function clearTimer(st) {
      if (st.timer) timers.clearTimeout(st.timer);
      st.timer = null;
      st.timerKind = null;
      st.waitUntil = null;
    }

    /** Bekleyen "Gönder" sozlerini sonuclar (her sey gitti ya da kalici hata). */
    function settle(sid, r) {
      var st = senderOf(sid);
      lastSend[sid] = r;
      var waiters = st.waiters;
      st.waiters = [];
      st.manual = null;
      notify(sid);
      waiters.forEach(function (w) { w(r); });
    }

    /** Siradaki adim: izin varsa gonderi, yoksa sesler, sonra aralik beklemesi; hepsi gittiyse sozler sonuclanir. */
    function pump(sid) {
      var st = senderOf(sid);
      if (closed || st.busy || st.stopped) return;
      if (st.timer && st.timerKind === 'backoff') return; // gecici hatadan sonra bekleme
      var s = sessionBySid(sid);
      if (!s || !sameBank(s) || sendCfg.type === 'none' || !sendCfg.url) return;
      var pendingSub = st.full || needsSubmission(s, st);
      var due = st.full || st.now || st.lastSubmitAt === null || now() - st.lastSubmitAt >= Math.round(st.interval * delayScale);
      if (pendingSub && due) {
        clearTimer(st);
        submitStep(sid, s, st);
        return;
      }
      var audio = sendableAudio(s, st);
      if (audio.length > 0) {
        audioStep(sid, s, st, audio);
        return;
      }
      st.batch = null;
      if (pendingSub) {
        if (!st.timer) schedule(sid, st.lastSubmitAt + Math.round(st.interval * delayScale) - now(), 'interval');
        if (st.waiters.length === 0) notify(sid);
        return;
      }
      clearTimer(st);
      var deadCount = Object.keys(st.dead).length;
      if (st.waiters.length > 0 || deadCount > 0) {
        if (deadCount > 0) {
          var r = { ok: false, code: 'audio', message: 'Yanıtların gönderildi ama ' + deadCount + ' ses kaydı gönderilemedi.', dead: st.dead };
          st.stopped = r;
          settle(sid, r);
        } else {
          settle(sid, st.lastOk || { ok: true, receipt: s.receipt || null, accepted: null, rejected: [] });
        }
        return;
      }
      notify(sid);
    }

    function submitStep(sid, s, st) {
      st.busy = true;
      var full = st.full;
      st.full = false;
      st.now = false;
      var force = st.forceRows;
      notify(sid);
      safeSend(sid, { fetchImpl: senderFetch(st), timeoutMs: st.o.timeoutMs, delta: !full, forceIds: force }).then(function (r) {
        st.busy = false;
        st.lastSubmitAt = now();
        if (r.ok) {
          st.attempt = 0;
          st.lastFailure = null;
          st.interval = Math.max(SEND_INTERVAL_MS, Math.round(st.interval / 2));
          Object.keys(force).forEach(function (id) {
            if (st.forceRows[id]) {
              st.resubmitted[id] = (st.resubmitted[id] || 0) + 1;
              delete st.forceRows[id];
            }
          });
          st.lastOk = r;
          pump(sid);
          return;
        }
        if (full) st.full = true; // elle istenen tam gonderi yeniden denemede de tam
        failed(sid, st, r);
      });
    }

    /** Gecici hata: bekleme (5, 15, 45 sn, sonra 2 dk); busy/rate_limited araligi da uzatir. Kalici: dur. */
    function failed(sid, st, r) {
      if (core.retry.classify(r) === 'transient') {
        st.attempt++;
        var delay = core.retry.delayMs(st.attempt, random);
        if (r.error === 'busy' || r.error === 'rate_limited' || r.status === 429 || r.status === 503) {
          st.interval = Math.min(SEND_INTERVAL_MAX_MS, st.interval * 2);
          delay = Math.max(delay, st.interval);
        }
        st.lastFailure = r;
        schedule(sid, Math.round(delay * delayScale), 'backoff');
        notify(sid);
        return;
      }
      st.stopped = r;
      settle(sid, r);
    }

    function audioStep(sid, s, st, audio) {
      var r = audio[0];
      if (!st.batch) st.batch = { done: 0, total: audio.length };
      st.batch.total = st.batch.done + audio.length;
      progress[sid] = T.sendingAudio + ' ' + (st.batch.done + 1) + '/' + st.batch.total;
      st.busy = true;
      notify(sid);
      var fetchImpl = senderFetch(st);
      Promise.resolve().then(function () {
        if (!audioStore || !fetchImpl) return { ok: false, code: 'missing' };
        return Promise.resolve(audioStore.get(r.response_id)).then(function (file) {
          if (!file || !file.data) return { ok: false, code: 'missing' };
          if (core.payload.base64Bytes(file.data) > core.payload.AUDIO_MAX_BYTES) return { ok: false, code: 'rejected', error: 'payload_too_large' };
          return postAudio(fetchImpl, JSON.stringify(core.payload.audio({
            study_id: s.study_id,
            study_key: sendCfg.study_key === undefined || sendCfg.study_key === '' ? null : sendCfg.study_key,
            session_id: s.session_id,
            response_id: r.response_id,
            mime: file.mime || r.audio_mime,
            duration_ms: r.audio_duration_ms,
            data: file.data,
          })), st.o.timeoutMs || SEND_TIMEOUT_MS);
        }, function () { return { ok: false, code: 'missing' }; });
      }).then(function (res) {
        st.busy = false;
        delete progress[sid];
        if (res.ok) {
          markAudioSent(sid, r.response_id);
          st.attempt = 0;
          st.batch.done++;
          pump(sid);
          return;
        }
        if (res.code === 'rejected' && res.error === 'question_unknown') {
          // alici yaniti bilmiyor: konumun satirlari yeniden gonderilir; iki basarili gonderiden sonra da gelirse kalici
          if ((st.resubmitted[r.response_id] || 0) >= 2) {
            st.dead[r.response_id] = 'question_unknown';
            st.batch.done++;
          } else {
            positionRows(s, r.response_id).forEach(function (x) { st.forceRows[x.response_id] = true; });
            st.now = true;
          }
          pump(sid);
          return;
        }
        if (res.code === 'missing') {
          st.dead[r.response_id] = 'missing';
          st.batch.done++;
          pump(sid);
          return;
        }
        if (core.retry.classify(res) === 'transient') {
          failed(sid, st, res);
          return;
        }
        if (res.code === 'rejected' && STUDY_ERRORS.indexOf(res.error) >= 0) {
          var fatal = { ok: false, code: 'rejected', error: res.error, message: errorMessageFor(res.error) };
          st.stopped = fatal;
          settle(sid, fatal);
          return;
        }
        st.dead[r.response_id] = res.error || res.code; // bu kayit kalici hatali; digerleri surer
        st.batch.done++;
        pump(sid);
      });
    }

    function safeSend(sid, o) {
      try {
        return Promise.resolve(send(sid, o)).catch(function () { return { ok: false, code: 'internal', message: T.sendInternal }; });
      } catch (e) {
        return Promise.resolve({ ok: false, code: 'internal', message: T.sendInternal });
      }
    }

    /** Kayittan sonra: artimli gonderim acik ve oturum buna onay verdiyse gondericiyi calistirir. */
    function kick(sid, o) {
      if (!autoSend || closed) return;
      var s = sessionBySid(sid);
      if (!s || s.auto_send !== true || !sameBank(s) || sendCfg.type === 'none' || !sendCfg.url) return;
      var st = senderOf(sid);
      if (o && o.now) {
        st.now = true;
        if (st.timer && st.timerKind === 'interval') clearTimer(st);
      }
      pump(sid);
    }

    /**
     * "Gönder" (elle): tam yuk hemen, sonra bekleyen sesler; gecici hatalarda kendiliginden yeniden dener (core.retry),
     * kalici hatada durur. Soz, her sey gidince ya da kalici hatayla cozulur; suren gonderimde ayni sozu dondurur
     * (beklemedeyse hemen dener). o: {fetchImpl, timeoutMs}.
     */
    function beginSend(sid, o) {
      var st = senderOf(sid);
      if (o) st.o = o;
      if (st.manual) {
        if (st.timer) retryNow(sid);
        return st.manual;
      }
      delete lastSend[sid];
      st.stopped = null;
      st.dead = {};
      st.full = true;
      st.attempt = 0;
      if (st.timer) clearTimer(st);
      st.manual = new Promise(function (resolve) { st.waiters.push(resolve); });
      var p = st.manual;
      pump(sid);
      return p;
    }

    /** Beklemedeki gonderimi hemen dener ("Şimdi dene"). */
    function retryNow(sid) {
      var st = senders[sid];
      if (!st || !st.timer || st.busy) return false;
      clearTimer(st);
      st.now = true;
      pump(sid);
      return true;
    }

    /** Sayfa acildi: artimli gonderimi olan ve gonderilmemis verisi kalan oturumlar kendiliginden gonderilir. */
    function resumePendingSends(o) {
      reload();
      var out = [];
      if (!autoSend || sendCfg.type === 'none' || !sendCfg.url) return out;
      sortedSessions().forEach(function (s) {
        if (s.auto_send !== true || !sameBank(s)) return;
        var st = senderOf(s.session_id);
        if (o) st.o = o;
        if (!needsSubmission(s, st) && pendingAudio(s).length === 0) return;
        out.push(s.session_id);
        kick(s.session_id, { now: true });
      });
      return out;
    }

    /**
     * Sayfa kapanirken (pagehide, gorunmez sekme): gonderilmemis satirlar ve oturum bilgisi sendBeacon ile atilir
     * (yanit beklenmez, gonderildi isaretlenmez; alicilar response_id ile tekrari ayiklar). Kapanista iki olay birden
     * gelir: degismemis veri BEACON_REPEAT_MS icinde yeniden atilmaz. Donus: atilan sayisi.
     */
    function flushBeacon() {
      if (!beaconImpl || sendCfg.type === 'none' || !sendCfg.url) return 0;
      var n = 0;
      reload();
      sortedSessions().forEach(function (s) {
        if (s.auto_send !== true || !sameBank(s)) return;
        if (!needsSubmission(s, senders[s.session_id] || newSender())) return;
        var obj = buildSubmission(s, now(), false, {});
        var key = (s.rev || 0) + ':' + obj.responses.length + ':' + (s.sent_ids || []).length + ':' + s.status;
        var last = beaconed[s.session_id];
        if (last && last.key === key && now() - last.at < BEACON_REPEAT_MS) return;
        try {
          if (beaconImpl(sendCfg.url, JSON.stringify(obj))) {
            n++;
            beaconed[s.session_id] = { key: key, at: now() };
          }
        } catch (e) { /* en iyi caba */ }
      });
      return n;
    }

    /** Sekme kapandi (yuk testi): zamanlayicilar durur, yeni istek baslamaz. */
    function close() {
      closed = true;
      Object.keys(senders).forEach(function (k) { clearTimer(senders[k]); });
    }

    /** Tek seferlik ses gecisi (yeniden deneme yok, onay beklemez). Donus: Promise<{total, sent, failed}>. */
    function sendAudios(sid, o) {
      var s = sessionBySid(sid);
      var list = s ? pendingAudio(s) : [];
      var fetchImpl = (o && o.fetchImpl) || defaultFetch || (root.fetch ? root.fetch.bind(root) : null);
      var sent = 0;
      var chain = Promise.resolve();
      list.forEach(function (r) {
        chain = chain.then(function () {
          if (!audioStore || !fetchImpl) return null;
          return Promise.resolve(audioStore.get(r.response_id)).then(function (file) {
            if (!file || !file.data) return null;
            return postAudio(fetchImpl, JSON.stringify(core.payload.audio({
              study_id: s.study_id, study_key: sendCfg.study_key || null, session_id: s.session_id, response_id: r.response_id,
              mime: file.mime || r.audio_mime, duration_ms: r.audio_duration_ms, data: file.data,
            })), (o && o.timeoutMs) || SEND_TIMEOUT_MS);
          });
        }).then(function (res) {
          if (res && res.ok) {
            markAudioSent(sid, r.response_id);
            sent++;
          }
        });
      });
      return chain.then(function () { return { total: list.length, sent: sent, failed: list.length - sent }; });
    }

    /**
     * Gonderim paneli durumu: {state: 'idle'|'sending'|'waiting'|'ok'|'error', message, receipt, accepted, rejected,
     * note, progress, waitUntil, pendingRows, pendingAudio}. 'ok' ve alici-ret sayisi depodaki kayittan turetilir.
     */
    function sendState(sid) {
      var st = senders[sid];
      var s = sessionBySid(sid);
      var info = s ? summary(s) : null;
      var pendingRows = s ? unsentRows(s).length : 0;
      var pendingAud = s ? pendingAudio(s).length : 0;
      var extra = { pendingRows: pendingRows, pendingAudio: pendingAud };
      if (st && st.busy) return Object.assign({ state: 'sending', rejected: 0, progress: progress[sid] || null }, extra);
      if (st && st.timer && st.timerKind === 'backoff') {
        return Object.assign({
          state: 'waiting', rejected: 0, waitUntil: st.waitUntil, attempt: st.attempt,
          reason: st.lastFailure ? st.lastFailure.error || st.lastFailure.code : null,
        }, extra);
      }
      var rejected = info ? info.rejected : 0;
      var last = (st && st.stopped) || lastSend[sid];
      if (last && !last.ok) return Object.assign({ state: 'error', message: last.message, code: last.code, rejected: rejected }, extra);
      if (last && last.ok && last.persisted === false) {
        return Object.assign({ state: 'ok', receipt: last.receipt, accepted: last.accepted, rejected: rejected, note: T.sendPersistNote }, extra);
      }
      if (s && s.sent_at && !stateDirty(s) && pendingRows === 0 && pendingAud === 0) {
        return Object.assign({ state: 'ok', receipt: s.receipt || null, accepted: info.acceptedCount, rejected: rejected }, extra);
      }
      return Object.assign({ state: 'idle', rejected: rejected }, extra);
    }

    function subscribe(fn) {
      listeners.push(fn);
      return function () {
        var i = listeners.indexOf(fn);
        if (i >= 0) listeners.splice(i, 1);
      };
    }

    function finishedSessions() {
      reload();
      return sortedSessions()
        .filter(function (s) { return (s.status === 'completed' || s.status === 'abandoned') && hasAnswers(s) && sameBank(s); })
        .map(summary);
    }

    return {
      STORE_KEY: storeKey,
      QUARANTINE_KEY: quarantineKey,
      storageAvailable: storageAvailable,
      reload: reload,
      data: function () { return data; },
      sessions: function () { reload(); return sortedSessions().map(summary); },
      resumable: function () {
        reload();
        return sortedSessions().filter(function (s) { return isResumable(s) && sameBank(s); }).map(summary);
      },
      /** Tamamlanan ya da birakilan, yaniti olan, bu dosyanin havuzuyla baslamis oturumlar. */
      finished: finishedSessions,
      /** finished() icinden henuz (tam olarak) gonderilmemis olanlar. */
      unsentFinished: function () { return finishedSessions().filter(function (s) { return s.unsent; }); },
      /** Baska soru havuzu surumuyle baslamis, yaniti olan oturumlar (yalniz dosyaya kaydedilir). */
      legacySessions: function () {
        reload();
        return sortedSessions().filter(function (s) { return !sameBank(s) && hasAnswers(s); }).map(summary);
      },
      summary: function (sid) { var s = sessionBySid(sid); return s ? summary(s) : null; },
      plannedTotal: plannedTotal,
      startSession: startSession,
      question: question,
      submit: submit,
      saveSuggestions: saveSuggestions,
      suggestionsPending: suggestionsPending,
      pause: function (sid) { return changeStatus(sid, 'paused'); },
      abandon: function (sid) { return changeStatus(sid, 'abandoned'); },
      submissionObject: submissionObject,
      submissionText: submissionText,
      fileText: fileText,
      fileTextWithAudio: fileTextWithAudio,
      sendAudios: sendAudios,
      retryNow: retryNow,
      resumePendingSends: resumePendingSends,
      flushNow: function (sid) { kick(sid, { now: true }); },
      flushBeacon: flushBeacon,
      close: close,
      fileName: function (sid) { return fileNameFor(sid, now()); },
      send: send,
      beginSend: beginSend,
      sendState: sendState,
      subscribe: subscribe,
      quarantineInfo: quarantineInfo,
      quarantineText: quarantineText,
      ackQuarantine: ackQuarantine,
      canSend: function () { return sendCfg.type !== 'none' && Boolean(sendCfg.url); },
    };
  }

  // ------------------------------------------------------------------ arayuz

  function boot() {
    var doc = document;
    var core = root.SurveyCore;
    var appEl = doc.getElementById('app');
    var engine = null;
    var config = null;
    var bank = null;
    var screen = ''; // 'start' | 'question' | ...
    var startNotice = null; // karttan basarili gonderimin gecici iletisi; baslangictan ayrilinca silinir
    var audioStore = null; // IndexedDB ses deposu (boot'ta)
    var micDenied = false; // mikrofon izni reddedildi ya da kayit basarisiz: dugmeler gizlenir

    /** Ses kaydi yapilabilir mi: tarayici destegi, IndexedDB ve mikrofon reddi yok (TASARIM-v2 §8.1). */
    function audioAvailable() {
      var nav = root.navigator;
      return !micDenied && Boolean(audioStore) && Boolean(nav && nav.mediaDevices && typeof nav.mediaDevices.getUserMedia === 'function') &&
        typeof root.MediaRecorder === 'function' && pickRecorderMime(root.MediaRecorder) !== null;
    }

    function h(tag, props) {
      var el = doc.createElement(tag);
      var p = props || {};
      Object.keys(p).forEach(function (k) {
        var v = p[k];
        if (v === null || v === undefined || v === false) return;
        if (k === 'class') el.className = v;
        else if (k === 'text') el.textContent = v;
        else if (k.slice(0, 2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2), v);
        else el.setAttribute(k, v === true ? '' : String(v));
      });
      for (var i = 2; i < arguments.length; i++) append(el, arguments[i]);
      return el;
    }

    function append(el, child) {
      if (child === null || child === undefined || child === false) return;
      if (Array.isArray(child)) child.forEach(function (c) { append(el, c); });
      else if (typeof child === 'string') el.appendChild(doc.createTextNode(child));
      else el.appendChild(child);
    }

    function button(label, kind, onclick, extra) {
      return h('button', Object.assign({ type: 'button', class: 'btn btn-' + kind, onclick: onclick }, extra || {}), label);
    }

    // ---- diyalog

    function confirmDialog(o) {
      return new Promise(function (resolve) {
        var dlg = doc.createElement('dialog');
        if (typeof dlg.showModal !== 'function') {
          resolve(root.confirm(o.title + '\n\n' + o.text));
          return;
        }
        var titleId = 'dlg-title-' + Math.random().toString(36).slice(2);
        var result = false;
        dlg.className = 'dialog';
        dlg.setAttribute('aria-labelledby', titleId);
        var confirmBtn = button(o.confirmLabel, 'primary', function () { result = true; dlg.close(); });
        var cancelBtn = button(o.cancelLabel || T.cancel, 'text', function () { dlg.close(); });
        dlg.appendChild(h('h2', { id: titleId, class: 'dialog-title' }, o.title));
        dlg.appendChild(h('p', { class: 'dialog-text' }, o.text));
        dlg.appendChild(h('div', { class: 'dialog-actions' }, cancelBtn, confirmBtn));
        dlg.addEventListener('close', function () {
          dlg.remove();
          resolve(result);
        });
        doc.body.appendChild(dlg);
        dlg.showModal();
        cancelBtn.focus();
      });
    }

    // ---- taslak (sekme bazli, yalniz sayfa yenilemesine karsi)

    function draftKey(sid, pos) {
      return 'sesli-anket/taslak/' + sid + '/' + pos;
    }
    function draftGet(sid, pos) {
      try { return root.sessionStorage.getItem(draftKey(sid, pos)) || ''; } catch (e) { return ''; }
    }
    function draftSet(sid, pos, text) {
      try {
        if (text) root.sessionStorage.setItem(draftKey(sid, pos), text);
        else root.sessionStorage.removeItem(draftKey(sid, pos));
      } catch (e) { /* yut */ }
    }

    // ---- yonlendirme

    var guard = { dirty: function () { return false; } };
    root.addEventListener('beforeunload', function (ev) {
      if (guard.dirty()) {
        ev.preventDefault();
        ev.returnValue = '';
      }
    });

    function show(title, node, focusSel, o) {
      guard.dirty = function () { return false; };
      var soft = Boolean(o && o.soft); // gonderim bitince baslangic ekranini sessizce tazele: kaydirma/odak degismez
      var y = soft ? root.scrollY : 0;
      appEl.replaceChildren(node);
      doc.title = title + ' – ' + T.appName;
      if (soft) {
        root.scrollTo(0, y);
        return;
      }
      root.scrollTo(0, 0);
      var f = focusSel ? appEl.querySelector(focusSel) : appEl.querySelector('h1');
      if (f) {
        if (!f.hasAttribute('tabindex') && !/^(INPUT|TEXTAREA|BUTTON)$/.test(f.tagName)) f.setAttribute('tabindex', '-1');
        f.focus({ preventScroll: true });
      }
    }

    // ---- dosyaya kaydetme

    var fileEnv = {
      showSaveFilePicker: typeof root.showSaveFilePicker === 'function' ? root.showSaveFilePicker.bind(root) : null,
      download: function (name, text) {
        var blob = new Blob([text], { type: 'application/json;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var a = h('a', { href: url, download: name, class: 'sr-only' });
        doc.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
        return Promise.resolve();
      },
    };

    function savedToFile(sid) {
      return Promise.resolve().then(function () {
        // ses kayitlari base64 olarak dosyaya (TASARIM-v2 §8.1: audio[])
        return engine.fileTextWithAudio(sid).then(function (text) { return saveTextToFile(fileEnv, engine.fileName(sid), text); });
      });
    }

    // ---- gonderim paneli

    var panels = []; // ekranda olan paneller; oturum basina gonderim durumu motorda tutulur
    var fileMsg = {}; // oturum -> {text, count, error}: son dosya iletisi, yanit sayisi degisince gecersiz

    function repaintPanels(sid) {
      panels = panels.filter(function (p) { return p.box.isConnected; });
      panels.forEach(function (p) { if (p.sid === sid) p.paint(); });
    }

    function onSendChange(sid) {
      repaintPanels(sid);
      // gonderim bittiyse ve katilimci baslangic ekranindaysa kartlar (gonderilmemis uyarisi) tazelensin.
      // Basarili gonderimde kart kaybolur; iletisi ve alindi kodu baslangicta gecici bildirim olarak kalir.
      if (screen !== 'start') return;
      var st = engine.sendState(sid);
      if (st.state === 'sending') return;
      if (st.state === 'ok') startNotice = { receipt: st.receipt, rejected: st.rejected };
      renderStart({ soft: true });
    }

    /** Gonder / Dosyaya kaydet paneli; durum motordadir, ekran degisse de ayni oturumun panelleri birlikte guncellenir. */
    function sendPanel(sid, o) {
      o = o || {};
      var box = h('div', { class: 'send-panel' });
      var live = h('div', { class: 'send-live', role: 'status', 'aria-live': 'polite' });
      var alertBox = h('div', { class: 'send-alert', role: 'alert' });
      var controls = h('div', { class: 'send-controls' });
      box.appendChild(live);
      box.appendChild(alertBox);
      box.appendChild(controls);
      var canSend = engine.canSend() && !o.saveOnly;

      var tick = null;
      function paint() {
        var st = engine.sendState(sid);
        var info = engine.summary(sid);
        live.textContent = '';
        alertBox.textContent = '';
        controls.replaceChildren();
        if (tick) clearTimeout(tick);
        tick = null;
        var busy = st.state === 'sending';
        var waiting = st.state === 'waiting';
        if (busy) {
          live.appendChild(h('p', { id: 'send-progress' }, st.progress || T.sending));
        } else if (waiting) {
          var left = Math.max(0, Math.ceil((st.waitUntil - Date.now()) / 1000));
          live.appendChild(h('p', { id: 'send-waiting' }, T.sendWaiting.replace('{n}', left)));
          tick = setTimeout(function () { if (box.isConnected) paint(); }, 1000); // geri sayim
        } else if (st.state === 'ok') {
          live.appendChild(h('p', { class: 'success' }, st.rejected > 0 ? 'Yanıtların bir kısmı gönderildi.' : T.sendOk));
          if (st.receipt) live.appendChild(h('p', { class: 'receipt' }, 'Alındı kodu: ', h('strong', {}, st.receipt)));
          if (typeof st.accepted === 'number') live.appendChild(h('p', {}, st.accepted + ' yanıt alıcıya ulaştı.'));
          if (st.note) alertBox.appendChild(h('p', { class: 'error' }, st.note));
        } else if (st.state === 'error') {
          alertBox.appendChild(h('p', { class: 'error' }, (st.code === 'audio' ? '' : T.sendFailed) + st.message));
        }
        if (canSend && st.state !== 'ok' && (st.pendingRows > 0 || st.pendingAudio > 0)) {
          var pend = h('p', { class: 'muted', id: 'send-pending' });
          if (st.pendingRows > 0) pend.appendChild(doc.createTextNode(T.sendPendingRows.replace('{n}', st.pendingRows) + ' '));
          if (st.pendingAudio > 0) pend.appendChild(doc.createTextNode(T.sendPendingAudio.replace('{n}', st.pendingAudio)));
          live.appendChild(pend);
        }
        if (!busy && st.rejected > 0) {
          alertBox.appendChild(h('p', { class: 'error' }, st.rejected + ' yanıt alıcı tarafından kabul edilmedi. Lütfen "Dosyaya kaydet" ile bir kopya alıp araştırmacıya ilet.'));
        }
        var fm = fileMsg[sid];
        if (fm && info && fm.count === info.responseCount) {
          (fm.error ? alertBox : live).appendChild(h('p', fm.error ? { class: 'error' } : {}, fm.text));
        }

        if (canSend && !(info && info.legacyBank)) {
          if (waiting) {
            controls.appendChild(button(T.sendRetryNow, 'primary', function () { engine.retryNow(sid); }, { id: 'send-retry-now' }));
          } else {
            var label = st.state === 'error' ? T.sendRetry : (st.state === 'ok' ? T.sendAgain : (o.partial ? T.sendPartial : T.send));
            var kind = st.state === 'ok' ? 'outline' : (o.compact ? 'outline' : 'primary');
            controls.appendChild(button(busy ? T.sending : label, kind, doSend, { disabled: busy, 'aria-busy': busy ? 'true' : null }));
          }
        }
        controls.appendChild(button(T.saveFile, canSend ? 'outline' : 'primary', doSave, { disabled: busy }));
      }

      function doSend() {
        if (engine.sendState(sid).state === 'sending') return;
        engine.beginSend(sid).then(function (r) {
          if (o.onDone) o.onDone(r);
        });
      }

      function doSave() {
        var info = engine.summary(sid);
        var count = info ? info.responseCount : 0;
        savedToFile(sid).then(function (res) {
          if (res === 'cancelled') return;
          fileMsg[sid] = { text: res === 'saved' ? T.fileSaved : T.fileDownloadStarted, count: count };
          paint();
        }, function () {
          fileMsg[sid] = { text: T.fileFailed, count: count, error: true };
          paint();
        });
      }

      panels.push({ sid: sid, box: box, paint: paint });
      paint();
      return box;
    }

    // ---- ekranlar

    function renderStart(o) {
      try {
        renderStartInner(o);
      } catch (e) {
        fatal(T.fatalBoot);
      }
    }

    function recoveryBanner() {
      var q = engine.quarantineInfo();
      if (q.count === 0) return null;
      var msg = h('p', { class: 'muted', role: 'status' });
      return h('section', { class: 'card card-warn', 'aria-labelledby': 'recovery-title' },
        h('h2', { id: 'recovery-title', class: 'card-title' }, T.recoveryTitle),
        h('p', {}, T.recoveryText),
        msg,
        h('div', { class: 'row' },
          button(T.recoverySave, 'outline', function () {
            Promise.resolve().then(function () {
              return saveTextToFile(fileEnv, fileNameFor('karantina', Date.now()), engine.quarantineText());
            }).then(function (res) {
              if (res === 'cancelled') return;
              msg.textContent = res === 'saved' ? T.fileSaved : T.fileDownloadStarted;
            }, function () {
              msg.textContent = T.fileFailed;
            });

    function abandonAction(s) {

    function resume(sid) {
      try {
        var q = engine.question(sid);
        if (q) renderQuestion(sid);
        else if (engine.summary(sid) && engine.summary(sid).status === 'completed') renderCompleted(sid);
        else renderStart();
      } catch (e) {

      }
    }

    function renderConsent() {
      screen = 'consent';
      startNotice = null;
      var total = engine.plannedTotal();
      var main = h('main', { class: 'screen' });
      main.appendChild(h('h1', { class: 'title' }, T.consentTitle));
      main.appendChild(h('p', { class: 'lead', id: 'consent-purpose' }, T.consentPurpose));
      main.appendChild(h('ul', { class: 'consent-list', id: 'consent-list' }, consentItems(config).map(function (it) {

      })));
      main.appendChild(h('p', { class: 'note' }, 'Anket ' + total + ' sorudan oluşuyor; istediğin an ara verip sonra kaldığın yerden sürdürebilirsin.'));

      var codeInput = h('input', {
        id: 'participant-code', type: 'text', maxlength: MAX_CODE_LENGTH, autocomplete: 'off',
        autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false', 'aria-describedby': 'code-hint', class: 'field',

      var audioCheck = h('input', { id: 'audio-consent', type: 'checkbox', class: 'check' }); // istege bagli (TASARIM-v2 §8)
      var errorBox = h('div', { class: 'consent-error', role: 'alert' });
      var accept = button(T.consentAccept, 'primary', onAccept, { id: 'consent-accept', disabled: true });
      var cancel = button(T.consentCancel, 'outline', function () { renderStart(); }, { id: 'consent-cancel' });
      check.addEventListener('change', function () { accept.disabled = !check.checked; });
      main.appendChild(h('label', { class: 'check-row', for: 'consent-checkbox' }, check, h('span', {}, T.consentCheckbox)));
      main.appendChild(h('label', { class: 'check-row', for: 'audio-consent' }, audioCheck, h('span', {}, T.consentAudio)));
      main.appendChild(errorBox);
      main.appendChild(h('div', { class: 'actions' }, accept, cancel));

      // onaydan sonra dogrudan ilk soru (katilimci bilgisi adimi kaldirildi)
      var starting = false;
      function onAccept() {
        if (!check.checked || starting) return;
        starting = true;
        accept.disabled = true;
        cancel.disabled = true;
        accept.textContent = T.consentStarting;
        var res;
        try {
          res = engine.startSession({ code: codeInput.value, consentTime: Date.now(), audioConsent: audioCheck.checked });
        } catch (e) {
          res = { ok: false, reason: 'generic' };
        }
        if (res.ok) {
          renderHowTo(res.sessionId); // yalniz yeni oturumda; surdurme dogrudan soruya gider
          return;
        }
        starting = false;
        accept.textContent = T.consentAccept;
        accept.disabled = !check.checked;
        cancel.disabled = false;
        errorBox.textContent = res.reason === 'selection' ? T.consentErrorSelection
          : res.reason === 'storage' ? T.consentErrorStorage : T.consentErrorGeneric;
      }
      show(T.consentTitle, main);
    }

    /**
     * "Nasıl cevaplayacaksın?" (kullanici istegi 16 Ekim): onaydan sonra, ilk sorudan once, yalniz yeni oturumda.
     * Oturum onayla olusmustur; bu sayfada sekme kapanirsa "Ankete Devam Et" dogrudan siradaki soruya gider.
     */
    function renderHowTo(sid) {
      screen = 'howto';
      var main = h('main', { class: 'screen' });

        h('p', { class: 'example-badge', 'aria-hidden': 'true' }, T.howToExampleLabel),
        h('p', { class: 'prompt example-prompt', 'aria-hidden': 'true' }, T.howToExampleQuestion),
        h('div', { class: 'example-answers', 'aria-hidden': 'true' }, T.howToExample.map(function (t, i) {
          return h('div', { class: 'answer-row' }, h('span', { class: 'answer-no' }, (i + 1) + '.'), h('div', { class: 'field example-field' }, t));
        })),
        h('p', { class: 'sr-only', id: 'howto-example-alt' }, alt),

      var info = engine.summary(sid);

      main.appendChild(h('ul', { class: 'tips', id: 'howto-tips' }, tips.map(function (t) { return h('li', {}, t); })));
      main.appendChild(h('div', { class: 'actions' },
        button(T.howToStart, 'primary', function () { renderQuestion(sid); }, { id: 'howto-start' })));

    }

    /**
     * Soru ekrani (TASARIM-v2 §2): uc yanit alani birlikte ("1.", "2.", "3."), ustte "Bu, sesli asistana vereceğin bir
     * komut; ona söyler gibi yaz.". "Yanıtı Kaydet / Sonraki Soru" en az bir alan doluyken etkin; dolu alanlar sirasiyla, bosluksuz kaydedilir;
     * ayni cumle iki alanda varsa kayit yok.
     * "Soruyu Geç" her zaman var (yazilan metin kaydedilmez). Son soru bitince "Son bir soru" (oneriler) ekrani.
     */
    function renderQuestion(sid, opts) {
      opts = opts || {};
      var q = engine.question(sid);
      if (!q) {
        var info = engine.summary(sid);
        if (info && info.status === 'completed') renderCompleted(sid);
        else renderStart();
        return;
      }
      screen = 'question';
      startNotice = null;
      var counter = 'Soru ' + (q.position + 1) + '/' + q.total;
      var main = h('main', { class: 'screen screen-question' });
      var later = button(T.questionLater, 'text', requestLater, { id: 'later-button' });
      main.appendChild(h('div', { class: 'topbar' }, h('h1', { class: 'counter', id: 'question-counter' }, counter), later));
      main.appendChild(h('progress', {
        class: 'progress', id: 'question-progress', max: q.total, value: q.position + 1, 'aria-label': T.questionProgress,
      }));
      var region = h('div', { class: 'notice-region', role: 'status', 'aria-live': 'polite' });
      main.appendChild(region);
      main.appendChild(h('p', { class: 'prompt', id: 'question-text' }, q.promptText));

      // uc alan: fieldset/legend ile gruplanir; her alanin etiketi "1.", "2.", "3."
      var group = h('fieldset', { class: 'answers', id: 'answers', 'aria-describedby': 'question-text answer-reminder' });
      group.appendChild(h('legend', { class: 'label' }, T.questionAnswersLabel));
      group.appendChild(h('p', { class: 'reminder', id: 'answer-reminder' }, T.questionReminder));
      var areas = [];
      var recs = [null, null, null]; // alan basina ses kaydi: {blob, url, duration_ms, mime, id}
      var audioCells = [];
      var info0 = engine.summary(sid);
      var audioOn = Boolean(info0 && info0.audioConsent) && audioAvailable();
      var carry = Array.isArray(opts.carryTexts) ? opts.carryTexts : null;
      for (var i = 0; i < q.answers; i++) {
        var id = 'answer-field-' + (i + 1);
        var area = h('textarea', {
          id: id, class: 'field answer', rows: 3, maxlength: MAX_ANSWER_LENGTH, autocomplete: 'off',
          autocorrect: 'off', autocapitalize: 'off', spellcheck: 'false', placeholder: T.questionPlaceholder,
          'aria-describedby': 'question-text answer-reminder',
        });
        area.value = carry ? String(carry[i] || '').slice(0, MAX_ANSWER_LENGTH) : draftGet(sid, q.position + '-' + i);
        if (carry) draftSet(sid, q.position + '-' + i, area.value);
        areas.push(area);
        var cell = h('div', { class: 'audio-cell', id: 'audio-' + (i + 1) });
        audioCells.push(cell);
        group.appendChild(h('div', { class: 'answer-row' }, h('label', { for: id, class: 'answer-no' }, (i + 1) + '.'),
          h('div', { class: 'answer-cell' }, area, audioOn ? cell : null)));
      }
      var audioNote = h('p', { class: 'note', id: 'audio-note', role: 'status' });
      group.appendChild(audioNote);
      main.appendChild(group);

      var errorRegion = h('div', { class: 'error-region', role: 'alert' });
      main.appendChild(errorRegion);
      var submitBtn = button(T.questionSubmit, 'primary', function () { doSubmit('answer'); }, { id: 'submit-button' });
      var skipBtn = button(T.questionSkip, 'outline', onSkip, { id: 'skip-button' });
      main.appendChild(h('div', { class: 'actions' }, submitBtn, skipBtn));
      main.appendChild(h('p', { class: 'hint' }, T.questionHint));

      if (opts.restBanner) {
        var dismiss = button(T.restDismiss, 'text', function () { region.replaceChildren(); areas[0].focus(); }, { id: 'rest-dismiss' });
        region.appendChild(h('div', { class: 'banner banner-info', id: 'rest-banner' }, h('span', {}, T.questionRestBanner), dismiss));
      }

      var saving = false;
      var lastAction = null;

      function texts() {
        return areas.map(function (a) { return a.value; });
      }
      function anyMeaningful() {
        // alan, yazisi anlamliysa ya da ses kaydi varsa doludur (TASARIM-v2 §8)
        return areas.some(function (a, k) { return core.answerPolicy.isMeaningful(a.value) || recs[k] !== null; });
      }

      // ---- ses kaydi (alan basina; ayni anda tek kayit, en cok 15 sn)
      var active = null; // {field, recorder, stream, timer, tick, started}
      function paintAudio(k) {
        var cell = audioCells[k];
        cell.replaceChildren();
        if (!audioOn) return;
        var rec = recs[k];
        if (active && active.field === k && active.recorder) {
          active.stopBtn = button(stopLabel(), 'outline', function () { stopRecording(); }, { id: 'audio-stop-' + (k + 1) });
          cell.appendChild(active.stopBtn);
          return;
        }
        if (rec) {
          cell.appendChild(h('span', { class: 'audio-label', id: 'audio-label-' + (k + 1) }, 'Ses kaydı (' + Math.max(1, Math.round(rec.duration_ms / 1000)) + ' sn)'));
          cell.appendChild(button(T.audioPlay, 'text', function () {
            Promise.resolve(new Audio(rec.url).play()).catch(function () { /* dinlenemezse sessizce gec */ });
          }, { id: 'audio-play-' + (k + 1) }));
          cell.appendChild(button(T.audioDelete, 'text', function () {
            URL.revokeObjectURL(rec.url);
            recs[k] = null;
            paintAudio(k);
            refresh();
          }, { id: 'audio-delete-' + (k + 1) }));
          return;
        }
        cell.appendChild(button(T.audioRecord, 'text', function () { startRecording(k); },
          { id: 'audio-record-' + (k + 1), disabled: Boolean(active) || saving }));
      }
      /** "Durdur (12 sn)": kalan sure geri sayimi (en cok 15 sn). */
      function stopLabel() {
        var left = Math.max(0, Math.ceil((AUDIO_MAX_MS - (Date.now() - active.started)) / 1000));
        return T.audioStop + ' (' + left + ' sn)';
      }
      function paintAllAudio() {
        for (var k = 0; k < q.answers; k++) paintAudio(k);
      }
      function audioFailed() {
        micDenied = true;
        audioOn = false;
        paintAllAudio();
        audioNote.textContent = T.audioUnavailable;
      }
      function startRecording(k) {
        if (active || saving || !audioOn) return;
        var mime = pickRecorderMime(root.MediaRecorder);
        active = { field: k, pending: true };
        root.navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
          var recorder = new root.MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
          var chunks = [];
          recorder.ondataavailable = function (ev) { if (ev.data && ev.data.size) chunks.push(ev.data); };
          recorder.onstop = function () {
            var duration = Date.now() - active.started;
            stream.getTracks().forEach(function (t) { t.stop(); });
            clearInterval(active.tick);
            clearTimeout(active.timer);
            var type = (recorder.mimeType || mime || 'audio/webm');
            var blob = new Blob(chunks, { type: type });
            active = null;
            if (blob.size > 0 && core.payload.audioMimeOk(type)) {
              recs[k] = { blob: blob, url: URL.createObjectURL(blob), duration_ms: Math.min(duration, AUDIO_MAX_MS), mime: type, id: randomUuid() };
            }
            paintAllAudio();
            refresh();
          };
          active = { field: k, recorder: recorder, stream: stream, started: Date.now() };
          active.timer = setTimeout(stopRecording, AUDIO_MAX_MS);
          active.tick = setInterval(function () { if (active && active.stopBtn) active.stopBtn.textContent = stopLabel(); }, 250);
          recorder.start();
          paintAllAudio();
        }, function () {
          active = null;
          audioFailed();
        });
      }
      function stopRecording() {
        if (active && active.recorder && active.recorder.state !== 'inactive') active.recorder.stop();
      }
      function discardRecordings() {
        stopRecording();
        recs.forEach(function (r) { if (r) URL.revokeObjectURL(r.url); });
        recs = [null, null, null];
      }
      paintAllAudio();
      function refresh() {
        submitBtn.disabled = saving || !anyMeaningful();
      }
      areas.forEach(function (a, i) {
        a.addEventListener('input', function () {
          draftSet(sid, q.position + '-' + i, a.value);
          errorRegion.replaceChildren();
          refresh();
        });
        a.addEventListener('keydown', function (ev) {
          if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) {
            ev.preventDefault();
            if (!submitBtn.disabled) doSubmit('answer');
          }
        });
      });

      function setBusy(b) {
        saving = b;
        submitBtn.textContent = b ? T.questionSaving : T.questionSubmit;
        submitBtn.setAttribute('aria-busy', b ? 'true' : 'false');
        skipBtn.disabled = b;
        later.disabled = b;
        refresh();
      }

      function showError(text) {
        errorRegion.appendChild(h('p', { class: 'error', id: 'answer-error' }, text));
      }

      function clearDrafts() {
        for (var k = 0; k < q.answers; k++) draftSet(sid, q.position + '-' + k, '');
      }

      function doSubmit(action) {
        if (saving) return;
        lastAction = action;
        if (active) return; // kayit surerken kaydetme yok
        setBusy(true);
        errorRegion.replaceChildren();
        var withAudio = action === 'answer' ? recs.filter(function (r) { return r !== null; }) : [];
        if (withAudio.length === 0) {
          finishSubmit(action);
          return;
        }
        // ses dosyalari once IndexedDB'ye (anahtar = yanitin response_id'si), sonra tek setItem'la yanit satirlari
        Promise.all(withAudio.map(function (r) {
          return audioStore.put(r.id, { blob: r.blob, mime: r.mime, duration_ms: r.duration_ms, session_id: sid });
        })).then(function () { finishSubmit(action); }, function () {
          setBusy(false);
          var retry = button(T.questionRetry, 'outline', function () { doSubmit(lastAction); }, { id: 'save-retry' });
          errorRegion.appendChild(h('div', { class: 'banner banner-error', id: 'save-error' }, h('span', {}, T.questionSaveError), retry));
        });
      }

      function finishSubmit(action) {
        var typed = texts();
        var audio = recs.map(function (r) { return action === 'answer' && r ? { response_id: r.id, duration_ms: r.duration_ms, mime: r.mime } : null; });
        var res;
        try {
          // ekranda gosterilen soru ile birlikte gonderilir: baska sekme o soruyu kaydettiyse yazilmaz (bayat sekme)
          res = engine.submit(sid, { action: action, texts: typed, audio: audio, position: q.position, questionId: q.questionId });
        } catch (e) {
          setBusy(false);
          showFault();
          return;
        }
        setBusy(false);
        var out = submitOutcome(res, action, typed);
        if (out.kind !== 'storage_error' && !(res && res.ok)) {
          // kaydedilmeyen yanitin onceden yazilan ses dosyalari silinir (yeniden denemede yeniden yazilir)
          audio.forEach(function (a) { if (a) audioStore.remove(a.response_id).catch(function () {}); });
        }
        if (out.kind === 'completed' || out.kind === 'next') discardRecordings();
        if (out.kind === 'completed') {
          clearDrafts();
          if (engine.suggestionsPending(sid)) renderSuggestions(sid);
          else renderCompleted(sid);
        } else if (out.kind === 'next') {
          clearDrafts();
          renderQuestion(sid, { restBanner: out.restDue });
        } else if (out.kind === 'storage_error') {
          var retry = button(T.questionRetry, 'outline', function () { doSubmit(lastAction); }, { id: 'save-retry' });
          errorRegion.appendChild(h('div', { class: 'banner banner-error', id: 'save-error' }, h('span', {}, T.questionSaveError), retry));
          retry.focus();
        } else if (out.kind === 'empty') {
          showError(T.questionNoticeEmpty);
        } else if (out.kind === 'too_long') {
          showError(T.questionTooLong);
        } else if (out.kind === 'duplicate') {
          showError(T.questionDuplicate);
        } else if (out.kind === 'stale') {
          clearDrafts();
          renderQuestion(sid, { carryTexts: out.carryTexts, notice: T.questionStale });
        } else {
          renderStart();
        }
      }

      function onSkip() {
        if (saving) return;
        stopRecording();
        if (!anyMeaningful()) {
          doSubmit('skip');
          return;
        }
        confirmDialog({ title: T.skipTitle, text: T.skipText, confirmLabel: T.skipConfirm }).then(function (yes) {
          if (yes) {
            discardRecordings();
            doSubmit('skip');
          }
        });
      }

      function requestLater() {
        if (saving) return;
        var unsaved = anyMeaningful();
        confirmDialog({
          title: T.laterTitle,
          text: unsaved ? T.laterUnsavedText : T.laterText,
          confirmLabel: unsaved ? T.laterUnsavedConfirm : T.laterConfirm,
        }).then(function (yes) {
          if (!yes) return;
          clearDrafts();
          discardRecordings();
          engine.pause(sid);
          renderStart();
        });
      }

      refresh();
      show(counter, main, '#question-counter');
      guard.dirty = function () { return anyMeaningful() && !saving; };
      if (opts.notice) {
        // canli bolge ekran kurulduktan sonra doldurulur ki ekran okuyucu duyursun
        setTimeout(function () {
          region.appendChild(h('div', { class: 'banner banner-info', id: 'stale-notice' }, h('span', {}, opts.notice)));
        }, 50);
      }
    }

    /**
     * "Son bir soru" (TASARIM-v2 §5): son soru bitince, tamamlandi/gonderim ekranindan once. 10 tek satirlik istege
     * bagli alan (en cok 300 karakter); "Anketi bitir" her zaman etkin. Ekran yarida kapanirsa yeniden sunulmaz.
     */
    function renderSuggestions(sid) {
      screen = 'suggestions';
      var main = h('main', { class: 'screen' });
      main.appendChild(h('h1', { class: 'title' }, T.suggestTitle));
      main.appendChild(h('p', { class: 'lead', id: 'suggest-question' }, T.suggestQuestion));
      var inputs = [];
      var list = h('div', { class: 'suggestions', role: 'group', 'aria-labelledby': 'suggest-question' });
      for (var i = 0; i < MAX_SUGGESTIONS; i++) {
        var id = 'suggestion-' + (i + 1);
        var input = h('input', {
          id: id, type: 'text', class: 'field', maxlength: MAX_SUGGESTION_LENGTH, autocomplete: 'off',
          autocorrect: 'off', autocapitalize: 'off', spellcheck: 'false',
        });
        inputs.push(input);
        list.appendChild(h('div', { class: 'answer-row' }, h('label', { for: id, class: 'answer-no' }, (i + 1) + '.'), input));
      }
      main.appendChild(list);
      var errorRegion = h('div', { class: 'error-region', role: 'alert' });
      main.appendChild(errorRegion);
      var finish = button(T.suggestFinish, 'primary', onFinish, { id: 'suggest-finish' });
      main.appendChild(h('div', { class: 'actions' }, finish));

      var saving = false;
      function onFinish() {
        if (saving) return;
        saving = true;
        finish.disabled = true;
        errorRegion.replaceChildren();
        var res;
        try {
          res = engine.saveSuggestions(sid, inputs.map(function (x) { return x.value; }));
        } catch (e) {
          res = { ok: false, reason: 'generic' };
        }
        saving = false;
        finish.disabled = false;
        if (res.ok || res.reason === 'closed') {
          renderCompleted(sid);
        } else if (res.reason === 'storage') {
          errorRegion.appendChild(h('p', { class: 'banner banner-error', id: 'save-error' }, T.questionSaveError));
        } else {
          renderCompleted(sid);
        }
      }
      show(T.suggestTitle, main);
      guard.dirty = function () {
        return !saving && inputs.some(function (x) { return core.answerPolicy.isMeaningful(x.value); });
      };
    }

    function renderCompleted(sid) {
      screen = 'completed';
      startNotice = null;
      panels = [];
      var info = engine.summary(sid);
      var main = h('main', { class: 'screen screen-center' });
      main.appendChild(h('h1', { class: 'title', id: 'completed-title' }, T.completedTitle));
      if (info) {
        main.appendChild(h('p', { class: 'lead', id: 'completed-counts' }, completedText(info)));
        main.appendChild(h('p', { class: 'note' }, engine.canSend() ? T.completedSendInfo : T.sendNoneInfo));
        main.appendChild(sendPanel(sid, {}));
        engine.flushNow(sid); // anket sonu: kalanlar ve oneriler aralik beklemeden
      }
      main.appendChild(button(T.completedHome, 'outline', function () { renderStart(); }, { id: 'home-button' }));
      show(T.completedTitle, main);
    }

    function fatal(msg) {
      screen = 'fatal';
      appEl.replaceChildren(h('main', { class: 'screen' }, h('h1', { class: 'title' }, T.appName), h('p', { class: 'banner banner-error', role: 'alert' }, msg)));
    }

    /** Beklenmeyen hata: ekran kilitlenmez, yanitlar silinmez; ana ekrana donus sunulur. */
    function showFault() {
      screen = 'fault';
      appEl.replaceChildren(h('main', { class: 'screen' },
        h('h1', { class: 'title' }, T.appName),
        h('p', { class: 'banner banner-error', role: 'alert' }, T.fault),
        button(T.completedHome, 'primary', function () { renderStart(); }, { id: 'fault-home' })));
    }

    // ---- baslat
    try {
      config = JSON.parse(doc.getElementById('survey-config').textContent);
      var bankJson = JSON.parse(doc.getElementById('survey-bank').textContent);
      bank = core.bank.load(bankJson);
    } catch (e) {
      fatal(T.fatalBoot);
      return;
    }
    if (bank.validate().length > 0) {
      fatal(T.fatalBank);
      return;
    }
    var storage = null;
    try { storage = root.localStorage; } catch (e) { storage = null; }
    try { audioStore = root.indexedDB ? createAudioStore(root.indexedDB) : null; } catch (e) { audioStore = null; }
    engine = createEngine({
      core: core, bank: bank, config: config, storage: storage, bankChecksum: config.bank_checksum, audioStore: audioStore,
      autoSend: true, // kaydettikce gonderim (kullanici karari 16 Ekim)
      beacon: function (url, text) {
        var nav = root.navigator;
        if (!nav || typeof nav.sendBeacon !== 'function') return false;
        return Boolean(nav.sendBeacon(url, new Blob([text], { type: 'text/plain;charset=utf-8' })));
      },
    });
    engine.subscribe(onSendChange);
    // sayfa kapanirken ya da sekme gizlenince gonderilmemisler sendBeacon ile (yanit beklenmez; tekrar zararsiz)
    root.addEventListener('pagehide', function () { engine.flushBeacon(); });
    doc.addEventListener('visibilitychange', function () {
      if (doc.visibilityState === 'hidden') engine.flushBeacon();
    });
    requestPersistence(root.navigator); // en iyi caba: tarayici depoyu kalici isaretlerse otomatik temizlenmez
    // acilista gonderilmemis veri kendiliginden gider; tamamlanmis anket bekliyorsa son ekran (durumu gorunsun)
    var resumed = engine.resumePendingSends();
    var finished = resumed.map(function (id) { return engine.summary(id); }).filter(function (x) { return x && x.status === 'completed'; })[0];
    if (finished) renderCompleted(finished.sessionId);
    else renderStart();
  }

  var api = {
    STORE_PREFIX: STORE_PREFIX,
    QUARANTINE_PREFIX: QUARANTINE_PREFIX,
    SEND_TIMEOUT_MS: SEND_TIMEOUT_MS,
    MAX_ANSWER_LENGTH: MAX_ANSWER_LENGTH,
    TEXTS: T,
    ERROR_MESSAGES: ERROR_MESSAGES,
    errorMessageFor: errorMessageFor,
    createEngine: createEngine,
    consentItems: consentItems,
    countText: countText,
    pickRecorderMime: pickRecorderMime,
    createAudioStore: createAudioStore,
    AUDIO_MAX_MS: AUDIO_MAX_MS,
    completedText: completedText,
    formatShortDateTime: formatShortDateTime,
    fileNameFor: fileNameFor,
    sessionProblem: sessionProblem,
    saveTextToFile: saveTextToFile,
    requestPersistence: requestPersistence,
    submitOutcome: submitOutcome,
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  root.SurveyApp = api;
  if (typeof document !== 'undefined' && document.getElementById && document.getElementById('app')) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
    else boot();
  }
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
</body>
</html>
