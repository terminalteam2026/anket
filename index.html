  /** Yanan ampul (fikir). */
  function bulb(k, cx, cy) {
    const rays = [];
    for (let i = 0; i < 7; i++) {
      const a = (-150 + i * 30) * (Math.PI / 180);
      rays.push(`M${n(cx + Math.cos(a) * 17)} ${n(cy + Math.sin(a) * 17)}L${n(cx + Math.cos(a) * 23)} ${n(cy + Math.sin(a) * 23)}`);
    }
    return (
      k.circle(cx, cy + 2, 19, '#FFE58A', 'opacity=".35"') +
      k.blink(k.path(rays.join(''), null, '#F2B705', 2.6)) +
      k.path(`M${n(cx - 6)} ${n(cy + 8)}L${n(cx - 5)} ${n(cy + 14)}H${n(cx + 5)}L${n(cx + 6)} ${n(cy + 8)}Z`, '#FFE58A') +
      k.circle(cx, cy, 11, '#FFE58A', 'stroke="#F2B705" stroke-width="1.6"') +
      k.path(`M${n(cx - 6.5)} ${n(cy - 1)}a6.5 6.5 0 0 1 5 -5.6`, null, '#FFFFFF', 2.2) +
      k.rect(cx - 5.5, cy + 13, 11, 7, '#8D97A5', 2) +
      k.path(`M${n(cx - 5.5)} ${n(cy + 16.5)}h11`, null, '#6B7380', 1.2) +
      k.rect(cx - 2.5, cy + 20, 5, 2.4, '#6B7380', 1.2)
    );
  }

  /** El yazısı gibi dalgalı çizgi (harf değil). */
  function squiggle(x0, x1, y, amp, step) {
    let d = `M${x0} ${y}q${n(step / 2)} ${-amp} ${step} 0`;
    for (let x = x0 + step; x + step <= x1; x += step) d += `t${step} 0`;
    return d;
  }

  /** Not kartları ızgarası (not uygulaması). */
  function notesGrid(k) {
    const cards = [
      [4, 30, 28, 36],
      [34, 30, 28, 26],
      [4, 70, 28, 26],
      [34, 60, 28, 36],
      [4, 100, 28, 30],
      [34, 100, 28, 30]

    let s = k.rect(0, 0, 66, 134, '#FFFCF0') + k.appBar(NOTE, 'note', NOTE_INK);
    cards.forEach(([x, y, w, h], i) => {
      s += k.rect(x, y, w, h, i % 3 === 1 ? '#FFE9A8' : '#FFF3C4', 4, 'stroke="#EBCB6B" stroke-width="1"');
      const lines = [w - 9, w - 13, w - 10, w - 15].slice(0, Math.max(1, Math.floor((h - 8) / 6.5)));
      s += k.rect(x + 4, y + 5, w - 12, 3.2, '#B89A3E', 1.6);
      s += k.bars(x + 4, y + 12, lines.slice(1), { gap: 6, h: 2.6, color: '#DCC583' });

  // Not oluşturma: kişinin aklına bir fikir gelir (yanan ampul); sonuçta telefonda yeni bir not sayfası açılır, satırlar kalemle yazılır.

    for (let i = 0; i < 12; i++) {
      const [x, y] = appPos(i);
      if (special && special[i]) s += special[i](x, y);
      else s += k.rect(x - 7.5, y - 7.5, 15, 15, APP_COLS[i], 4.5) + k.circle(x, y, 3, 'rgba(255,255,255,.5)');
    }
    return s;
  }

  // ---- Harita parçaları ---------------------------------------------------------------------------------------

  /** Kategori iğnesi: renkli yuvarlak içinde beyaz simge; (x, y) iğnenin ucu. */
  function catPin(k, x, y, color, name) {
    return (
      k.path(`M${r2(x - 5)} ${r2(y - 9)}L${r2(x)} ${r2(y)}L${r2(x + 5)} ${r2(y - 9)}Z`, color) +
      k.circle(x, y - 13.5, 9.5, color, 'stroke="#FFFFFF" stroke-width="1.8"') +
      ico(name, x, y - 13.5, 12.5, '#FFFFFF', color)
    );
  }

  /** Eczane iğnesi: kitteki eczane simgesi ve altında uç; on: nöbetçi (kırmızı), değilse kapalı (gri). */
  function pharmPin(k, x, y, on, size) {
    const s = size || 15;
    const col = on ? k.C.bad : '#7D8697';
    return (
      k.path(`M${r2(x - 3.6)} ${r2(y - 6)}L${r2(x)} ${r2(y)}L${r2(x + 3.6)} ${r2(y - 6)}Z`, col) +
      k.icon('pharmacy', x, y - 5 - s / 2, s, col, on ? '#FFFFFF' : '#B7BFCC')
    );
  }

  // ---- Web parçaları ------------------------------------------------------------------------------------------

  /** Tarayıcı üst çubuğu: adres kutusu; filled ise içinde kilit ve adres çubuğu. */
  function browserTop(k, filled) {
    const { C } = k;
    let s = k.rect(0, 0, 66, 22, '#E9EDF3') + k.rect(4, 4, 58, 14, '#FFFFFF', 7, `stroke="${C.line}" stroke-width="1"`);
    if (filled) s += k.icon('lock', 11.5, 11, 8.5, C.ok) + k.rect(18, 9.4, 32, 3.2, C.lineDark, 1.6);
    return s;
  }

  /** Örnek web sitesi görünümü: renkli başlık ve resim. (x, y) sol üst, w genişlik. */
  function siteBody(k, x, y, w) {
    const { C } = k;
    const hh = w * 0.2;
    const ih = w * 0.52;
    return (
      k.rect(x, y, w, hh, C.accent2) +
      k.circle(x + hh * 0.6, y + hh / 2, hh * 0.28, '#FFFFFF') +
      k.rect(x + w - hh * 0.95, y + hh * 0.3, hh * 0.55, hh * 0.1, '#FFFFFF', 1) +
      k.rect(x + w - hh * 0.95, y + hh * 0.46, hh * 0.55, hh * 0.1, '#FFFFFF', 1) +
      k.rect(x + w - hh * 0.95, y + hh * 0.62, hh * 0.55, hh * 0.1, '#FFFFFF', 1) +
      k.rect(x + w * 0.06, y + hh + w * 0.06, w * 0.88, ih, '#BFE3F7', 3) +
      k.path(
        `M${r2(x + w * 0.06)} ${r2(y + hh + w * 0.06 + ih)}L${r2(x + w * 0.3)} ${r2(y + hh + ih * 0.55)}L${r2(x + w * 0.46)} ${r2(y + hh + ih * 0.82)}` +
          `L${r2(x + w * 0.66)} ${r2(y + hh + ih * 0.45)}L${r2(x + w * 0.94)} ${r2(y + hh + w * 0.06 + ih)}Z`,
        '#5FA77C'
      ) +
      k.circle(x + w * 0.78, y + hh + ih * 0.32, w * 0.07, '#FFD36B')
    );
  }

  // ---- Müzik çalar parçaları (ekran yerel) --------------------------------------------------------------------

  /** Albüm kapağı; badge verilirse kapak kararır ve ortasında o simge (duraklat, durdur) görünür. */
  function cover(k, color, badge) {
    let s = k.rect(12, 6, 42, 42, color, 8) + k.circle(43, 17, 8, 'rgba(255,255,255,.18)') + k.circle(21, 39, 6, 'rgba(0,0,0,.10)');
    if (badge) s += k.rect(12, 6, 42, 42, '#000', 8, 'opacity=".42"') + k.icon(badge, 33, 27, 20, '#FFFFFF');
    else s += k.icon('music', 33, 27, 22, '#FFFFFF');
    return s;
  }

  function songBars(k, dark) {
    return k.rect(15, 53, 36, 3.6, dark ? '#5A6478' : k.C.lineDark, 1.8) + k.rect(21, 59.5, 24, 3, dark ? '#3A4357' : k.C.line, 1.5);
  }

  const TRACK = { x: 8, y: 74, w: 50 };
  function track(k, dark) {
    return k.rect(TRACK.x, TRACK.y - 2, TRACK.w, 4, dark ? '#3A4357' : k.C.line, 2);
  }
  function trackFill(k, p) {
    return k.rect(TRACK.x, TRACK.y - 2, Math.max(4, TRACK.w * p), 4, k.C.accent, 2);
  }
  function thumb(k, p) {
    return k.circle(TRACK.x + TRACK.w * p, TRACK.y, 4.2, '#FFFFFF', `stroke="${k.C.accent}" stroke-width="2.2"`);
  }

  /** Düğmeler: geri sar, oynat/duraklat, ileri sar. hi: vurgulanan düğme ('rew' ya da 'ff'). */
  function buttons(k, playing, hi, dark) {
    const { C } = k;
    const ink = dark ? '#E9EDF3' : C.ink;
    const side = (name, x) => {
      const on = hi === name;
      return (on ? k.circle(x, 94, 10, C.on) : '') + k.icon(name, x, 94, 13, on ? '#FFFFFF' : ink);
    };
    return (
      side('rew', 13) + side('ff', 53) +
      k.circle(33, 94, 10.5, ink) + k.icon(playing ? 'pause' : 'play', 33, 94, 12, dark ? '#161C29' : '#FFFFFF')
    );
  }

  /** Tam çalar ekranı: o.p ilerleme, o.playing, o.badge (kapak üstü simge), o.dark, o.color, o.halo (düğmenin çevresi atar). */
  function player(k, o) {
    return (
      (o.dark ? k.rect(0, 0, 66, 134, '#161C29') : '') +
      cover(k, o.color || k.C.accent, o.badge) +
      songBars(k, o.dark) +
      track(k, o.dark) +
      trackFill(k, o.p) +
      (o.halo ? k.pulse(k.circle(TRACK.x + TRACK.w * o.p, TRACK.y, 8, k.C.accent, 'opacity=".25"')) : '') +
      thumb(k, o.p) +
      buttons(k, o.playing, o.hi, o.dark)
    );
  }

  /** Telefondan yükselen notalar (sahne koordinatı): müzik çalıyor. */
  function notes(k) {
    const { C } = k;
    return [
      [224, 84, 20, C.accent, 0],
      [334, 62, 22, C.accent2, 0.4],
      [344, 116, 18, C.warn, 0.9],
      [300, 26, 16, C.accent, 1.2]
    ]
      .map(([x, y, s, c, d]) => k.rise(k.icon('music', x, y, s, c), d))
      .join('');
  }

   * kapakta ve düğme sırasında ilgili simge (dir: 'ff' ya da 'rew') vurgulanır; notalar hiç kesilmez.
   */
  function seekScene(k, p0, p1, dir) {
    const { C } = k;
    const x0 = TRACK.x + TRACK.w * p0;
    const x1 = TRACK.x + TRACK.w * p1;
    const sgn = dir === 'ff' ? 1 : -1;
    const arc =
      `M${r2(x0)} 68 Q${r2((x0 + x1) / 2)} 58 ${r2(x1)} 68` +
      `M${r2(x1 - sgn * 4.6)} 66.4 L${r2(x1)} 68.4 L${r2(x1 + sgn * 0.6)} 63.4`;
    // İlerleme düğmesi dolgunun üstünde durmalı; iki katmanda da aynı zamanda kaydığı için geçişte tek düğme gibi görünür.
    const knob = k.move(thumb(k, p0), r2(x1 - x0), 0);
    return {
      bg: 'room',
      screen: cover(k, C.bad) + songBars(k) + track(k),
      screenBefore: trackFill(k, p0) + buttons(k, true) + knob,
      screenAfter:

        buttons(k, true, dir) +
        k.grow(k.circle(33, 27, 14.5, '#8F2328') + k.icon(dir, 33, 27, 18, '#FFFFFF')) +

        knob,
      front: notes(k)
    };
  }

/*

(function (root) {
  'use strict';

  var PAYLOAD_FORMAT = 'sesli-asistan-anket/v1'; // Tasarim 2.0'da alanlar eklendi, ad ayni (TASARIM-v2 §6)
  var AUDIO_FORMAT = 'sesli-asistan-anket/audio-v1'; // ses dosyasi gonderisi (TASARIM-v2 §8.1)
  var AUDIO_MAX_BYTES = 1024 * 1024; // cozulmus ses dosyasi siniri

  // isWhitespace: \t \n \u000B \f \r \u001C-\u001F + bosluk ayiricilari (NBSP haric);
  // isSpaceChar: Zs, Zl, Zp. Birlesimi:

  var BLANK_CHAR = new RegExp('^' + BLANK_CLASS + '$', 'u');
  var BLANK_EDGES = new RegExp('^' + BLANK_CLASS + '+|' + BLANK_CLASS + '+$', 'gu');
  // Kotlin String.trim() (QualityFlags '-' kurali): isWhitespace || isSpaceChar, sifir genislikler haric.
  var WS_CLASS = '[\\p{Zs}\\p{Zl}\\p{Zp}\\t\\n\\u000B\\f\\r\\u001C-\\u001F]';
  var WS_EDGES = new RegExp('^' + WS_CLASS + '+|' + WS_CLASS + '+$', 'gu');

  function isBlankChar(ch) {
    return BLANK_CHAR.test(ch);
  }

  var answerPolicy = {
    /** null, bos ya da yalnizca bosluk (Unicode bosluklari ve NBSP dahil) -> false. */
    isMeaningful: function (text) {
      if (text === null || text === undefined) return false;
      var s = String(text);
      for (var i = 0; i < s.length; i++) {
        if (!isBlankChar(s.charAt(i))) return true;
      }
      return false;
    },
    /** Yalnizca bastaki ve sondaki bosluk kirpilir; ic metne dokunulmaz. */
    confirmedFrom: function (fieldText) {
      return String(fieldText).replace(BLANK_EDGES, '');
    },
  };

  // ---------------------------------------------------------------- QualityFlags

  var Flags = {
    SAME_AS_PROMPT: 'same_as_prompt',
    VERY_SHORT: 'very_short',
    DONT_KNOW: 'dont_know',
    DUPLICATE_IN_SESSION: 'duplicate_in_session',
    POSSIBLE_PII_NUMBER: 'possible_pii_number',
    REDACTED: 'redacted',
  };

  var LETTER_OR_DIGIT = /^[\p{L}\p{Nd}]$/u; // Java Character.isLetterOrDigit = harf (L*) veya Nd

  var SENTENCE_END = /[.!?\u2026]+(?:[ \t\n\x0B\f\r]|(?=[\u0085\u2028\u2029]?$)|$)/;
  var DIGIT_RUN_SRC = '[0-9](?:[ .\\-]?[0-9])*';
  var PII_MIN_DIGITS = 10;

  function normalize(text) {

    var s = String(text).normalize('NFC').replace(/I/g, '\u0131').replace(/\u0130/g, 'i');
    var lower = s.toLocaleLowerCase('tr');
    var out = '';
    var pendingSpace = false;
    for (var ch of lower) {

        if (pendingSpace && out.length > 0) out += ' ';
        pendingSpace = false;
        out += ch;
      } else {

      }

  }

  var DONT_KNOW_PHRASES = new Set(
    ['bilmiyorum', 'fikrim yok', 'bilmiyom', 'yok', 'hiçbir şey'].map(normalize),
  );

  function codePointLength(s) {
    return Array.from(s).length;
  }

  function isSameAsPrompt(normAnswer, prompt) {
    if (normAnswer === normalize(prompt)) return true;
    var m = SENTENCE_END.exec(prompt);
    var first = m ? prompt.substring(0, m.index) : prompt;
    return normAnswer === normalize(first);
  }

  function digitRuns(text) {
    var re = new RegExp(DIGIT_RUN_SRC, 'g');
    var runs = [];
    var m;
    while ((m = re.exec(text)) !== null) {
      runs.push(m[0].replace(/[^0-9]/g, ''));
    }

  }

  }

    Flags: Flags,
    normalize: normalize,
    /** `redacted` burada uretilmez. Bayrak sirasi Kotlin ile ayni. */
    compute: function (answer, prompt, otherAnswersInSession) {
      answer = String(answer);
      prompt = String(prompt);
      var others = otherAnswersInSession ? Array.from(otherAnswersInSession) : [];
      var norm = normalize(answer);
      var flags = [];
      if (norm.length > 0 && isSameAsPrompt(norm, prompt)) flags.push(Flags.SAME_AS_PROMPT);
      if (codePointLength(norm) < 3) flags.push(Flags.VERY_SHORT);
      // "-" normalize sonrasi bos kalir; ham halini ayrica denetle
      if (DONT_KNOW_PHRASES.has(norm) || answer.replace(WS_EDGES, '') === '-') flags.push(Flags.DONT_KNOW);

  // ---------------------------------------------------------------- SessionProgress

  function toSet(done) {
    return done instanceof Set ? done : new Set(done || []);
  }

  var progress = {
    /** Tamamlanmamis en kucuk 0 tabanli konum; hepsi bittiyse null. */
    nextPosition: function (total, doneSet) {
      var done = toSet(doneSet);
      for (var i = 0; i < total; i++) if (!done.has(i)) return i;
      return null;
    },
    isComplete: function (total, doneSet) {
      return progress.nextPosition(total, doneSet) === null;
    },
    restReminderDue: function (n, every) {
      return every > 0 && n > 0 && n % every === 0;
    },
  };

  // ---------------------------------------------------------------- Selection

  function countBy(items, keyFn) {
    var m = new Map();
    items.forEach(function (it) {
      var k = keyFn(it);
      m.set(k, (m.get(k) || 0) + 1);
    });
    return m;
  }

  function SelectionException(message) {
    var e = new Error(message);
    e.name = 'SelectionException';
    return e;
  }

    var e = new Error(message);
    e.name = 'IllegalArgumentException';
    return e;
  }

  function pick(c, camel, snake) {
    return c[camel] !== undefined ? c[camel] : c[snake];
  }
  function issuedOf(c) {
    return Number(pick(c, 'issuedCount', 'issued_count')) || 0;
  }
  function seenOf(c) {
    return Boolean(pick(c, 'seenByParticipant', 'seen_by_participant'));
  }

    var min = Math.min.apply(null, narrowed.map(issuedOf));

  }

  /** Tarayici/Node kripto kaynagindan [0,1) sayi (yanlilik olmasin diye 32 bit / 2^32). */
  function cryptoRng() {

    };

   * Kotlin `Random.nextInt(bound)` karsiligi: [0, bound). rng(bound) -> [0,1); sinir yalniz bilgi icin verilir
   * (ortak vektorlerin geri oynatmasi her cekilisin sinirini denetler, bkz. vectors/README.md `plan_mixed`).
   */
  function nextInt(rng, bound) {
    var v = Math.floor(rng(bound) * bound);
    return v >= bound ? bound - 1 : v;
  }

  /** Fisher-Yates: i = n-1 ... 1 icin j = nextInt(i + 1), yer degistir (Kotlin QuestionSelector.shuffle). */
  function shuffle(items, rng) {
    for (var i = items.length - 1; i >= 1; i--) {
      var j = nextInt(rng, i + 1);
      var tmp = items[i];
      items[i] = items[j];
      items[j] = tmp;
    }
  }

  /** Grup ici secim: gorulmemise daralt (yoksa hepsi), en kucuk issuedCount, aralarindan tekduze (tek aday da cekilir). */
  function pickQuestion(pool, rng) {
    var ties = eligibleTies(pool);
    return ties[nextInt(rng, ties.length)];
  }

  function plannedItem(c, index, functionName, oosLabel) {
    return {
      position: index,
      questionId: pick(c, 'questionId', 'question_id'),
      functionName: functionName,
      oosLabel: oosLabel,
      scenarioType: pick(c, 'scenarioType', 'scenario_type'),
      promptText: pick(c, 'promptText', 'prompt_text'),
      promptVersion: pick(c, 'promptVersion', 'prompt_version'),

  }

  /**
   * QuestionSelector.plan: her gruptan tam bir soru, Fisher-Yates ile karisik sira.
   * kind: 'main' | 'oos'. Adaysiz grup -> SelectionException ("<grup> için etkin soru yok").
   * Web ana oturumu planMixed kullanir; bu, vektorlerle Kotlin'e bagli tutulan genel kuraldir.
   */
  function plan(kind, requiredGroups, candidates, rng) {
    rng = rng || cryptoRng();
    // Kotlin: groupingBy.eachCount().filterValues { it > 1 }.keys -> ilk gorulme sirasi
    var dup = [];

      if (n > 1) dup.push(g);
    });

    var byGroup = new Map();
    Array.from(candidates).forEach(function (c) {
      var g = c.group;
      if (!byGroup.has(g)) byGroup.set(g, []);
      byGroup.get(g).push(c);
    });

    var chosen = requiredGroups.map(function (group) {
      var pool = byGroup.get(group) || [];
      if (pool.length === 0) throw SelectionException(group + ' için etkin soru yok');
      return pickQuestion(pool, rng);
    });
    shuffle(chosen, rng);

    return chosen.map(function (c, index) {
      return plannedItem(c, index, kind === 'main' ? c.group : null, kind === 'oos' ? c.group : null);
    });
  }

  /** Adayin turu: 'function' | 'oos'. `kind` yoksa Kotlin Candidate varsayilani (senaryo tipi oos ise OOS). */
  function kindOf(c) {
    if (c.kind === 'function' || c.kind === 'oos') return c.kind;
    return pick(c, 'scenarioType', 'scenario_type') === 'oos' ? 'oos' : 'function';
  }

  /** Turdeki gruplar (adaylarin ilk gorulme sirasi) -> havuz (giris sirasi). Ayni ad iki turde iki ayri gruptur. */
  function poolsOf(candidates, kind) {
    var pools = new Map();
    candidates.forEach(function (c) {
      if (kindOf(c) !== kind) return;
      if (!pools.has(c.group)) pools.set(c.group, []);
      pools.get(c.group).push(c);
    });
    return pools;
  }

  /**
   * planMixed adim 4: secilen gruplarin havuzlari, secim sirasiyla. Anahtar (gorulmus ? 1 : 0, issuedCount toplami),
   * kararli siralama, esit anahtarli katmanlar; tasan katmanda ihtiyac kadar katman.splice(nextInt(katman.length), 1).
   */
  function pickGroups(pools, count, rng) {
    if (count === 0) return [];
    var ranked = [];
    pools.forEach(function (pool) {
      ranked.push({
        pool: pool,
        seen: pool.some(seenOf) ? 1 : 0,
        issued: pool.reduce(function (sum, c) { return sum + issuedOf(c); }, 0),

      var end = start + 1;

      var tier = ranked.slice(start, end).map(function (r) { return r.pool; });
      var need = count - picked.length;

      } else {

   * (KDoc'taki algoritma; ortak vektorler `plan_mixed`):
   * 1. sayilar: >= 0 ve toplam >= 1, degilse IllegalArgumentException;
   * 2. gruplar tur basina ilk gorulme sirasinda; 3. yeterlilik (once fonksiyon, sonra OOS), cekilisten once;
   * 4. grup secimi (once fonksiyonlar, sonra OOS); 5. grup ici soru; 6. birlesik listede Fisher-Yates.
   * candidates: {questionId, group, kind: 'function'|'oos', issuedCount, seenByParticipant, scenarioType, promptText, promptVersion}.
   */
  function planMixed(functionCount, oosCount, candidates, rng) {
    if (!(isCount(functionCount) && isCount(oosCount) && functionCount + oosCount >= 1)) {
      throw IllegalArgumentException('Soru sayilari gecersiz: fonksiyon ' + functionCount + ', OOS ' + oosCount);
    }
    rng = rng || cryptoRng();
    var list = Array.from(candidates);
    var functionPools = poolsOf(list, 'function');
    var oosPools = poolsOf(list, 'oos');
    if (functionPools.size < functionCount) {
      throw SelectionException('Yeterli fonksiyon yok: ' + functionCount + ' istendi, ' + functionPools.size + ' var');
    }
    if (oosPools.size < oosCount) {
      throw SelectionException('Yeterli kapsam dışı türü yok: ' + oosCount + ' istendi, ' + oosPools.size + ' var');
    }

    var groups = pickGroups(functionPools, functionCount, rng).concat(pickGroups(oosPools, oosCount, rng));
    var chosen = groups.map(function (pool) { return pickQuestion(pool, rng); });
    shuffle(chosen, rng);

    return chosen.map(function (c, index) {
      var fn = kindOf(c) === 'function';
      return plannedItem(c, index, fn ? c.group : null, fn ? null : c.group);
    });
  }

  var selection = {
    eligibleTies: eligibleTies,
    plan: plan,
    planMixed: planMixed,
    cryptoRng: cryptoRng,
    SelectionException: SelectionException,
    IllegalArgumentException: IllegalArgumentException,

  var SCENARIO_TYPES = ['situational', 'direct_goal', 'slot_full', 'slot_optional', 'slot_missing', 'contrast', 'oos'];

  // Kotlin String.isBlank / trim (Char.isWhitespace) - sifir genislikli karakterler sayilmaz
  function isBlankString(s) {

  function sortedBy(items, keyFn) {
    return items.slice().sort(function (a, b) { return keyFn(a) - keyFn(b); });
  }

  function load(bankJson) {
    var file = typeof bankJson === 'string' ? JSON.parse(bankJson) : bankJson;
    if (!file || typeof file !== 'object') throw new Error('Soru havuzu okunamadi');
    var functions = sortedBy(file.functions || [], function (f) { return f.sort_key; });
    var oosLabels = sortedBy(file.oos_labels || [], function (l) { return l.sort_key; });
    var questions = file.questions || [];

    var fnByName = new Map(functions.map(function (f) { return [f.function_name, f]; }));
    var qById = new Map(questions.map(function (q) { return [q.question_id, q]; }));

    function byVariant(list) {
      return list.slice().sort(function (a, b) { return a.variant - b.variant; });
    }

    /** Kotlin QuestionBank.checkGroup: boy min..max; varyantlar 1..n (n = min == max ? max : boy); kimlikler. */
    function checkGroup(problems, group, qs, min, max, idFor) {

        problems.push(group + ': ' + (min === max ? String(min) : min + '..' + max) + ' soru olmali, bulunan: ' + qs.length);
      }
      var n = min === max ? max : qs.length;
      var variants = qs.map(function (q) { return q.variant; }).sort(function (a, b) { return a - b; });
      var want = [];
      for (var v = 1; v <= n; v++) want.push(v);
      if (JSON.stringify(variants) !== JSON.stringify(want)) {
        problems.push(group + ': varyantlar 1..' + n + ' olmali, bulunan: [' + variants.join(', ') + ']');
      }
      qs.forEach(function (q) {
        if (q.variant >= 1 && q.variant <= n && q.question_id !== idFor(q.variant)) {
          problems.push(q.question_id + ': kimlik ' + idFor(q.variant) + ' olmali (' + group + ', varyant ' + q.variant + ')');
        }
      });
    }

    /** QuestionBank.validate ile ayni kurallar; bos liste = gecerli. */
    function validate() {
      var problems = [];
      if (file.schema_version !== 1) problems.push('schema_version 1 olmali, bulunan: ' + file.schema_version);

      countBy(file.functions || [], function (f) { return f.function_name; }).forEach(function (n, k) {
        if (n > 1) problems.push('function_name tekrar ediyor: ' + k);
      });
      countBy(file.oos_labels || [], function (l) { return l.label; }).forEach(function (n, k) {
        if (n > 1) problems.push('oos label tekrar ediyor: ' + k);
      });
      countBy(questions, function (q) { return q.question_id; }).forEach(function (n, k) {
        if (n > 1) problems.push('question_id tekrar ediyor: ' + k);
      });

      var functionNames = new Set((file.functions || []).map(function (f) { return f.function_name; }));
      var labelNames = new Set((file.oos_labels || []).map(function (l) { return l.label; }));

      (file.functions || []).forEach(function (f) {
        countBy(f.params || [], function (p) { return p.name; }).forEach(function (n, k) {
          if (n > 1) problems.push(f.function_name + ': parametre adi tekrar ediyor: ' + k);
        });
      });

      questions.forEach(function (q) {
        var id = q.question_id;
        var hasFunction = q.function_name !== null && q.function_name !== undefined;
        var hasLabel = q.oos_label !== null && q.oos_label !== undefined;
        if (hasFunction === hasLabel) {
          problems.push(id + ": function_name ve oos_label'den tam olarak biri dolu olmali");
        } else if (hasFunction && !functionNames.has(q.function_name)) {
          problems.push(id + ': bilinmeyen function_name: ' + q.function_name);
        } else if (hasLabel && !labelNames.has(q.oos_label)) {
          problems.push(id + ': bilinmeyen oos_label: ' + q.oos_label);
        }
        if (SCENARIO_TYPES.indexOf(q.scenario_type) < 0) {
          problems.push(id + ': bilinmeyen scenario_type: ' + q.scenario_type);
        }
        if (hasFunction && q.scenario_type === 'oos') {
          problems.push(id + ': fonksiyon sorusunun senaryo tipi oos olamaz');
        }
        if (typeof q.prompt_text !== 'string' || isBlankString(q.prompt_text)) {
          problems.push(id + ': prompt_text bos');
        } else {
          if (q.prompt_text !== q.prompt_text.replace(WS_EDGES, '')) {
            problems.push(id + ': prompt_text bas/sonda bosluk iceriyor');
          }
          if (q.prompt_text.normalize('NFC') !== q.prompt_text) problems.push(id + ': prompt_text NFC degil');
        }
        if (!(q.prompt_version >= 1)) problems.push(id + ': prompt_version >= 1 olmali, bulunan: ' + q.prompt_version);
      });

      (file.functions || []).forEach(function (f) {
        var supported = f.is_supported === undefined ? true : f.is_supported;
        var enabled = f.enabled === undefined ? true : f.enabled;
        if (!(supported && enabled)) return;
        var qs = questions.filter(function (q) { return q.function_name === f.function_name; });
        checkGroup(problems, f.function_name, qs, 5, 5, function (v) { return 'Q-' + f.function_no + '-0' + v; });
        if (!qs.some(function (q) { return q.enabled !== false; })) problems.push(f.function_name + ': etkin soru yok');
      });
      // OOS turleri (banka 2.0): 3..99 soru, varyantlar 1..n kesintisiz, kimlik OOS-<tur>-NN (iki hane)
      (file.oos_labels || []).forEach(function (l) {
        var qs = questions.filter(function (q) { return q.oos_label === l.label; });
        checkGroup(problems, l.label, qs, 3, 99, function (v) { return 'OOS-' + l.label + '-' + (v < 10 ? '0' : '') + v; });
        qs.filter(function (q) { return q.scenario_type !== 'oos'; }).forEach(function (q) {
          problems.push(q.question_id + ': OOS sorusunun senaryo tipi oos olmali');
        });
      });
      return problems;
    }

    /** Oturum baslatmak icin gruplar: MAIN etkin+desteklenen fonksiyonlar, OOS etkin turler (sort_key sirasi). */
    function groupsFor(kind) {
      if (kind === 'oos') {
        return oosLabels.filter(function (l) { return l.enabled !== false; }).map(function (l) { return l.label; });
      }
      return functions
        .filter(function (f) { return f.is_supported !== false && f.enabled !== false; })
        .map(function (f) { return f.function_name; });
    }

    /**
     * Seciciye verilecek adaylar. issued: {question_id: n}; seen: Set(question_id).
     * `kind`: 'function' (MAIN gruplari) | 'oos' (planMixed icin).
     */
    function candidatesFor(kind, issued, seen) {
      var groups = new Set(groupsFor(kind));
      var out = [];
      questions.forEach(function (q) {
        if (q.enabled === false) return;
        var group = kind === 'oos' ? q.oos_label : q.function_name;
        if (group === null || group === undefined || !groups.has(group)) return;
        out.push({
          questionId: q.question_id,
          group: group,
          kind: kind === 'oos' ? 'oos' : 'function',
          scenarioType: q.scenario_type,
          promptText: q.prompt_text,
          promptVersion: q.prompt_version,
          issuedCount: (issued && issued[q.question_id]) || 0,
          seenByParticipant: Boolean(seen && seen.has(q.question_id)),
        });
      });
      return out;
    }

    /** Karisik planin adaylari (vektor ve testler icin): etkin fonksiyon sorulari, sonra etkin OOS sorulari. */
    function mixedCandidates(issued, seen) {
      return candidatesFor('main', issued, seen).concat(candidatesFor('oos', issued, seen));
    }

    return {
      file: file,
      bankVersion: file.bank_version,
      functions: functions,
      oosLabels: oosLabels,
      questions: questions,
      function: function (name) { return fnByName.get(name) || null; },
      question: function (id) { return qById.get(id) || null; },
      questionsFor: function (name) { return byVariant(questions.filter(function (q) { return q.function_name === name; })); },
      questionsForOos: function (label) { return byVariant(questions.filter(function (q) { return q.oos_label === label; })); },
      validate: validate,
      groupsFor: groupsFor,
      candidatesFor: candidatesFor,
      mixedCandidates: mixedCandidates,
    };
  }

  // ---------------------------------------------------------------- PlanRules (TASARIM-v2 §1)

  var INVALID_PAYLOAD = 'invalid_payload';
  var PLAN_INVALID = 'plan_invalid';

  var planRules = {
    INVALID_PAYLOAD: INVALID_PAYLOAD,
    PLAN_INVALID: PLAN_INVALID,
    MIN_FUNCTION_QUESTIONS: 1,
    MAX_FUNCTION_QUESTIONS: 86,
    MIN_OOS_QUESTIONS: 0,
    MAX_OOS_QUESTIONS: 11,
    DEFAULT_FUNCTION_QUESTIONS: 17,
    DEFAULT_OOS_QUESTIONS: 3,
    /**
     * PlanRules.planError: null (gecerli) | 'invalid_payload' | 'plan_invalid'. ids JSON'dan gelen ham deger olabilir.
     * 1. dizi degil ya da metin olmayan oge -> invalid_payload (once gelir); 2. her kimlik bankada (enabled'a bakilmaz);
     * 3. fonksiyon sorulari farkli fonksiyonlardan, OOS sorulari farkli turlerden; 4. main: fonksiyon 1..86, OOS 0..11;
     * 5. oos: fonksiyon sorusu yok, bankadaki her OOS turu tam bir kez. Kesin sayi denetlenmez.
     */
    planError: function (kind, ids, bank) {
      if (kind !== 'main' && kind !== 'oos') throw new Error('Bilinmeyen anket turu: ' + kind);
      if (!Array.isArray(ids) || ids.some(function (id) { return typeof id !== 'string'; })) return INVALID_PAYLOAD;
      var functions = [];
      var labels = [];
      for (var i = 0; i < ids.length; i++) {
        var q = bank.question(ids[i]);
        if (!q) return PLAN_INVALID;
        if (q.function_name !== null && q.function_name !== undefined) functions.push(q.function_name);
        if (q.oos_label !== null && q.oos_label !== undefined) labels.push(q.oos_label);
      }
      var fnSet = new Set(functions);
      var labelSet = new Set(labels);
      if (fnSet.size !== functions.length || labelSet.size !== labels.length) return PLAN_INVALID;
      var ok;
      if (kind === 'main') {
        ok = functions.length >= planRules.MIN_FUNCTION_QUESTIONS && functions.length <= planRules.MAX_FUNCTION_QUESTIONS &&
          labels.length >= planRules.MIN_OOS_QUESTIONS && labels.length <= planRules.MAX_OOS_QUESTIONS;
      } else {
        var all = new Set(bank.oosLabels.map(function (l) { return l.label; }));
        ok = functions.length === 0 && labelSet.size === all.size && labels.every(function (l) { return all.has(l); });
      }
      return ok ? null : PLAN_INVALID;
    },
  };

  // ---------------------------------------------------------------- AnswerRules (TASARIM-v2 §2)

  var MAX_ANSWERS = 3;

  var answerRules = {
    MAX_ANSWERS: MAX_ANSWERS,
    /**
     * AnswerRules.extraAllowed: 1 <= answerIndex < MAX_ANSWERS; ayni konumun 0. yaniti *answered* (yoksa null);
     * answerIndex existingIndices'te yok; sira bozulmaz (answerIndex >= 2 icin answerIndex - 1 var).
     * existingIndices: Set ya da dizi; 0'in bulunup bulunmamasi sonucu degistirmez.
     * Web istemcisi uc yaniti birlikte yazdigi icin bunu kullanmaz (TASARIM-v2 §2); Kotlin'le esitligi vektorlerle korunur.
     */
    extraAllowed: function (answerIndex, primaryStatus, existingIndices) {
      var existing = toSet(existingIndices);
      return typeof answerIndex === 'number' && Math.floor(answerIndex) === answerIndex &&
        answerIndex >= 1 && answerIndex < MAX_ANSWERS &&
        primaryStatus === 'answered' &&
        !existing.has(answerIndex) &&
        (answerIndex === 1 || existing.has(answerIndex - 1));
    },
    /**
     * AnswerRules.isDuplicateAnswer: aday, ayni konumun onaylanmis metinlerinden birinin yinelemesi mi ("Bu yanıtı
     * zaten verdin"). normalize esitligi; adayin normalize sonucu bossa (harf/rakam yok) confirmedFrom esitligi.
     */
    isDuplicateAnswer: function (candidate, existingConfirmedTexts) {
      var existing = Array.from(existingConfirmedTexts || []).map(String);
      var norm = normalize(candidate);
      if (norm.length > 0) return existing.some(function (t) { return normalize(t) === norm; });
      var confirmed = answerPolicy.confirmedFrom(candidate);
      return existing.some(function (t) { return answerPolicy.confirmedFrom(t) === confirmed; });
    },
  };

  // ---------------------------------------------------------------- Demographics (TASARIM-v2 §3)

  // Android ile ayni liste ve sira (Kotlin Demographics, ortak vektorler `demographics`). value = wire.
  var DEMOGRAPHIC_FIELDS = [
    {
      field: 'age_range',
      label: 'Yaş aralığı',
      options: [
        { value: '18-24', label: '18–24' },
        { value: '25-34', label: '25–34' },
        { value: '35-44', label: '35–44' },
        { value: '45-54', label: '45–54' },
        { value: '55-64', label: '55–64' },
        { value: '65+', label: '65+' },
      ],
    },
    {
      field: 'region',
      label: 'Yaşadığın bölge',
      options: [
        { value: 'marmara', label: 'Marmara' },
        { value: 'ege', label: 'Ege' },
        { value: 'akdeniz', label: 'Akdeniz' },
        { value: 'ic_anadolu', label: 'İç Anadolu' },
        { value: 'karadeniz', label: 'Karadeniz' },
        { value: 'dogu_anadolu', label: 'Doğu Anadolu' },
        { value: 'guneydogu_anadolu', label: 'Güneydoğu Anadolu' },
        { value: 'yurt_disi', label: 'Yurt dışı' },
      ],
    },
    {
      field: 'assistant_usage',
      label: 'Sesli asistan kullanma sıklığı',
      options: [
        { value: 'never', label: 'Hiç kullanmıyorum' },
        { value: 'rarely', label: 'Ayda birkaç kez ya da daha az' },
        { value: 'weekly', label: 'Haftada birkaç kez' },
        { value: 'daily', label: 'Her gün' },
      ],
    },
  ];

  function demographicField(field) {
    for (var i = 0; i < DEMOGRAPHIC_FIELDS.length; i++) if (DEMOGRAPHIC_FIELDS[i].field === field) return DEMOGRAPHIC_FIELDS[i];
    throw new Error('Bilinmeyen katilimci bilgisi alani: ' + field);
  }

  var demographics = {
    FIELDS: DEMOGRAPHIC_FIELDS,
    FIELD_NAMES: DEMOGRAPHIC_FIELDS.map(function (f) { return f.field; }),
    options: function (field) { return demographicField(field).options; },
    /**
     * Demographics.isValid: null (ve undefined: alan yok) her zaman gecerli; aksi halde bir secenegin wire degerine
     * birebir esit metin. Bos metin, etiket, buyuk harf, bosluklu bicim, sayi, mantiksal, dizi, nesne gecersiz.
     */
    isValid: function (field, value) {
      var opts = demographicField(field).options;
      if (value === null || value === undefined) return true;
      return typeof value === 'string' && opts.some(function (o) { return o.value === value; });
    },
    /** wire degerinin ekran metni; bilinmeyen deger icin null. */
    label: function (field, wire) {
      var opts = demographicField(field).options;
      for (var i = 0; i < opts.length; i++) if (opts[i].value === wire) return opts[i].label;
      return null;
    },
  };

  // ---------------------------------------------------------------- Payload (TASARIM §9 + TASARIM-v2 §5, hedef etiket yok)

  function nul(v) {
    return v === undefined ? null : v;
  }

  function sessionPayload(s) {
    return {
      session_id: s.session_id,
      participant_pseudonym: nul(s.participant_pseudonym),
      survey_kind: s.survey_kind,
      consent_version: s.consent_version,
      consent_time: s.consent_time,
      started_at: s.started_at,
      last_active_at: s.last_active_at,
      finished_at: nul(s.finished_at),
      status: s.status,
      current_question_index: s.current_question_index,
      selected_question_ids: (s.selected_question_ids || []).slice(),
      total_questions: s.total_questions,
      bank_version: s.bank_version,
      app_version: s.app_version,
      tz_id: s.tz_id,
      // katilimci bilgisi: bos gecilen ya da eski oturumda olmayan alan null
      age_range: nul(s.age_range),
      region: nul(s.region),
      assistant_usage: nul(s.assistant_usage),
      // ozellik onerileri (TASARIM-v2 §5): dolu alanlar, sirasiyla; yoksa []
      feature_suggestions: Array.isArray(s.feature_suggestions) ? s.feature_suggestions.slice() : [],
      // ses kaydi onayi (TASARIM-v2 §8.1): yoksa false
      audio_consent: s.audio_consent === true,
    };
  }

  function responseOf(state, pos) {
    var rs = state.responses;
    if (Array.isArray(rs)) {
      for (var i = 0; i < rs.length; i++) if (rs[i].position === pos) return rs[i];
      return null;
    }
    return (rs && rs[pos]) || (rs && rs[String(pos)]) || null;
  }

  /** Depodaki ek yanitlar (answer_index 1, 2): `responses[pos].extras`; eski kayitta yok. */
  function extrasOf(r) {
    return r && Array.isArray(r.extras) ? r.extras : [];
  }

  /**
   * Tek yanit satiri. r: konumun 0. yaniti (konum, soru, surum ondan); a: satirin kendisi (0. yanitta r, ek yanitta
   * extras[answerIndex - 1]). Ek yanitin kendi kimlikleri, zamanlari ve kalite bayraklari vardir; durumu her zaman answered.
   * Ses kaydi olan satir (TASARIM-v2 §8.1): has_audio true, input_mode voice, audio_duration_ms; audio_uri ilk gonderide bos.
   */
  function answerPayload(state, r, a, answerIndex) {
    var audio = a.has_audio === true;
    return {
      response_id: a.response_id,
      session_id: r.session_id || state.session_id,
      position: r.position,
      answer_index: answerIndex,
      question_id: r.question_id,
      prompt_version: r.prompt_version,
      input_mode: audio ? 'voice' : 'text',
      raw_text: a.raw_text,
      asr_text: null,
      confirmed_text: a.confirmed_text,
      asr_engine_version: null,
      audio_uri: null,
      status: answerIndex === 0 ? r.status : 'answered',
      answered_at: a.answered_at,
      tz_id: a.tz_id,
      attempt_count: a.attempt_count,
      client_event_id: a.client_event_id,
      shown_at: nul(a.shown_at),
      asr_attempts: [],
      quality_flags: (a.quality_flags || []).slice(),
      has_audio: audio,
      audio_duration_ms: audio && typeof a.audio_duration_ms === 'number' ? Math.round(a.audio_duration_ms) : null,
    };
  }

  /** Ses dosyasi mime turu kabul edilir mi (`;codecs=...` uzantisi serbest). */
  function audioMimeOk(mime) {
    return typeof mime === 'string' && AUDIO_MIMES.indexOf(mime.split(';')[0].trim().toLowerCase()) >= 0;
  }

  /**
   * Ses dosyasi gonderisi (TASARIM-v2 §8.1): {format, study_id, study_key, session_id, response_id, mime, duration_ms, data}.
   * data base64; cozulmus hali en cok 1 MB.
   */
  function audioSubmission(meta) {
    return {
      format: AUDIO_FORMAT,
      study_id: meta.study_id,
      study_key: nul(meta.study_key),
      session_id: meta.session_id,
      response_id: meta.response_id,
      mime: meta.mime,
      duration_ms: Math.round(meta.duration_ms),
      data: meta.data,
    };
  }

  /** base64 metninin cozulmus bayt sayisi. */
  function base64Bytes(data) {
    var s = String(data || '');
    var pad = s.endsWith('==') ? 2 : s.endsWith('=') ? 1 : 0;
    return Math.floor(s.length * 3 / 4) - pad;
  }

  /** Konumun 0. yaniti (answer_index 0). */
  function responsePayload(state, pos) {
    var r = responseOf(state, pos);
    if (!r) throw new Error('Yanit yok: konum ' + pos);
    return answerPayload(state, r, r, 0);
  }

  /** Konumun ek yaniti (answerIndex 1 ya da 2). */
  function extraPayload(state, pos, answerIndex) {
    var r = responseOf(state, pos);
    var a = extrasOf(r)[answerIndex - 1];
    if (!r || !a) throw new Error('Ek yanit yok: konum ' + pos + ', yanit ' + answerIndex);
    return answerPayload(state, r, a, answerIndex);
  }

  function responsePositions(state) {
    var rs = state.responses;
    var list = Array.isArray(rs) ? rs : Object.keys(rs || {}).map(function (k) { return rs[k]; });
    return list.map(function (r) { return r.position; }).sort(function (a, b) { return a - b; });
  }

  /** Butun yanit satirlari: konum sirasiyla, her konumda 0. yanit ve ardindan ek yanitlar (answer_index 1, 2). */
  function allResponses(state) {
    var out = [];
    responsePositions(state).forEach(function (p) {
      out.push(responsePayload(state, p));
      extrasOf(responseOf(state, p)).forEach(function (_, i) { out.push(extraPayload(state, p, i + 1)); });
    });
    return out;
  }

  /**
   * Tum gonderi: {format, study_id, study_key, app_version, bank_version, bank_checksum, sent_at, session, responses}.
   * meta: {study_id, study_key, bank_checksum, sent_at}. Ek yanitlar ayri `responses[]` ogeleridir.
   */
  function submission(state, meta) {
    return {
      format: PAYLOAD_FORMAT,
      study_id: meta.study_id,
      study_key: nul(meta.study_key),
      app_version: APP_VERSION,
      bank_version: state.bank_version,
      bank_checksum: meta.bank_checksum,
      sent_at: meta.sent_at,
      session: sessionPayload(state),
      responses: allResponses(state),
    };
  }

  var payload = {
    FORMAT: PAYLOAD_FORMAT,
    session: sessionPayload,
    response: responsePayload,
    extra: extraPayload,
    responses: allResponses,
    submission: submission,
    AUDIO_FORMAT: AUDIO_FORMAT,
    AUDIO_MAX_BYTES: AUDIO_MAX_BYTES,
    AUDIO_MIMES: AUDIO_MIMES,
    audioMimeOk: audioMimeOk,
    audio: audioSubmission,
    base64Bytes: base64Bytes,
  };

  // ---------------------------------------------------------------- Gonderim: otomatik yeniden deneme politikasi

  var RETRY_DELAYS_MS = [5000, 15000, 45000]; // 1., 2., 3. yeniden deneme; sonra her 2 dk
  var RETRY_STEADY_MS = 120000;
  var RETRY_JITTER = 0.2; // ±%20
  var TRANSIENT_ERRORS = ['busy', 'rate_limited', 'server_error'];

  var retry = {
    DELAYS_MS: RETRY_DELAYS_MS,
    STEADY_MS: RETRY_STEADY_MS,
    JITTER: RETRY_JITTER,
    TRANSIENT_ERRORS: TRANSIENT_ERRORS,
    /** attempt. yeniden denemeden once beklenecek sure (1 tabanli): 5, 15, 45 sn, sonra 120 sn; rand() -> [0,1) jitter. */
    delayMs: function (attempt, rand) {
      var n = Math.max(1, Math.floor(attempt) || 1);
      var base = n <= RETRY_DELAYS_MS.length ? RETRY_DELAYS_MS[n - 1] : RETRY_STEADY_MS;
      var r = typeof rand === 'function' ? rand() : 0.5;
      return Math.round(base * (1 - RETRY_JITTER + 2 * RETRY_JITTER * r));
    },
    /**
     * Bir gonderi denemesinin sonucu: 'ok' | 'transient' (kendiliginden yeniden denenir) | 'permanent' (durulur, ileti
     * gosterilir). outcome: {ok} ya da {code: network|timeout|unexpected|rejected|..., status, error}.
     * Gecici: ag hatasi, zaman asimi, sozlesme disi her yanit ('unexpected': HTML sayfasi, HTTP 404/5xx, saglik JSON'u,
     * alindi kodu ya da audio_uri olmayan ok:true, ok alani olmayan JSON; Google'in yonlendirme katmani bunlari ara sira
     * donduruyor, alicilar tekrari ayiklar) ve ok:false ile busy / rate_limited / server_error. Alicinin kendi hata
     * kodlari (wrong_study_key, invalid_payload, payload_too_large, plan_invalid, bilinmeyen kodlar...) ve yerel
     * hatalar kalici.
     */
    classify: function (o) {
      if (!o) return 'transient';
      if (o.ok === true) return 'ok';
      switch (o.code) {
        case 'network':
        case 'timeout':
        case 'unexpected':
          return 'transient';
        case 'rejected':
          return TRANSIENT_ERRORS.indexOf(o.error) >= 0 ? 'transient' : 'permanent';
        default:
          return 'permanent';
      }
    },
  };

  var api = {
    APP_VERSION: APP_VERSION,
    retry: retry,
    answerPolicy: answerPolicy,
    qualityFlags: qualityFlags,
    progress: progress,
    selection: selection,
    bank: { load: load },
    planRules: planRules,
    answerRules: answerRules,
    demographics: demographics,
    payload: payload,
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  root.SurveyCore = api;
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>
/*
 * Sesli Asistan Anketi - web istemcisi.
 * Iki katman: (1) DOM'suz durum katmani (createEngine: yerel depo, oturum gecisleri, gonderim) - Node'da test edilir;
 * (2) arayuz (boot): yalnizca tarayicida, `document` varsa calisir. Katilimci metni hicbir yere loglanmaz.
 */

  /**

   * araştırmada yazili bir cevap 26-38 sn suruyor); 86 soruluk eski oturum icin eski metin.
   */
  function durationText(n) {
    if (n <= 25) return '10–15';
    if (n <= 45) return '20–30';
    return '30–45';
  }

  /** Alici hata kodu -> iletı; bilinmeyen kod aynen (kirpilmis) gosterilir. */
  function errorMessageFor(code) {
    if (typeof code === 'string' && Object.prototype.hasOwnProperty.call(ERROR_MESSAGES, code)) return ERROR_MESSAGES[code];
    var shown = String(code === undefined || code === null ? '' : code).replace(/[\u0000-\u001f\u007f]/g, ' ').slice(0, 60);
    return 'Alıcı gönderiyi kabul etmedi (' + (shown || 'bilinmeyen hata') + ').';
  }

  function clone(v) {
    return JSON.parse(JSON.stringify(v));
  }

  function randomUuid() {
    var c = root.crypto;
    var b = new Uint8Array(16);
    c.getRandomValues(b);
    b[6] = (b[6] & 0x0f) | 0x40;
    b[8] = (b[8] & 0x3f) | 0x80;
    var hex = Array.prototype.map.call(b, function (x) { return (x + 256).toString(16).slice(1); }).join('');
    return hex.slice(0, 8) + '-' + hex.slice(8, 12) + '-' + hex.slice(12, 16) + '-' + hex.slice(16, 20) + '-' + hex.slice(20);
  }

  function defaultTzId() {
    try {
      return Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
    } catch (e) {
      return 'UTC';
    }
  }

  function pad2(n) {
    return (n < 10 ? '0' : '') + n;
  }

  /** "9 Eki 14:02" (Android'deki d MMM HH:mm). */
  function formatShortDateTime(ms) {
    var d = new Date(ms);
    var parts = {};
    try {
      new Intl.DateTimeFormat('tr-TR', { day: 'numeric', month: 'short' }).formatToParts(d).forEach(function (p) {
        parts[p.type] = p.value;
      });
    } catch (e) {
      parts = {};
    }
    var datePart = parts.day && parts.month ? parts.day + ' ' + parts.month : d.getDate() + '.' + (d.getMonth() + 1);
    return datePart + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }

  /**
   * Ses kayitlari deposu (TASARIM-v2 §8: localStorage'a sigmaz): IndexedDB 'sesli-anket-ses', anahtar response_id.
   * put(id, {blob, mime, duration_ms, session_id}), get(id) -> {mime, duration_ms, data(base64)} | null, remove(id).
   */
  function createAudioStore(idb) {
    var opened = null;
    function db() {
      if (!opened) {
        opened = new Promise(function (resolve, reject) {
          var req = idb.open('sesli-anket-ses', 1);
          req.onupgradeneeded = function () { req.result.createObjectStore('audio'); };
          req.onsuccess = function () { resolve(req.result); };
          req.onerror = function () { reject(req.error); };
        });
      }
      return opened;
    }
    function tx(mode, fn) {
      return db().then(function (d) {
        return new Promise(function (resolve, reject) {
          var t = d.transaction('audio', mode);
          var out = fn(t.objectStore('audio'));
          t.oncomplete = function () { resolve(out && 'result' in out ? out.result : undefined); };
          t.onerror = function () { reject(t.error); };
          t.onabort = function () { reject(t.error); };
        });
      });
    }
    function toBase64(blob) {
      return new Promise(function (resolve, reject) {
        var r = new FileReader();
        r.onload = function () { resolve(String(r.result).replace(/^data:[^,]*,/, '')); };
        r.onerror = function () { reject(r.error); };
        r.readAsDataURL(blob);
      });
    }
    return {
      put: function (id, rec) { return tx('readwrite', function (st) { return st.put(rec, id); }); },
      remove: function (id) { return tx('readwrite', function (st) { return st.delete(id); }); },
      getRecord: function (id) { return tx('readonly', function (st) { return st.get(id); }); },
      get: function (id) {
        return this.getRecord(id).then(function (rec) {
          if (!rec || !rec.blob) return null;
          return toBase64(rec.blob).then(function (data) { return { mime: rec.mime, duration_ms: rec.duration_ms, data: data }; });
        });
      },
    };
  }

  /** MediaRecorder icin desteklenen ses bicimi (TASARIM-v2 §8: webm/opus ya da mp4); yoksa null. */
  function pickRecorderMime(MR) {
    if (!MR || typeof MR.isTypeSupported !== 'function') return null;
    var list = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
    for (var i = 0; i < list.length; i++) if (MR.isTypeSupported(list[i])) return list[i];
    return null;
  }

  /** Kart ozeti "N yanıt, M geçilen": ek yanitlar da yanittir (gonderide her biri ayri satir). s: summary(). */
  function countText(s) {
    return (s.answered + (s.extras || 0)) + ' yanıt, ' + s.skipped + ' geçilen';
  }

  /** Tamamlandi ekrani: "17 soru yanıtlandı, 3 soru geçildi." (+ ek yanit varsa toplam yanit sayisi). */
  function completedText(s) {
    var text = s.answered + ' soru yanıtlandı, ' + s.skipped + ' soru geçildi.';
    if (s.extras > 0) text += ' Ek yanıtlarla birlikte toplam ' + (s.answered + s.extras) + ' yanıt verdin.';
    return text;
  }

  /** anket-<oturum8>-<yyyyMMdd-HHmm>.json (yerel saat). */
  function fileNameFor(sessionId, ms) {
    var d = new Date(ms);
    var stamp = '' + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + '-' + pad2(d.getHours()) + pad2(d.getMinutes());
    return 'anket-' + String(sessionId).slice(0, 8) + '-' + stamp + '.json';
  }

  function placeholder(v) {
    var s = v === undefined || v === null ? '' : String(v).trim();
    return s === '' ? '[belirlenmedi]' : s;
  }

  function isPlainObject(v) {
    return v !== null && typeof v === 'object' && !Array.isArray(v);
  }

  /** Alicinin sozlesme hatasi: {"ok": false, "error": "<kod>"} (bos olmayan kod). */
  function isErrorReply(reply) {
    return isPlainObject(reply) && reply.ok === false && typeof reply.error === 'string' && reply.error !== '';
  }

  /**
   * Sozlesme disi yanit (HTML sayfasi, saglik JSON'u, alindi kodu olmayan ok:true, HTTP 404/5xx...): gecicidir,
   * gonderi yeniden denenir (alicilar response_id ile tekrari ayiklar).
   */
  function unexpectedReply(status) {
    var http = typeof status === 'number' && (status < 200 || status >= 300) ? ' (HTTP ' + status + ')' : '';
    return { ok: false, code: 'unexpected', status: status, message: T.sendUnexpected + http + '.' };
  }

  function isStr(v) {
    return typeof v === 'string';
  }
  function isNum(v) {
    return typeof v === 'number' && isFinite(v);
  }
  function isInt(v) {
    return isNum(v) && Math.floor(v) === v;
  }

  var SESSION_STATUSES = ['in_progress', 'paused', 'completed', 'abandoned'];

  function isOptNum(v) {
    return v === undefined || v === null || isNum(v);
  }

  /** Ek yanit kaydi (TASARIM-v2 §5): sorun yoksa null, varsa alan adi. */
  function extraProblem(e, audioConsent) {
    if (!isPlainObject(e)) return 'nesne degil';
    if (!isStr(e.response_id) || !isStr(e.client_event_id) || !isStr(e.raw_text) || !isStr(e.confirmed_text)) return 'alanlar';
    if (!isNum(e.answered_at) || !isOptNum(e.shown_at) || !isStr(e.tz_id) || !isInt(e.attempt_count)) return 'zamanlar';
    if (e.quality_flags !== undefined && !Array.isArray(e.quality_flags)) return 'quality_flags';
    return audioProblem(e, audioConsent);
  }

  /** Ses kaydi alanlari (TASARIM-v2 §8.1): has_audio true ise oturum onayi, sure ve mime olmali. */
  function audioProblem(r, audioConsent) {
    if (r.has_audio === undefined || r.has_audio === false) return null;
    if (r.has_audio !== true) return 'has_audio';
    if (!audioConsent) return 'ses onayi yok';
    if (!isInt(r.audio_duration_ms) || r.audio_duration_ms < 0 || !isStr(r.audio_mime)) return 'ses alanlari';
    return null;
  }

  /**
   * Bir oturum kaydinin bicim denetimi: sorun yoksa null, varsa kisa aciklama. Motorun dokundugu her alan
   * burada dogrulanir; boylece bozuk bir kayit ekrani cokertmez (WR1-10). Tasarim 2.0 alanlari (katilimci bilgisi,
   * ek yanitlar) eski kayitlarda yoktur; varsa gecerli olmalidir. core: SurveyCore (verilmezse genel nesne).
   */
  function sessionProblem(key, s, core) {
    var C = core || root.SurveyCore;
    if (!isPlainObject(s)) return 'oturum bir nesne degil';
    if (!isStr(s.session_id) || s.session_id === '' || s.session_id !== key) return 'session_id';
    if (!isStr(s.study_id) || s.study_id === '') return 'study_id';
    if (!isStr(s.bank_checksum)) return 'bank_checksum';
    if (s.survey_kind !== 'main' && s.survey_kind !== 'oos') return 'survey_kind';
    if (SESSION_STATUSES.indexOf(s.status) < 0) return 'status';
    if (!isInt(s.total_questions) || s.total_questions < 0 || s.total_questions > 10000) return 'total_questions';
    if (!Array.isArray(s.items) || s.items.length !== s.total_questions) return 'items';
    for (var i = 0; i < s.items.length; i++) {
      var it = s.items[i];
      if (!isPlainObject(it) || !isStr(it.question_id) || !isStr(it.prompt_text) || it.position !== i) return 'items[' + i + ']';
    }
    if (!isNum(s.started_at) || !isNum(s.last_active_at) || !isNum(s.consent_time)) return 'zamanlar';
    if (!isStr(s.consent_version) || !isStr(s.bank_version) || !isStr(s.app_version) || !isStr(s.tz_id)) return 'surum alanlari';
    if (s.participant_pseudonym !== null && s.participant_pseudonym !== undefined && !isStr(s.participant_pseudonym)) return 'participant_pseudonym';
    for (var d = 0; d < C.demographics.FIELD_NAMES.length; d++) {
      var field = C.demographics.FIELD_NAMES[d];
      if (!C.demographics.isValid(field, s[field])) return field;
    }
    // ozellik onerileri (TASARIM-v2 §5): en cok 10 dolu dizge, her biri en cok 300 karakter; eski kayitta yok
    if (s.feature_suggestions !== undefined) {
      var fs = s.feature_suggestions;
      if (!Array.isArray(fs) || fs.length > MAX_SUGGESTIONS || !fs.every(function (x) {
        return isStr(x) && x.length <= MAX_SUGGESTION_LENGTH && C.answerPolicy.isMeaningful(x);
      })) return 'feature_suggestions';
    }
    if (s.audio_consent !== undefined && typeof s.audio_consent !== 'boolean') return 'audio_consent';
    if (!Array.isArray(s.selected_question_ids)) return 'selected_question_ids';
    if (!isPlainObject(s.responses)) return 'responses';
    var ids = new Set();
    var keys = Object.keys(s.responses);
    for (var k = 0; k < keys.length; k++) {
      var r = s.responses[keys[k]];
      var at = 'responses[' + keys[k] + ']';
      if (!isPlainObject(r) || !isInt(r.position) || String(r.position) !== keys[k] || r.position < 0 || r.position >= s.total_questions) {
        return at;
      }
      if (!isStr(r.response_id) || !isStr(r.question_id) || !isStr(r.raw_text) || !isStr(r.confirmed_text)) return at + ' alanlari';
      if (r.status !== 'answered' && r.status !== 'skipped') return at + '.status';
      if (!isNum(r.answered_at) || !isStr(r.tz_id) || !isInt(r.attempt_count) || !isStr(r.client_event_id)) return at + ' kimlikler';
      if (r.quality_flags !== undefined && !Array.isArray(r.quality_flags)) return at + '.quality_flags';
      var audioBad = audioProblem(r, s.audio_consent === true);
      if (audioBad !== null) return at + ' ' + audioBad;
      // ek yanitlar: yalniz 0. yaniti answered olan konumda, en cok MAX_ANSWERS - 1 tane (AnswerRules)
      if (r.extras !== undefined) {
        if (!Array.isArray(r.extras) || r.extras.length > C.answerRules.MAX_ANSWERS - 1) return at + '.extras';
        if (r.extras.length > 0 && r.status !== 'answered') return at + '.extras';
        for (var x = 0; x < r.extras.length; x++) {
          var bad = extraProblem(r.extras[x], s.audio_consent === true);
          if (bad !== null) return at + '.extras[' + x + '] ' + bad;
        }
      }
      // yanit kimligi alicinin tekrar ayiklama anahtari: ayni oturumda iki kez gecemez
      var rowIds = [r.response_id].concat((r.extras || []).map(function (e) { return e.response_id; }));
      for (var j = 0; j < rowIds.length; j++) {
        if (ids.has(rowIds[j])) return at + ' response_id tekrari';
        ids.add(rowIds[j]);
      }
    }
    if (s.audio_sent !== undefined && !(Array.isArray(s.audio_sent) && s.audio_sent.every(isStr))) return 'audio_sent';
    if (s.auto_send !== undefined && typeof s.auto_send !== 'boolean') return 'auto_send';
    if ((s.rev !== undefined && !(isInt(s.rev) && s.rev >= 0)) || (s.sent_rev !== undefined && !(isInt(s.sent_rev) && s.sent_rev >= 0))) return 'rev';
    if (s.sent_ids !== undefined && !Array.isArray(s.sent_ids)) return 'sent_ids';
    if (s.sent_rejected !== undefined && !Array.isArray(s.sent_rejected)) return 'sent_rejected';
    if (s.sent_at !== undefined && s.sent_at !== null && !isNum(s.sent_at)) return 'sent_at';
    return null;
  }

  /**
   * Dosyaya kaydet. env: {showSaveFilePicker (bagli islev ya da null), download(name, text) -> Promise}.
   * Donus: 'saved' (secici dosyayi yazip kapatti) | 'download' (indirme baslatildi, sonucu bilinmez) | 'cancelled'.
   * "Kaydedildi" yalnizca 'saved' icin soylenebilir (WR1-09).
   */
  function saveTextToFile(env, name, text) {
    if (typeof env.showSaveFilePicker !== 'function') {
      return Promise.resolve().then(function () { return env.download(name, text); }).then(function () { return 'download'; });
    }
    return Promise.resolve()
      .then(function () {
        return env.showSaveFilePicker({
          suggestedName: name,
          types: [{ description: 'JSON dosyası', accept: { 'application/json': ['.json'] } }],
        });
      })
      .then(function (handle) {
        return handle.createWritable().then(function (w) {
          return w.write(text).then(function () { return w.close(); });
        });
      })
      .then(
        function () { return 'saved'; },
        function (e) {
          if (e && e.name === 'AbortError') return 'cancelled';
          // izin/guvenlik/yazma hatasinda indirme yoluna dus
          return Promise.resolve().then(function () { return env.download(name, text); }).then(function () { return 'download'; });
        },
      );
  }

  /** navigator.storage.persist() - en iyi cabayla; gizli pencerede ya da desteklenmiyorsa false. */
  function requestPersistence(nav) {
    try {
      if (!nav || !nav.storage || typeof nav.storage.persist !== 'function') return Promise.resolve(false);
      return Promise.resolve(nav.storage.persist()).then(function (v) { return Boolean(v); }, function () { return false; });
    } catch (e) {
      return Promise.resolve(false);
    }
  }

  /** Kaydetme sonucunun ekran karari (DOM'suz, testlenebilir). */
  function submitOutcome(res, action, texts) {
    if (res && res.ok) return { kind: res.completed ? 'completed' : 'next', restDue: Boolean(res.restDue) };
    var reason = res && res.reason;
    if (reason === 'storage') return { kind: 'storage_error' };
    if (reason === 'empty') return { kind: 'empty' };
    if (reason === 'too_long') return { kind: 'too_long' };
    if (reason === 'duplicate') return { kind: 'duplicate' };
    // bayat sekme: yazilan metinler yeni ekrana tasinir (kaybolmasin), kullanici gorup duzeltir; gecmede tasinmaz
    if (reason === 'stale') {
      var carry = action === 'answer' && Array.isArray(texts)
        ? texts.map(function (t) { return String(t === undefined || t === null ? '' : t); }) : [];
      return { kind: 'stale', carryTexts: carry };
    }
    return { kind: 'restart' };
  }

  /**
   * Kisa onay metni (kullanici istegi 16 Ekim: "çok uzun"): amac cumlesi T.consentPurpose ve bes madde
   * [{label, text}]. [belirlenmedi] yer tutuculari yapilandirmadan doldurulur.
   */
  function consentItems(config) {
    var c = config.consent || {};
    var send = config.send && config.send.type !== 'none'
      ? 'Yanıtların, kaydettikçe kısa aralıklarla araştırmacıya iletilir; gönderilen yanıtlarının silinmesini istersen araştırmacıya bildirebilirsin.'
      : 'Yanıtların bu bilgisayarda kalır; bitirince "Dosyaya kaydet" ile araştırmacıya iletirsin.';
    return [
      { label: 'Kaydedilen', text: 'Yazdığın cümleler; ses kaydına onay verirsen sesli cevapların da. Soru ve zaman bilgisi. Adın, telefon numaran ya da cihaz kimliğin kaydedilmez.' },
      { label: 'Gönderim', text: send },
      { label: 'Kullanım', text: 'Sesli asistanın eğitimi ve testi. Paylaşım: ' + placeholder(c.sharing) + '.' },
      { label: 'Veri sorumlusu', text: placeholder(c.controller) + ' (iletişim: ' + placeholder(c.contact) + '). Saklama: ' + placeholder(c.retention) + '.' },
      { label: 'Katılım gönüllü', text: 'istediğin soruyu geçebilir, istediğin an bırakabilirsin.' },
    ];
  }

  // ------------------------------------------------------------------ durum katmani

  /**
   * opts: {core, bank (core.bank.load sonucu), config, storage, now, newId, tzId, rng, bankChecksum}
   * storage: getItem/setItem/removeItem (localStorage benzeri); yoksa bellek ici.
   */
  function createEngine(opts) {
    var core = opts.core;
    var bank = opts.bank;
    var config = opts.config;
    var storage = opts.storage || null;
    var now = opts.now || Date.now;
    var newId = opts.newId || randomUuid;
    var tzId = opts.tzId || defaultTzId;
    var rng = opts.rng || null;
    // ses kayitlari deposu (tarayicida IndexedDB): get(response_id) -> Promise<{mime, data(base64)} | null>
    var audioStore = opts.audioStore || null;
    // yeniden deneme zamanlayicisi (testte sahte), jitter rastgelesi ve zaman olcegi (yuk testi zamani sikistirir)
    var timers = opts.timers || {
      setTimeout: function (fn, ms) { return setTimeout(fn, ms); },
      clearTimeout: function (t) { clearTimeout(t); },
    };
    var random = opts.random || Math.random;
    // bekleme olcegi (yuk testi zamani sikistirir): aralik ve yeniden deneme sureleri bununla carpilir
    var delayScale = typeof opts.delayScale === 'number' && opts.delayScale >= 0 ? opts.delayScale : 1;
    // artimli gonderim (tarayicida acik; testte yalniz istenince): kaydettikce gonderir
    var autoSend = opts.autoSend === true;
    var defaultFetch = opts.fetchImpl || null;
    var beaconImpl = opts.beacon || null; // (url, metin) -> bool: navigator.sendBeacon
    var closed = false;
    var checksum = opts.bankChecksum || config.bank_checksum || '';
    var sendCfg = config.send || { type: 'none' };
    var studyId = String(config.study_id);
    var storeKey = STORE_PREFIX + studyId;
    var quarantineKey = QUARANTINE_PREFIX + studyId;

    var data = emptyStore();
    var blocked = false; // bozuk veri ayrilamadi: ustune yazmak veri kaybettirir, yazmalar reddedilir
    var inflight = Object.create(null); // "<oturum>:<konum>" -> {eventId, attempts, shownAt}: yeniden denemelerde sabit
    var senders = Object.create(null); // oturum -> gonderici durumu (ucustaki istek, bekleme, aralik)
    var progress = Object.create(null); // oturum -> ses gonderim ilerleme metni
    var beaconed = Object.create(null); // oturum -> {key, at}: son beacon (kapanista iki olay ayni veriyi iki kez atmasin)
    var lastSend = Object.create(null); // oturum -> son gonderim sonucu (bellekte)
    var listeners = [];

    function emptyStore() {
      return { version: 2, sessions: {}, issued: {} };
    }

    // ---- bozuk kayit karantinasi (WR1-10)

    function readQuarantine() {
      var raw;
      try {
        raw = storage.getItem(quarantineKey);
      } catch (e) {
        return null;
      }
      if (raw === null || raw === undefined || raw === '') return { version: 1, items: [] };
      try {
        var q = JSON.parse(raw);
        if (isPlainObject(q) && Array.isArray(q.items)) return q;
      } catch (e) { /* asagida ham olarak saklanir */ }
      return { version: 1, items: [{ kind: 'raw', reason: 'karantina belgesi bozuk', at: now(), acked: false, raw: String(raw) }] };
    }

    function sameItem(a, b) {
      if (a.kind !== b.kind) return false;
      if (a.kind === 'raw') return a.raw === b.raw;
      return a.session_key === b.session_key && JSON.stringify(a.session) === JSON.stringify(b.session);
    }

    /** Karantinaya ekler (ayni kayit iki kez eklenmez). Basarisizsa false. */
    function quarantine(entries) {
      var q = readQuarantine();
      if (!q) return false;
      var changed = false;
      entries.forEach(function (e) {
        if (q.items.some(function (i) { return sameItem(i, e); })) return;
        q.items.push(Object.assign({ at: now(), acked: false }, e));
        changed = true;
      });
      if (!changed) return true;
      try {
        storage.setItem(quarantineKey, JSON.stringify(q));
        return true;
      } catch (e) {
        return false;
      }
    }

    function read() {
      if (!storage) return null;
      var raw;
      try {
        raw = storage.getItem(storeKey);
      } catch (e) {
        return null;
      }
      blocked = false;
      if (raw === null || raw === undefined || raw === '') return emptyStore();

      var parsed = null;
      var whole = null;
      try {
        parsed = JSON.parse(raw);
      } catch (e) {
        whole = 'JSON okunamadi';
      }
      if (whole === null && (!isPlainObject(parsed) || !isPlainObject(parsed.sessions))) whole = 'belge bicimi gecersiz';
      if (whole !== null) {
        // butun belge: ezmeden once ayri anahtara kopyala, sonra bos baslat
        if (!quarantine([{ kind: 'raw', reason: whole, raw: String(raw) }])) {
          blocked = true;
          return emptyStore();
        }
        try { storage.setItem(storeKey, JSON.stringify(emptyStore())); } catch (e) { /* karantina zaten var */ }
        return emptyStore();
      }

      var store = emptyStore();
      if (isPlainObject(parsed.issued)) {
        Object.keys(parsed.issued).forEach(function (k) {
          if (isInt(parsed.issued[k]) && parsed.issued[k] >= 0) store.issued[k] = parsed.issued[k];
        });
      }
      var bad = [];
      Object.keys(parsed.sessions).forEach(function (k) {
        var problem = sessionProblem(k, parsed.sessions[k], core);
        if (problem === null) store.sessions[k] = parsed.sessions[k];
        else bad.push({ kind: 'session', session_key: k, reason: problem, session: parsed.sessions[k] });
      });
      if (bad.length > 0) {
        if (!quarantine(bad)) {
          blocked = true; // gecerli oturumlar bellekte gosterilir, ama yazma yok
          return store;
        }
        try { storage.setItem(storeKey, JSON.stringify(store)); } catch (e) { /* ayni kayitlar tekrar eklenmez */ }
      }
      return store;
    }

    function reload() {
      var fresh = read();
      if (fresh) data = fresh;
    }

    /**
     * Degisikligi kopya uzerinde yapar, tek setItem ile yazar; yazilamazsa hicbir sey degismez.
     * mutator false donerse yazilmaz ('aborted'). Donus: 'ok' | 'storage' | 'aborted'.
     */
    function commit(mutator) {
      reload(); // baska sekmenin yazdiklari kaybolmasin
      if (!storage || blocked) return 'storage';
      var draft = clone(data);
      if (mutator(draft) === false) return 'aborted';
      try {
        storage.setItem(storeKey, JSON.stringify(draft));
      } catch (e) {
        return 'storage';
      }
      data = draft;
      return 'ok';
    }

    function storageAvailable() {
      if (!storage) return false;
      try {
        var k = storeKey + '/deneme';
        storage.setItem(k, '1');
        storage.removeItem(k);
        return true;
      } catch (e) {
        return false;
      }
    }

    /** Karantinadaki (henuz onaylanmamis) kayit sayisi; bildirim bununla gosterilir. */
    function quarantineInfo() {
      if (!storage) return { count: 0, total: 0 };
      var q = readQuarantine();
      if (!q) return { count: 0, total: 0 };
      return {
        count: q.items.filter(function (i) { return !i.acked; }).length,
        total: q.items.length,
      };
    }

    function quarantineText() {
      var q = readQuarantine() || { version: 1, items: [] };
      return JSON.stringify({ format: 'sesli-asistan-anket/karantina/v1', study_id: studyId, exported_at: now(), items: q.items }, null, 2);
    }

    function ackQuarantine() {
      var q = readQuarantine();
      if (!q) return false;
      q.items.forEach(function (i) { i.acked = true; });
      try {
        storage.setItem(quarantineKey, JSON.stringify(q));
        return true;
      } catch (e) {
        return false;
      }
    }

    // ---- oturum yardimcilari

    /** Konumlarin 0. yanitlari (konum basina bir kayit; ek yanitlar icinde `extras`). */
    function responseList(s) {
      return Object.keys(s.responses || {}).map(function (k) { return s.responses[k]; });
    }

    function extrasOf(r) {
      return r && Array.isArray(r.extras) ? r.extras : [];
    }

    /** Butun yanit satirlari (0. yanitlar ve ek yanitlar): gonderim izlemesi bunlarin kimlikleriyle yapilir. */
    function rowList(s) {
      var out = [];
      responseList(s).forEach(function (r) {
        out.push(r);
        extrasOf(r).forEach(function (e) { out.push(e); });
      });
      return out;
    }

    /** Bir yanit satirinin konumundaki butun satirlar (0. yanit ve ek yanitlar). */
    function positionRows(s, responseId) {
      var out = [];
      responseList(s).forEach(function (r) {
        var rows = [r].concat(extrasOf(r));
        if (rows.some(function (x) { return x.response_id === responseId; })) out = rows;
      });
      return out;
    }

    /** Oturumdaki butun onaylanmis yanit metinleri (kalite bayraklarinda "diger yanitlar", TASARIM-v2 §2). */
    function answeredTexts(s) {
      var out = [];
      responseList(s).forEach(function (r) {
        if (r.status !== 'answered') return;
        out.push(r.confirmed_text);
        extrasOf(r).forEach(function (e) { out.push(e.confirmed_text); });
      });
      return out;
    }

    /** Ilerleme yalniz 0. yanitlarla: konum, 0. yaniti (answered ya da skipped) varsa tamamlanmistir. */
    function doneSet(s) {
      return new Set(responseList(s).map(function (r) { return r.position; }));
    }

    function nextPositionOf(s) {
      return core.progress.nextPosition(s.total_questions, doneSet(s));
    }

    /** answered/skipped konum sayilari (mola hatirlatici bunlarla calisir) ve ek yanit sayisi. */
    function counts(s) {
      var a = 0;
      var k = 0;
      var x = 0;
      responseList(s).forEach(function (r) {
        if (r.status === 'answered') a++;
        else if (r.status === 'skipped') k++;
        x += extrasOf(r).length;
      });
      return { answered: a, skipped: k, extras: x };
    }

    function isResumable(s) {
      return s.status === 'in_progress' || s.status === 'paused';
    }

    /** Yalniz bu calismanin oturumlari listelenir/surdurulur/gonderilir. */
    function visible(s) {
      return s.study_id === studyId;
    }

    /** Oturum bu dosyanin soru havuzuyla baslatildi mi. Degilse yalniz "Dosyaya kaydet" sunulur. */
    function sameBank(s) {
      return s.bank_checksum === checksum;
    }

    function hasAnswers(s) {
      return responseList(s).length > 0;
    }

    /** Alicinin kabul ettigi yanit kimlikleri: gonderilen yukun kimlikleri - reddedilenler. */
    function acceptedSet(s) {
      var rejected = new Set(s.sent_rejected || []);
      return new Set((s.sent_ids || []).filter(function (id) { return !rejected.has(id); }));
    }

    function rejectedCount(s) {
      var rejected = new Set(s.sent_rejected || []);
      return rowList(s).filter(function (r) { return rejected.has(r.response_id); }).length;
    }

    /** Son gonderim yukunde olmayan yanit (ek yanit dahil) ya da farkli durum var mi (alici reddettikleri dahil degil). */
    function hasNewSinceSend(s) {
      if (!s.sent_at) return true;
      if ((s.rev || 0) !== (s.sent_rev || 0)) return true;
      if (s.sent_status !== s.status) return true;
      var posted = new Set(s.sent_ids || []);
      return rowList(s).some(function (r) { return !posted.has(r.response_id); });
    }

    /**
     * Gonderildi sayilmasi icin son gonderim yukunun (durum + yanit kimlikleri) oturumun bugunku halini kapsamasi ve
     * alicinin hicbir yaniti reddetmemis olmasi gerekir (K-52). Ek yanitlar da ayri satirdir.
     */
    /** Gonderilmemis ses kayitlari (has_audio satirlari - audio_sent). */
    function pendingAudio(s) {
      var sent = new Set(s.audio_sent || []);
      return rowList(s).filter(function (r) { return r.has_audio === true && !sent.has(r.response_id); });
    }

    function audioRows(s) {
      return rowList(s).filter(function (r) { return r.has_audio === true; });
    }

    function isUnsent(s) {
      if (!s.sent_at) return true;
      if ((s.rev || 0) !== (s.sent_rev || 0)) return true; // oturum bilgisi (ornegin oneriler) sonradan degisti
      if (sendCfg.type !== 'none' && pendingAudio(s).length > 0) return true; // ses dosyalari da gitmeli
      if (s.sent_status !== s.status) return true;
      var accepted = acceptedSet(s);
      return rowList(s).some(function (r) { return !accepted.has(r.response_id); });
    }

    function summary(s) {
      var c = counts(s);
      var next = nextPositionOf(s);
      var questionNumber = Math.min((next === null ? s.total_questions : next) + 1, Math.max(s.total_questions, 1));
      var acceptedIds = acceptedSet(s);
      return {
        sessionId: s.session_id,
        kind: s.survey_kind,
        status: s.status,
        code: s.participant_pseudonym || null,
        startedAt: s.started_at,
        lastActiveAt: s.last_active_at,
        finishedAt: s.finished_at || null,
        answered: c.answered,
        skipped: c.skipped,
        extras: c.extras,
        total: s.total_questions,
        nextPosition: next,
        questionNumber: questionNumber,
        sentAt: s.sent_at || null,
        receipt: s.receipt || null,
        unsent: isUnsent(s),
        rejected: rejectedCount(s),
        acceptedCount: rowList(s).filter(function (r) { return acceptedIds.has(r.response_id); }).length,
        responseCount: c.answered + c.skipped + c.extras, // gonderideki yanit satiri sayisi
        audioConsent: s.audio_consent === true,
        audioCount: audioRows(s).length,
        audioPending: pendingAudio(s).length,
        pendingRows: (function () {
          var posted = new Set(s.sent_ids || []);
          return rowList(s).filter(function (r) { return !posted.has(r.response_id); }).length;
        }()),
        legacyBank: !sameBank(s),
      };
    }

    function sortedSessions() {
      return Object.keys(data.sessions)
        .map(function (k) { return data.sessions[k]; })
        .filter(visible)
        .sort(function (a, b) {
          return b.last_active_at - a.last_active_at || (a.session_id < b.session_id ? -1 : 1);
        });
    }

    /**
     * "Gorulen soru" (K-13, K-38): AYNI (bos olmayan) katilimci kodunun onceki oturumlarinda yanit satiri olanlar +
     * yarim (devam eden, duraklatilan, birakilan) oturumlarin ekranda kalan sorusu. Kod yoksa gecmis yok.
     */
    function seenQuestionIds(code) {
      var seen = new Set();
      if (!code) return seen;
      Object.keys(data.sessions).forEach(function (k) {
        var s = data.sessions[k];
        if (!visible(s) || s.participant_pseudonym !== code) return;
        responseList(s).forEach(function (r) { seen.add(r.question_id); });
        if (s.status === 'in_progress' || s.status === 'paused' || s.status === 'abandoned') {
          var next = nextPositionOf(s);
          if (next !== null && s.items[next]) seen.add(s.items[next].question_id);
        }
      });
      return seen;
    }

    /** Ana oturumun adaylari: etkin sorusu olan her fonksiyon (banka 2.0'da fonksiyon basina tek soru), OOS yok. */
    function mainCandidates(issued, seen) {
      return bank.candidatesFor('main', issued, seen);
    }

    /** Grup (fonksiyon) sayisi: etkin sorusu olan fonksiyonlar (TASARIM-v2 §1, 86). */
    function groupCount(cands) {
      return new Set(cands.map(function (c) { return c.group; })).size;
    }

    /** Hic gorulmemis (havuzundaki hicbir soru gorulmemis) grup sayisi. */
    function unseenGroupCount(cands) {
      var seenGroups = new Set(cands.filter(function (c) { return c.seenByParticipant; }).map(function (c) { return c.group; }));
      return new Set(cands.filter(function (c) { return !seenGroups.has(c.group); }).map(function (c) { return c.group; })).size;
    }

    /**
     * Ana oturumun soru (fonksiyon) sayisi (TASARIM-v3 §1): yapilandirmada session_questions varsa en cok o kadar,
     * yoksa etkin sorusu olan butun fonksiyonlar (TASARIM-v2 davranisi).
     */
    function sessionSize(available) {
      var n = Number(config.session_questions);
      return Number.isInteger(n) && n >= 1 ? Math.min(n, available) : available;
    }

    /** Yeni oturumun soru sayisi (onay ekrani icin). */
    function plannedTotal() {
      return sessionSize(groupCount(mainCandidates({}, null)));
    }

    /**
     * Kisa oturum bitince bir blok daha sunulur mu (TASARIM-v3 §1): yalniz session_questions ayarliysa, oturum bu
     * dosyanin havuzuyla tamamlanmis bir ilk bloksa (kendisi uzatma degil), daha once uzatilmamissa ve gorulmemis
     * fonksiyon kaldiysa.
     */
    function canExtend(sid) {
      reload();
      var s = data.sessions[sid];
      if (!s || !visible(s) || !sameBank(s) || s.status !== 'completed' || s.survey_kind !== 'main') return false;
      if (!(Number.isInteger(Number(config.session_questions)) && Number(config.session_questions) >= 1)) return false;
      if (s.extra_of) return false;
      var already = Object.keys(data.sessions).some(function (k) { return data.sessions[k].extra_of === sid; });
      if (already) return false;
      return unseenGroupCount(mainCandidates({}, new Set(s.selected_question_ids || []))) > 0;
    }

    /**
     * Bir blok daha: ayni katilimci kodu, onay zamani ve ses onayiyla yeni ana oturum; onceki oturumun fonksiyonlari
     * gelmez (alicilarda her blok ayri oturumdur, plan kurallari degismez). Donus startSession gibi.
     */
    function extend(sid) {
      if (!canExtend(sid)) return { ok: false, reason: 'closed' };
      var s = data.sessions[sid];
      return startSession({
        code: s.participant_pseudonym || '',
        consentTime: s.consent_time,
        audioConsent: s.audio_consent === true,
        after: sid,
      });
    }

    /** Katilimci bilgisi: yalniz gecerli secenekler saklanir; bos, bilinmeyen ya da gecersiz deger null olur. */
    function cleanDemographics(d) {
      var out = {};
      core.demographics.FIELD_NAMES.forEach(function (f) {
        var v = isPlainObject(d) ? d[f] : null;
        out[f] = v !== undefined && v !== null && core.demographics.isValid(f, v) ? v : null;
      });
      return out;
    }

    /**
     * Oturumu baslatir (onaydan hemen sonra, tek setItem). o: {code, consentTime}. Katilimci bilgisi sorulmaz;
     * age_range/region/assistant_usage null yazilir (alicilar alanlari kabul etmeye devam eder). Yalniz ana oturum (TASARIM-v2 §1): etkin sorusu olan butun
     * fonksiyonlar rastgele sirada, planMixed(fonksiyon sayisi, 0); kapsam disi oturumu katilimci akisindan kalkti.
     * Plan, alicilarin kuraliyla (PlanRules) da denetlenir.
     */
    function startSession(o) {
      if (o.kind !== undefined && o.kind !== 'main') return { ok: false, reason: 'generic' };
      var kind = 'main';
      var code = o.code ? core.answerPolicy.confirmedFrom(String(o.code)).slice(0, MAX_CODE_LENGTH) : '';
      // katilimci bilgisi adimi kaldirildi (kullanici istegi 14 Ekim): alanlar her zaman null gonderilir
      var demo = cleanDemographics(null);
      reload();
      var seen = seenQuestionIds(code === '' ? null : code);
      var prev = o.after !== undefined ? data.sessions[o.after] : null;
      if (o.after !== undefined && (!prev || !visible(prev))) return { ok: false, reason: 'generic' };
      // bir blok daha (TASARIM-v3 §1): onceki blogun sorulari gorulmus sayilir; yalniz gorulmemis fonksiyonlar gelir
      if (prev) (prev.selected_question_ids || []).forEach(function (qid) { seen.add(qid); });
      var plan;
      try {
        var cands = mainCandidates(data.issued, seen);
        var size = sessionSize(groupCount(cands));
        if (prev) size = Math.min(size, unseenGroupCount(cands));
        plan = core.selection.planMixed(size, 0, cands, rng || undefined);
      } catch (e) {
        // fonksiyon yoksa planMixed sayilari reddeder (IllegalArgumentException): secilecek soru yok
