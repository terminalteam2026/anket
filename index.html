<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src https: http://127.0.0.1:* http://localhost:*; base-uri 'none'; form-action 'none'">
<title>Sesli Asistan Anketi</title>
<style>
/* Android temasi (Indigo40 / Teal40; zemin #FAF8FF, koyu #121318) - sistem acik/koyu tercihini izler. */
:root {
  --primary: #445e91;
  --on-primary: #ffffff;
  --tertiary: #006a64;
  --bg: #faf8ff;
  --surface: #f1f0f7;
  --text: #1a1b20;
  --muted: #44474f;
  --outline: #74777f;
  --error: #ba1a1a;
  --error-bg: #ffdad6;
  --warn-bg: #fff3d9;
  --warn-accent: #7a5900;
  --info-bg: #dbe2f9;
  --focus: #006a64;
  color-scheme: light dark;
}

@media (prefers-color-scheme: dark) {
  :root {
    --primary: #adc6ff;
    --on-primary: #0b305f;
    --tertiary: #53dbcf;
    --bg: #121318;
    --surface: #1b1b21;
    --text: #e3e2e9;
    --muted: #c4c6d0;
    --outline: #8e9099;
    --error: #ffb4ab;
    --error-bg: #5c1713;
    --warn-bg: #3b2f12;
    --warn-accent: #ffdfa0;
    --info-bg: #2b3042;
    --focus: #53dbcf;
  }
}

* {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 1.0625rem;
  line-height: 1.55;
}

.screen {
  display: block;
  max-width: 44rem;
  margin: 0 auto;
  padding: 24px 16px 40px;
}

.screen > * + * {
  margin-top: 16px;
}

.screen-center {
  text-align: center;
}

.title {
  margin: 0;
  font-size: 1.75rem;
  line-height: 1.25;
  font-weight: 600;
}

.lead {
  font-size: 1.1875rem;
}

.note,
.muted,
.hint,
.footer {
  color: var(--muted);
}

.note,
.hint {
  font-size: 0.9375rem;
}

.footer {
  font-size: 0.8125rem;
  margin-top: 32px;
}

p {
  margin: 0;
}

.section-title {
  margin: 24px 0 0;
  font-size: 1.25rem;
  font-weight: 600;
}

h1:focus,
h2:focus {
  outline: none;
}

/* Dugmeler: en az 48 px, birincil 56 px */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 48px;
  padding: 10px 20px;
  border: 2px solid transparent;
  border-radius: 24px;
  font: inherit;
  font-weight: 600;
  line-height: 1.25;
  cursor: pointer;
  text-align: center;
}

.btn-primary {
  min-height: 56px;
  width: 100%;
  background: var(--primary);
  color: var(--on-primary);
  border-radius: 28px;
}

.btn-outline {
  min-height: 56px;
  width: 100%;
  background: transparent;
  color: var(--primary);
  border-color: var(--outline);
  border-radius: 28px;
}

.btn-text {
  background: transparent;
  color: var(--primary);
  padding-left: 12px;
  padding-right: 12px;
}

.btn:hover:not(:disabled) {
  filter: brightness(1.08);
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.45;
}

:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}

.row,
.actions,
.send-controls {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
}

.actions > .btn,
.send-controls > .btn {
  flex: 1 1 14rem;
}

.actions {
  flex-direction: column;
  align-items: stretch;
}

.actions > .btn {
  flex: none;
}

@media (min-width: 40rem) {
  .actions {
    flex-direction: row;
  }

  .actions > .btn {
    flex: 1 1 0;
  }
}

/* Kartlar ve bantlar */
.card {
  background: var(--surface);
  border-radius: 16px;
  padding: 16px;
}

.card > * + * {
  margin-top: 8px;
}

.card-warn {
  background: var(--warn-bg);
  border-left: 6px solid var(--warn-accent);
}

.card-title {
  margin: 0;
  font-size: 1.125rem;
  font-weight: 600;
}

.banner {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 16px;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  border-radius: 12px;
}

.banner .btn {
  width: auto;
  min-height: 48px;
}

.banner-info {
  background: var(--info-bg);
}

.banner-error,
.error {
  color: var(--error);
}

.banner-error {
  background: var(--error-bg);
  color: var(--text);
}

.error {
  font-weight: 600;
}

.success {
  font-weight: 600;
  color: var(--tertiary);
}

.resume-info {
  color: var(--muted);
  text-align: center;
}

.send-panel > * + * {
  margin-top: 8px;
}

.send-live > p + p {
  margin-top: 4px;
}

.send-live:empty,
.send-alert:empty,
.notice-region:empty,
.error-region:empty,
.consent-error:empty {
  display: none;
}

/* Soru ekrani */
.topbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 16px;
  align-items: center;
  justify-content: space-between;
}

.counter {
  margin: 0;
  font-size: 1.25rem;
  font-weight: 600;
}

.progress {
  width: 100%;
  height: 8px;
  appearance: none;
  -webkit-appearance: none;
  border: 0;
  border-radius: 4px;
  background: var(--surface);
  accent-color: var(--primary);
  overflow: hidden;
}

.progress::-webkit-progress-bar {
  background: var(--surface);
}

.progress::-webkit-progress-value {
  background: var(--primary);
}

.progress::-moz-progress-bar {
  background: var(--primary);
}

.prompt {
  font-size: 1.375rem;
  line-height: 1.5;
  font-weight: 500;
  padding: 16px;
  background: var(--surface);
  border-radius: 12px;
}

.field-group > * + * {
  margin-top: 6px;
}

.label {
  display: block;
  font-weight: 600;
}

.field {
  display: block;
  width: 100%;
  padding: 12px 14px;
  border: 2px solid var(--outline);
  border-radius: 12px;
  background: var(--bg);
  color: var(--text);
  font: inherit;
}

.answer {
  min-height: 9rem;
  resize: vertical;
}

/* Onay */
.consent-section > * + * {
  margin-top: 4px;
}

.consent-h {
  margin: 0;
  font-size: 1.0625rem;
  font-weight: 600;
  color: var(--primary);
}

.check-row {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 12px 0;
  cursor: pointer;
}

.check {
  flex: none;
  width: 24px;
  height: 24px;
  margin: 2px 0 0;
  accent-color: var(--primary);
}

.consent-error {
  color: var(--error);
  font-weight: 600;
}

/* Diyalog */
.dialog {
  max-width: min(30rem, calc(100vw - 32px));
  padding: 24px;
  border: 0;
  border-radius: 24px;
  background: var(--bg);
  color: var(--text);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

.dialog::backdrop {
  background: rgba(0, 0, 0, 0.5);
}

.dialog-title {
  margin: 0 0 12px;
  font-size: 1.375rem;
}

.dialog-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 20px;
}

.dialog-actions .btn-primary {
  width: auto;
  min-height: 48px;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.loading {
  padding: 24px 16px;
  text-align: center;
}

@media (prefers-reduced-motion: reduce) {
  * {
    transition: none !important;
    animation: none !important;
  }
}

</style>
</head>

      var functionNames = new Set((file.functions || []).map(function (f) { return f.function_name; }));
      var labelNames = new Set((file.oos_labels || []).map(function (l) { return l.label; }));

      (file.functions || []).forEach(function (f) {
        countBy(f.params || [], function (p) { return p.name; }).forEach(function (n, k) {
          if (n > 1) problems.push(f.function_name + ': parametre adi tekrar ediyor: ' + k);
        });
      });

      questions.forEach(function (q) {
        var id = q.question_id;
        var hasFunction = q.function_name !== null && q.function_name !== undefined;
        var hasLabel = q.oos_label !== null && q.oos_label !== undefined;
        if (hasFunction === hasLabel) {
          problems.push(id + ": function_name ve oos_label'den tam olarak biri dolu olmali");
        } else if (hasFunction && !functionNames.has(q.function_name)) {
          problems.push(id + ': bilinmeyen function_name: ' + q.function_name);
        } else if (hasLabel && !labelNames.has(q.oos_label)) {
          problems.push(id + ': bilinmeyen oos_label: ' + q.oos_label);
        }
        if (SCENARIO_TYPES.indexOf(q.scenario_type) < 0) {
          problems.push(id + ': bilinmeyen scenario_type: ' + q.scenario_type);
        }
        if (hasFunction && q.scenario_type === 'oos') {
          problems.push(id + ': fonksiyon sorusunun senaryo tipi oos olamaz');
        }
        if (typeof q.prompt_text !== 'string' || isBlankString(q.prompt_text)) {
          problems.push(id + ': prompt_text bos');
        } else {
          if (q.prompt_text !== q.prompt_text.replace(WS_EDGES, '')) {
            problems.push(id + ': prompt_text bas/sonda bosluk iceriyor');

          if (q.prompt_text.normalize('NFC') !== q.prompt_text) problems.push(id + ': prompt_text NFC degil');

      });

      (file.functions || []).forEach(function (f) {
        var supported = f.is_supported === undefined ? true : f.is_supported;
        var enabled = f.enabled === undefined ? true : f.enabled;
        if (!(supported && enabled)) return;
        var qs = questions.filter(function (q) { return q.function_name === f.function_name; });
        checkGroup(problems, f.function_name, qs, 5, function (v) { return 'Q-' + f.function_no + '-0' + v; });
      });
      (file.oos_labels || []).forEach(function (l) {
        var qs = questions.filter(function (q) { return q.oos_label === l.label; });

        qs.filter(function (q) { return q.scenario_type !== 'oos'; }).forEach(function (q) {
          problems.push(q.question_id + ': OOS sorusunun senaryo tipi oos olmali');
        });
      });
      return problems;
    }

    /** Oturum baslatmak icin gruplar: MAIN etkin+desteklenen fonksiyonlar, OOS etkin turler (sort_key sirasi). */
    function groupsFor(kind) {
      if (kind === 'oos') {
        return oosLabels.filter(function (l) { return l.enabled !== false; }).map(function (l) { return l.label; });
      }
      return functions
        .filter(function (f) { return f.is_supported !== false && f.enabled !== false; })
        .map(function (f) { return f.function_name; });
    }

    /**
     * Seciciye verilecek adaylar. issued: {question_id: n}; seen: Set(question_id).
     */
    function candidatesFor(kind, issued, seen) {
      var groups = new Set(groupsFor(kind));
      var out = [];
      questions.forEach(function (q) {
        if (q.enabled === false) return;
        var group = kind === 'oos' ? q.oos_label : q.function_name;
        if (group === null || group === undefined || !groups.has(group)) return;
        out.push({
          questionId: q.question_id,
          group: group,
          scenarioType: q.scenario_type,
          promptText: q.prompt_text,
          promptVersion: q.prompt_version,
          issuedCount: (issued && issued[q.question_id]) || 0,
          seenByParticipant: Boolean(seen && seen.has(q.question_id)),
        });
      });
      return out;
    }

    return {
      file: file,
      bankVersion: file.bank_version,
      functions: functions,
      oosLabels: oosLabels,
      questions: questions,
      function: function (name) { return fnByName.get(name) || null; },
      question: function (id) { return qById.get(id) || null; },
      questionsFor: function (name) { return byVariant(questions.filter(function (q) { return q.function_name === name; })); },
      questionsForOos: function (label) { return byVariant(questions.filter(function (q) { return q.oos_label === label; })); },
      validate: validate,
      groupsFor: groupsFor,
      candidatesFor: candidatesFor,

  function nul(v) {
    return v === undefined ? null : v;
  }

  function sessionPayload(s) {
    return {
      session_id: s.session_id,
      participant_pseudonym: nul(s.participant_pseudonym),
      survey_kind: s.survey_kind,
      consent_version: s.consent_version,
      consent_time: s.consent_time,
      started_at: s.started_at,
      last_active_at: s.last_active_at,
      finished_at: nul(s.finished_at),
      status: s.status,
      current_question_index: s.current_question_index,
      selected_question_ids: (s.selected_question_ids || []).slice(),
      total_questions: s.total_questions,
      bank_version: s.bank_version,
      app_version: s.app_version,
      tz_id: s.tz_id,
    };
  }

  function responseOf(state, pos) {
    var rs = state.responses;
    if (Array.isArray(rs)) {
      for (var i = 0; i < rs.length; i++) if (rs[i].position === pos) return rs[i];
      return null;
    }

  function responsePayload(state, pos) {
    var r = responseOf(state, pos);
    if (!r) throw new Error('Yanit yok: konum ' + pos);
    return {
      response_id: r.response_id,
      session_id: r.session_id || state.session_id,
      position: r.position,
      question_id: r.question_id,
      prompt_version: r.prompt_version,
      input_mode: 'text',
      raw_text: r.raw_text,
      asr_text: null,
      confirmed_text: r.confirmed_text,
      asr_engine_version: null,
      audio_uri: null,
      status: r.status,
      answered_at: r.answered_at,
      tz_id: r.tz_id,
      attempt_count: r.attempt_count,
      client_event_id: r.client_event_id,
      shown_at: nul(r.shown_at),
      asr_attempts: [],
      quality_flags: (r.quality_flags || []).slice(),

  function responsePositions(state) {
    var rs = state.responses;
    var list = Array.isArray(rs) ? rs : Object.keys(rs || {}).map(function (k) { return rs[k]; });

   * Tum gonderi: {format, study_id, study_key, app_version, bank_version, bank_checksum, sent_at, session, responses}.
   * meta: {study_id, study_key, bank_checksum, sent_at}.
   */
  function submission(state, meta) {
    return {
      format: PAYLOAD_FORMAT,
      study_id: meta.study_id,
      study_key: nul(meta.study_key),
      app_version: APP_VERSION,
      bank_version: state.bank_version,
      bank_checksum: meta.bank_checksum,
      sent_at: meta.sent_at,
      session: sessionPayload(state),
      responses: responsePositions(state).map(function (p) { return responsePayload(state, p); }),
    };
  }

  var payload = {
    FORMAT: PAYLOAD_FORMAT,
    session: sessionPayload,
    response: responsePayload,
    submission: submission,
  };

  var api = {
    APP_VERSION: APP_VERSION,
    answerPolicy: answerPolicy,
    qualityFlags: qualityFlags,
    progress: progress,
    selection: selection,
    bank: { load: load },

    for (var k = 0; k < keys.length; k++) {
      var r = s.responses[keys[k]];
      if (!isPlainObject(r) || !isInt(r.position) || String(r.position) !== keys[k] || r.position < 0 || r.position >= s.total_questions) {
        return 'responses[' + keys[k] + ']';
      }
      if (!isStr(r.response_id) || !isStr(r.question_id) || !isStr(r.raw_text) || !isStr(r.confirmed_text)) return 'responses[' + keys[k] + '] alanlari';
      if (r.status !== 'answered' && r.status !== 'skipped') return 'responses[' + keys[k] + '].status';
      if (!isNum(r.answered_at) || !isStr(r.tz_id) || !isInt(r.attempt_count) || !isStr(r.client_event_id)) return 'responses[' + keys[k] + '] kimlikler';
      if (r.quality_flags !== undefined && !Array.isArray(r.quality_flags)) return 'responses[' + keys[k] + '].quality_flags';
    }
    if (s.sent_ids !== undefined && !Array.isArray(s.sent_ids)) return 'sent_ids';
    if (s.sent_rejected !== undefined && !Array.isArray(s.sent_rejected)) return 'sent_rejected';
    if (s.sent_at !== undefined && s.sent_at !== null && !isNum(s.sent_at)) return 'sent_at';
    return null;
  }

  /**
   * Dosyaya kaydet. env: {showSaveFilePicker (bagli islev ya da null), download(name, text) -> Promise}.
   * Donus: 'saved' (secici dosyayi yazip kapatti) | 'download' (indirme baslatildi, sonucu bilinmez) | 'cancelled'.
   * "Kaydedildi" yalnizca 'saved' icin soylenebilir (WR1-09).
   */
  function saveTextToFile(env, name, text) {
    if (typeof env.showSaveFilePicker !== 'function') {
      return Promise.resolve().then(function () { return env.download(name, text); }).then(function () { return 'download'; });
    }
    return Promise.resolve()
      .then(function () {
        return env.showSaveFilePicker({
          suggestedName: name,
          types: [{ description: 'JSON dosyası', accept: { 'application/json': ['.json'] } }],
        });
      })
      .then(function (handle) {
        return handle.createWritable().then(function (w) {
          return w.write(text).then(function () { return w.close(); });
        });
      })
      .then(
        function () { return 'saved'; },
        function (e) {
          if (e && e.name === 'AbortError') return 'cancelled';
          // izin/guvenlik/yazma hatasinda indirme yoluna dus
          return Promise.resolve().then(function () { return env.download(name, text); }).then(function () { return 'download'; });
        },
      );
  }

  /** navigator.storage.persist() - en iyi cabayla; gizli pencerede ya da desteklenmiyorsa false. */
  function requestPersistence(nav) {
    try {
      if (!nav || !nav.storage || typeof nav.storage.persist !== 'function') return Promise.resolve(false);
      return Promise.resolve(nav.storage.persist()).then(function (v) { return Boolean(v); }, function () { return false; });
    } catch (e) {
      return Promise.resolve(false);
    }
  }

  /** Kaydetme sonucunun ekran karari (DOM'suz, testlenebilir). */
  function submitOutcome(res, action, text) {
    if (res && res.ok) return { kind: res.completed ? 'completed' : 'next', restDue: Boolean(res.restDue) };
    var reason = res && res.reason;
    if (reason === 'storage') return { kind: 'storage_error' };
    if (reason === 'empty') return { kind: 'empty' };
    if (reason === 'too_long') return { kind: 'too_long' };
    // bayat sekme: yazilan metin yeni ekrana tasinir (kaybolmasin), kullanici gorup duzeltir
    if (reason === 'stale') return { kind: 'stale', carryText: action === 'answer' ? String(text === undefined || text === null ? '' : text) : '' };
    return { kind: 'restart' };
  }

  /** Onay metni (TASARIM §13, sesli kisimlar cikarildi). [{h, p: [..]}] */
  function consentSections(config, total) {
    var c = config.consent || {};
    var sendInfo = config.send && config.send.type !== 'none'
      ? 'Anketi bitirince "Gönder"e basarsan yanıtların internet üzerinden araştırmacının belirlediği adrese iletilir. "Gönder"e basmadan hiçbir şey gönderilmez; istersen yanıtlarını bir dosyaya kaydedip kendin de iletebilirsin.'
      : 'Yanıtların yalnızca bu bilgisayarda, tarayıcının yerel deposunda saklanır. Bunları "Dosyaya kaydet" ile bir dosyaya kaydedip araştırmacıya kendin iletebilirsin.';
    return [
      { h: 'Bu anket ne için?', p: ['Sesli asistanların günlük dildeki komutları daha iyi anlaması için örnek cümleler topluyoruz. Her ekranda bir durum göreceksin; o durumda sesli asistanına ne söyleyeceğini yazarak yanıtlayacaksın. Doğru ya da yanlış cevap yok; kendi doğal söyleyişini merak ediyoruz.'] },
      { h: 'Ne kaydediliyor?', p: ['Yazdığın metin, sorunun kimliği, yanıt zamanı ve saat dilimi. Adın, telefon numaran, cihaz ya da reklam kimliğin kaydedilmez.'] },
      { h: 'Kişisel bilgi', p: ['Yanıtlarında gerçek kişi adı ya da telefon numarası kullanmak zorunda değilsin; uydurma bir ad ya da numara yazabilirsin.'] },
      { h: 'Nasıl kullanılacak?', p: ['Yanıtlar sesli asistanın geliştirilmesinde eğitim ve test verisi olarak kullanılacak. Paylaşım biçimi: ' + placeholder(c.sharing) + '.'] },
      { h: 'Yanıtların gönderilmesi', p: [sendInfo] },
      { h: 'Veri sorumlusu ve iletişim', p: [placeholder(c.controller), 'İletişim: ' + placeholder(c.contact)] },
      { h: 'Saklama süresi', p: [placeholder(c.retention)] },
      { h: 'Gönüllülük', p: ['Katılım gönüllüdür. İstediğin soruyu geçebilir, anketi istediğin an bırakabilir ya da daha sonra kaldığın yerden sürdürebilirsin. Yanıtlarının silinmesini istersen araştırmacıya katılımcı kodunu ya da anket tarihini bildirmen yeterli.'] },
    ];
  }

  // ------------------------------------------------------------------ durum katmani

  /**
   * opts: {core, bank (core.bank.load sonucu), config, storage, now, newId, tzId, rng, bankChecksum}
   * storage: getItem/setItem/removeItem (localStorage benzeri); yoksa bellek ici.
   */
  function createEngine(opts) {
    var core = opts.core;
    var bank = opts.bank;
    var config = opts.config;
    var storage = opts.storage || null;
    var now = opts.now || Date.now;
    var newId = opts.newId || randomUuid;
    var tzId = opts.tzId || defaultTzId;
    var rng = opts.rng || null;
    var checksum = opts.bankChecksum || config.bank_checksum || '';
    var sendCfg = config.send || { type: 'none' };
    var studyId = String(config.study_id);
    var storeKey = STORE_PREFIX + studyId;
    var quarantineKey = QUARANTINE_PREFIX + studyId;

    var data = emptyStore();
    var blocked = false; // bozuk veri ayrilamadi: ustune yazmak veri kaybettirir, yazmalar reddedilir
    var inflight = Object.create(null); // "<oturum>:<konum>" -> {eventId, attempts, shownAt}: yeniden denemelerde sabit
    var sending = Object.create(null); // oturum -> suren gonderim sozu
    var lastSend = Object.create(null); // oturum -> son gonderim sonucu (bellekte)
    var listeners = [];

    function emptyStore() {
      return { version: 2, sessions: {}, issued: {} };
    }

    // ---- bozuk kayit karantinasi (WR1-10)

    function readQuarantine() {
      var raw;
      try {
        raw = storage.getItem(quarantineKey);
      } catch (e) {
        return null;
      }
      if (raw === null || raw === undefined || raw === '') return { version: 1, items: [] };
      try {
        var q = JSON.parse(raw);
        if (isPlainObject(q) && Array.isArray(q.items)) return q;
      } catch (e) { /* asagida ham olarak saklanir */ }
      return { version: 1, items: [{ kind: 'raw', reason: 'karantina belgesi bozuk', at: now(), acked: false, raw: String(raw) }] };
    }

    function sameItem(a, b) {
      if (a.kind !== b.kind) return false;
      if (a.kind === 'raw') return a.raw === b.raw;
      return a.session_key === b.session_key && JSON.stringify(a.session) === JSON.stringify(b.session);
    }

    /** Karantinaya ekler (ayni kayit iki kez eklenmez). Basarisizsa false. */
    function quarantine(entries) {
      var q = readQuarantine();
      if (!q) return false;
      var changed = false;
      entries.forEach(function (e) {
        if (q.items.some(function (i) { return sameItem(i, e); })) return;
        q.items.push(Object.assign({ at: now(), acked: false }, e));
        changed = true;
      });
      if (!changed) return true;
      try {
        storage.setItem(quarantineKey, JSON.stringify(q));
        return true;
      } catch (e) {
        return false;
      }
    }

    function read() {
      if (!storage) return null;
      var raw;
      try {
        raw = storage.getItem(storeKey);
      } catch (e) {
        return null;
      }
      blocked = false;
      if (raw === null || raw === undefined || raw === '') return emptyStore();

      var parsed = null;
      var whole = null;
      try {
        parsed = JSON.parse(raw);
      } catch (e) {
        whole = 'JSON okunamadi';
      }
      if (whole === null && (!isPlainObject(parsed) || !isPlainObject(parsed.sessions))) whole = 'belge bicimi gecersiz';
      if (whole !== null) {
        // butun belge: ezmeden once ayri anahtara kopyala, sonra bos baslat
        if (!quarantine([{ kind: 'raw', reason: whole, raw: String(raw) }])) {
          blocked = true;
          return emptyStore();
        }
        try { storage.setItem(storeKey, JSON.stringify(emptyStore())); } catch (e) { /* karantina zaten var */ }
        return emptyStore();
      }

      var store = emptyStore();
      if (isPlainObject(parsed.issued)) {
        Object.keys(parsed.issued).forEach(function (k) {
          if (isInt(parsed.issued[k]) && parsed.issued[k] >= 0) store.issued[k] = parsed.issued[k];
        });
      }
      var bad = [];
      Object.keys(parsed.sessions).forEach(function (k) {
        var problem = sessionProblem(k, parsed.sessions[k]);
        if (problem === null) store.sessions[k] = parsed.sessions[k];
        else bad.push({ kind: 'session', session_key: k, reason: problem, session: parsed.sessions[k] });
      });
      if (bad.length > 0) {
        if (!quarantine(bad)) {
          blocked = true; // gecerli oturumlar bellekte gosterilir, ama yazma yok
          return store;
        }
        try { storage.setItem(storeKey, JSON.stringify(store)); } catch (e) { /* ayni kayitlar tekrar eklenmez */ }
      }
      return store;
    }

    function reload() {
      var fresh = read();
      if (fresh) data = fresh;
    }

    /**
     * Degisikligi kopya uzerinde yapar, tek setItem ile yazar; yazilamazsa hicbir sey degismez.
     * mutator false donerse yazilmaz ('aborted'). Donus: 'ok' | 'storage' | 'aborted'.
     */
    function commit(mutator) {
      reload(); // baska sekmenin yazdiklari kaybolmasin
      if (!storage || blocked) return 'storage';
      var draft = clone(data);
      if (mutator(draft) === false) return 'aborted';
      try {
        storage.setItem(storeKey, JSON.stringify(draft));
      } catch (e) {
        return 'storage';
      }
      data = draft;
      return 'ok';
    }

    function storageAvailable() {
      if (!storage) return false;
      try {
        var k = storeKey + '/deneme';
        storage.setItem(k, '1');
        storage.removeItem(k);
        return true;
      } catch (e) {
        return false;
      }
    }

    /** Karantinadaki (henuz onaylanmamis) kayit sayisi; bildirim bununla gosterilir. */
    function quarantineInfo() {
      if (!storage) return { count: 0, total: 0 };
      var q = readQuarantine();
      if (!q) return { count: 0, total: 0 };
      return {
        count: q.items.filter(function (i) { return !i.acked; }).length,
        total: q.items.length,
      };
    }

    function quarantineText() {
      var q = readQuarantine() || { version: 1, items: [] };
      return JSON.stringify({ format: 'sesli-asistan-anket/karantina/v1', study_id: studyId, exported_at: now(), items: q.items }, null, 2);
    }

    function ackQuarantine() {
      var q = readQuarantine();
      if (!q) return false;
      q.items.forEach(function (i) { i.acked = true; });
      try {
        storage.setItem(quarantineKey, JSON.stringify(q));
        return true;
      } catch (e) {
        return false;
      }
    }

    // ---- oturum yardimcilari

    function responseList(s) {
      return Object.keys(s.responses || {}).map(function (k) { return s.responses[k]; });
    }

    function doneSet(s) {
      return new Set(responseList(s).map(function (r) { return r.position; }));
    }

    function nextPositionOf(s) {
      return core.progress.nextPosition(s.total_questions, doneSet(s));
    }

    function counts(s) {
      var a = 0;
      var k = 0;
      responseList(s).forEach(function (r) {
        if (r.status === 'answered') a++;
        else if (r.status === 'skipped') k++;
      });
      return { answered: a, skipped: k };
    }

    function isResumable(s) {
      return s.status === 'in_progress' || s.status === 'paused';
    }

    /** Yalniz bu calismanin oturumlari listelenir/surdurulur/gonderilir. */
    function visible(s) {
      return s.study_id === studyId;
    }

    /** Oturum bu dosyanin soru havuzuyla baslatildi mi. Degilse yalniz "Dosyaya kaydet" sunulur. */
    function sameBank(s) {
      return s.bank_checksum === checksum;
    }

    function hasAnswers(s) {
      return responseList(s).length > 0;
    }

    /** Alicinin kabul ettigi yanit kimlikleri: gonderilen yukun kimlikleri - reddedilenler. */
    function acceptedSet(s) {
      var rejected = new Set(s.sent_rejected || []);
      return new Set((s.sent_ids || []).filter(function (id) { return !rejected.has(id); }));
    }

    function rejectedCount(s) {
      var rejected = new Set(s.sent_rejected || []);
      return responseList(s).filter(function (r) { return rejected.has(r.response_id); }).length;
    }

    /** Son gonderim yukunde olmayan yanit ya da farkli durum var mi (alici reddettikleri dahil degil). */
    function hasNewSinceSend(s) {
      if (!s.sent_at) return true;
      if (s.sent_status !== s.status) return true;
      var posted = new Set(s.sent_ids || []);
      return responseList(s).some(function (r) { return !posted.has(r.response_id); });
    }

    /**
     * Gonderildi sayilmasi icin son gonderim yukunun (durum + yanit kimlikleri) oturumun bugunku halini kapsamasi ve
     * alicinin hicbir yaniti reddetmemis olmasi gerekir (K-52).
     */
    function isUnsent(s) {
      if (!s.sent_at) return true;
      if (s.sent_status !== s.status) return true;
      var accepted = acceptedSet(s);
      return responseList(s).some(function (r) { return !accepted.has(r.response_id); });
    }

    function summary(s) {
      var c = counts(s);
      var next = nextPositionOf(s);
      var questionNumber = Math.min((next === null ? s.total_questions : next) + 1, Math.max(s.total_questions, 1));
      var acceptedIds = acceptedSet(s);
      return {
        sessionId: s.session_id,
        kind: s.survey_kind,
        status: s.status,
        code: s.participant_pseudonym || null,
        startedAt: s.started_at,
        lastActiveAt: s.last_active_at,
        finishedAt: s.finished_at || null,
        answered: c.answered,
        skipped: c.skipped,
        total: s.total_questions,
        nextPosition: next,
        questionNumber: questionNumber,
        sentAt: s.sent_at || null,
        receipt: s.receipt || null,
        unsent: isUnsent(s),
        rejected: rejectedCount(s),
        acceptedCount: responseList(s).filter(function (r) { return acceptedIds.has(r.response_id); }).length,
        responseCount: c.answered + c.skipped,
        legacyBank: !sameBank(s),
      };
    }

    function sortedSessions() {
      return Object.keys(data.sessions)
        .map(function (k) { return data.sessions[k]; })
        .filter(visible)
        .sort(function (a, b) {
          return b.last_active_at - a.last_active_at || (a.session_id < b.session_id ? -1 : 1);
        });
    }

    /**
     * "Gorulen soru" (K-13, K-38): AYNI (bos olmayan) katilimci kodunun onceki oturumlarinda yanit satiri olanlar +
     * yarim (devam eden, duraklatilan, birakilan) oturumlarin ekranda kalan sorusu. Kod yoksa gecmis yok.
     */
    function seenQuestionIds(code) {
      var seen = new Set();
      if (!code) return seen;
      Object.keys(data.sessions).forEach(function (k) {
        var s = data.sessions[k];
        if (!visible(s) || s.participant_pseudonym !== code) return;
        responseList(s).forEach(function (r) { seen.add(r.question_id); });
        if (s.status === 'in_progress' || s.status === 'paused' || s.status === 'abandoned') {
          var next = nextPositionOf(s);
          if (next !== null && s.items[next]) seen.add(s.items[next].question_id);
        }
      });
      return seen;
    }

    function startSession(o) {
      var kind = o.kind === 'oos' ? 'oos' : 'main';
      var code = o.code ? core.answerPolicy.confirmedFrom(String(o.code)).slice(0, MAX_CODE_LENGTH) : '';
      reload();
      var groups = bank.groupsFor(kind);
      var plan;
      try {
        if (groups.length === 0) throw core.selection.SelectionException('Etkin soru grubu yok');
        plan = core.selection.plan(kind, groups, bank.candidatesFor(kind, data.issued, seenQuestionIds(code === '' ? null : code)), rng || undefined);
      } catch (e) {
        return { ok: false, reason: e && e.name === 'SelectionException' ? 'selection' : 'generic' };
      }
      var t = now();
      var id = newId();
      var items = plan.map(function (p) {
        return {
          position: p.position,
          question_id: p.questionId,
          function_name: p.functionName,
          oos_label: p.oosLabel,
          scenario_type: p.scenarioType,
          prompt_text: p.promptText,
          prompt_version: p.promptVersion,
        };
      });
      var session = {
        session_id: id,
        study_id: studyId,
        bank_checksum: checksum,
        participant_pseudonym: code === '' ? null : code,
        survey_kind: kind,
        consent_version: String((config.consent && config.consent.version) || ''),
        consent_time: o.consentTime || t,
        started_at: t,
        last_active_at: t,
        finished_at: null,
        status: 'in_progress',
        current_question_index: 0,
        selected_question_ids: items.map(function (i) { return i.question_id; }),
        total_questions: items.length,
        bank_version: bank.bankVersion,
        app_version: core.APP_VERSION,
        tz_id: tzId(),
        items: items,
        responses: {},
      };
      if (session.consent_version === '') return { ok: false, reason: 'generic' };
      var res = commit(function (d) {
        d.sessions[id] = session;
        session.selected_question_ids.forEach(function (q) { d.issued[q] = (d.issued[q] || 0) + 1; });
      });
      return res === 'ok' ? { ok: true, sessionId: id } : { ok: false, reason: 'storage' };
    }

    /** Siradaki soru; oturum bitmisse, bu dosyanin sorulariyla baslamamissa (ya da yoksa) null. */
    function question(sid) {
      reload();
      var s = data.sessions[sid];
      if (!s || !visible(s) || !sameBank(s)) return null;
      var next = nextPositionOf(s);
      if (next === null) return null;
      var item = s.items[next];
      var c = counts(s);
      var slot = flightFor(sid, next);
      return {
        sessionId: sid,
        position: next,
        total: s.total_questions,
        questionId: item.question_id,
        promptText: item.prompt_text,
        answered: c.answered,
        skipped: c.skipped,
        shownAt: slot.shownAt,
      };
    }

    function flightFor(sid, pos) {
      var key = sid + ':' + pos;
      if (!inflight[key]) inflight[key] = { eventId: newId(), attempts: 0, shownAt: now() };
      return inflight[key];
    }

    /**
     * action 'answer' | 'skip'. o.position / o.questionId: ekranda gosterilen soru (Android'deki SubmitCommand gibi);
     * oturumun siradaki sorusu bundan farkliysa (baska sekme araya girdi) yazilmaz: {ok:false, reason:'stale'}.
     * clientEventId konum basina sabit, attempt_count her denemede artar (K-15..K-18).
     * Donus: {ok:true, completed, restDue, duplicate} |
     *        {ok:false, reason: not_found|closed|old_bank|stale|empty|too_long|storage}
     */
    function submit(sid, o) {
      reload();
      var s = data.sessions[sid];
      if (!s || !visible(s)) return { ok: false, reason: 'not_found' };
      if (!sameBank(s)) return { ok: false, reason: 'old_bank' };
      if (s.status === 'completed' || s.status === 'abandoned') return { ok: false, reason: 'closed' };
      var pos = nextPositionOf(s);
      if (pos === null) return { ok: false, reason: 'closed' };
      var item = s.items[pos];
      if ((o.position !== undefined && o.position !== pos) || (o.questionId !== undefined && o.questionId !== item.question_id)) {
        return { ok: false, reason: 'stale' };
      }
      var skipped = o.action === 'skip';
      var text = skipped ? '' : String(o.text === undefined || o.text === null ? '' : o.text);
      var confirmed = skipped ? '' : core.answerPolicy.confirmedFrom(text);
      if (!skipped && !core.answerPolicy.isMeaningful(confirmed)) return { ok: false, reason: 'empty' };
      // alici 2000 karakterden uzun metni reddeder (text_too_long); UTF-16 uzunlugu kod noktasi sayisindan kucuk olamaz
      if (!skipped && text.length > MAX_ANSWER_LENGTH) return { ok: false, reason: 'too_long' };

      var slot = flightFor(sid, pos);
      slot.attempts += 1;
      var t = now();
      var others = responseList(s)
        .filter(function (r) { return r.status === 'answered'; })
        .map(function (r) { return r.confirmed_text; });
      var flags = skipped ? [] : core.qualityFlags.compute(confirmed, item.prompt_text, others);
      var response = {
        response_id: newId(),
        session_id: sid,
        question_id: item.question_id,
        function_name_at_issue: item.function_name,
        oos_label_at_issue: item.oos_label,
        prompt_version: item.prompt_version,
        input_mode: 'text',
        raw_text: skipped ? '' : text,
        confirmed_text: confirmed,
        asr_text: null,
        audio_uri: null,
        asr_engine_version: null,
        status: skipped ? 'skipped' : 'answered',
        answered_at: t,
        attempt_count: slot.attempts,
        client_event_id: slot.eventId,
        position: pos,
        tz_id: tzId(),
        shown_at: slot.shownAt,
        asr_attempts: [],
        quality_flags: flags,
      };
      var lost = null;
      var res = commit(function (d) {
        var ds = d.sessions[sid];
        if (!ds) { lost = 'not_found'; return false; }
        if (ds.status === 'completed' || ds.status === 'abandoned') { lost = 'closed'; return false; }
        // baska sekme araya girdi: ilk kayit korunur, bu yanit baska soruya yazilmaz
        if (ds.responses[pos] || nextPositionOf(ds) !== pos || ds.items[pos].question_id !== item.question_id) { lost = 'stale'; return false; }
        ds.responses[pos] = response;
        var next = nextPositionOf(ds);
        var completed = next === null;
        ds.current_question_index = completed ? ds.total_questions : next;
        ds.last_active_at = t;
        if (completed) {
          ds.status = 'completed';
          ds.finished_at = t;
        } else if (ds.status === 'paused') {
          ds.status = 'in_progress'; // yanit geldiyse oturum surdurulmustur
        }
      });
      if (res === 'storage') return { ok: false, reason: 'storage' };
      if (res === 'aborted') return { ok: false, reason: lost || 'stale' };
      delete inflight[sid + ':' + pos];
      var cur = data.sessions[sid];
      var done = counts(cur);
      var answeredOrSkipped = done.answered + done.skipped;
      var completed = cur.status === 'completed';
      return {
        ok: true,
        completed: completed,
        duplicate: false,
        restDue: !completed && core.progress.restReminderDue(answeredOrSkipped, Number(config.rest_reminder_every) || 0),
      };
    }

    function changeStatus(sid, target) {
      reload();
      var s = data.sessions[sid];
      if (!s || !visible(s) || !sameBank(s) || !isResumable(s)) return false;
      return commit(function (d) {
        d.sessions[sid].status = target;
        d.sessions[sid].last_active_at = now();
      }) === 'ok';
    }

    function sessionBySid(sid) {
      reload();
      var s = data.sessions[sid];
      return s && visible(s) ? s : null;
    }

    // ---- gonderim

    function submissionObject(sid, sentAt) {
      var s = sessionBySid(sid);
      if (!s) throw new Error('Oturum yok');
      // oturumun kendi calisma kimligi ve soru havuzu ozeti; baska calismanin yapilandirmasi asla yazilmaz
      return core.payload.submission(s, {
        study_id: s.study_id,
        study_key: sendCfg.study_key === undefined || sendCfg.study_key === '' ? null : sendCfg.study_key,
        bank_checksum: s.bank_checksum,
        sent_at: sentAt === undefined ? now() : sentAt,
      });
    }

    function submissionText(sid) {
      return JSON.stringify(submissionObject(sid));
    }

    function fileText(sid) {
      return JSON.stringify(submissionObject(sid), null, 2);
    }

    /**
     * Gonderilen YUKUN anlik goruntusunu kaydeder (WR1-02): snapshot {status, ids}; gonderim sirasinda eklenen
     * yanitlar "gonderildi" sayilmaz. rejectedIds: alicinin reddettigi yanit kimlikleri (WR1-04).
     */
    function markSent(sid, receipt, sentAt, snapshot, rejectedIds) {
      return commit(function (d) {
        var s = d.sessions[sid];
        if (!s) return false;
        s.sent_at = sentAt;
        s.receipt = receipt === undefined ? null : receipt;
        s.sent_status = snapshot.status;
        s.sent_ids = snapshot.ids.slice();
        s.sent_count = snapshot.ids.length;
        s.sent_rejected = rejectedIds.slice();
      }) === 'ok';
    }

    /**
     * Gonderi: POST text/plain (CORS on ucusu yok). Yalnizca yanit JSON'unda ok === true ise basari sayilir.
     * Her HTTP durumunda govde okunur; {"ok":false,"error":"<kod>"} Turkce iletiye cevrilir.
     * Donus: {ok:true, receipt, accepted, rejected, persisted} | {ok:false, code, message[, error]}
     */
    function send(sid, o) {
      o = o || {};
      var fetchImpl = o.fetchImpl || (root.fetch ? root.fetch.bind(root) : null);
      var timeoutMs = o.timeoutMs || SEND_TIMEOUT_MS;
      if (sendCfg.type === 'none' || !sendCfg.url) {
        return Promise.resolve({ ok: false, code: 'no_target', message: T.sendNoTarget });
      }
      if (!fetchImpl) {
        return Promise.resolve({ ok: false, code: 'network', message: T.sendNoFetch });
      }
      var session = sessionBySid(sid);
      if (!session) {
        return Promise.resolve({ ok: false, code: 'not_found', message: T.sendNotFound });
      }
      if (!sameBank(session)) {
        return Promise.resolve({ ok: false, code: 'old_bank', message: T.sendOldBank });
      }
      var sentAt = now();
      var posted = submissionObject(sid, sentAt);
      var body = JSON.stringify(posted);
      var snapshot = {
        status: posted.session.status,
        ids: posted.responses.map(function (r) { return r.response_id; }),
      };
      var controller = typeof AbortController === 'function' ? new AbortController() : null;
      var timedOut = false;
      var timer = null;
      var timeout = new Promise(function (resolve) {
        timer = setTimeout(function () {
          timedOut = true;
          if (controller) controller.abort();
          resolve('timeout'); // fetch abort'u gormezse de zaman asimi sonuclansin
        }, timeoutMs);
      });
      var request = Promise.resolve().then(function () {
        return fetchImpl(sendCfg.url, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: body,
          credentials: 'omit',
          referrerPolicy: 'no-referrer',
          signal: controller ? controller.signal : undefined,
        });
      });
      return Promise.race([request, timeout])
        .then(function (res) {
          if (res === 'timeout') throw Object.assign(new Error('timeout'), { name: 'TimeoutError' });
          return Promise.resolve(res.text()).then(function (text) { return text; }, function () { return ''; }).then(function (text) {
            var reply;
            try {
              reply = JSON.parse(text);
            } catch (e) {
              reply = undefined;
            }
            var isObject = isPlainObject(reply);
            if (isObject && reply.ok === true && res.ok) {
              var receipt = typeof reply.receipt === 'string' ? reply.receipt : null;
              var rejectedList = Array.isArray(reply.rejected) ? reply.rejected : [];
              var postedIds = new Set(snapshot.ids);
              var rejectedIds = [];
              rejectedList.forEach(function (e) {
                if (e && typeof e.response_id === 'string' && postedIds.has(e.response_id) && rejectedIds.indexOf(e.response_id) < 0) {
                  rejectedIds.push(e.response_id);
                }
              });
              var persisted = markSent(sid, receipt, sentAt, snapshot, rejectedIds);
              return {
                ok: true,
                receipt: receipt,
                accepted: typeof reply.accepted === 'number' ? reply.accepted : null,
                rejected: rejectedList,
                persisted: persisted,
              };
            }
            if (isObject && reply.ok === false && typeof reply.error === 'string') {
              return { ok: false, code: 'rejected', error: reply.error.slice(0, 200), message: errorMessageFor(reply.error) };
            }
            if (!res.ok) {
              return { ok: false, code: 'http', message: 'Sunucu hata döndürdü (HTTP ' + res.status + ').' };
            }
            if (reply === undefined) return { ok: false, code: 'bad_reply', message: T.sendBadReply };
            return { ok: false, code: 'rejected', error: '', message: 'Sunucu gönderiyi kabul etmedi.' };
          });
        })
        .catch(function (e) {
          if (timedOut || (e && e.name === 'TimeoutError')) {
            return {
              ok: false,
              code: 'timeout',
              message: 'Sunucu ' + Math.round(timeoutMs / 1000) + ' saniye içinde yanıt vermedi. Yanıtların ulaşmış olabilir; tekrar göndermek güvenlidir.',
            };
          }
          return { ok: false, code: 'network', message: T.sendNetwork };
        })
        .then(function (r) {
          clearTimeout(timer);
          return r;
        });
    }

    function notify(sid) {
      listeners.slice().forEach(function (fn) {
        try { fn(sid); } catch (e) { /* bir dinleyicinin hatasi digerlerini durdurmaz */ }
      });
    }

    /**
     * Gonderimi baslatir ve oturum basina suren durumu tutur (ekran degisse de kaybolmaz); bitince dinleyicilere
     * haber verir (WR1-06). Ayni oturum icin ikinci cagri suren sozu dondurur.
     */
    function beginSend(sid, o) {
      if (sending[sid]) return sending[sid];
      delete lastSend[sid];
      var p;
      try {
        p = send(sid, o);
      } catch (e) {
        p = Promise.resolve({ ok: false, code: 'internal', message: T.sendInternal });
      }
      var tracked = Promise.resolve(p)
        .catch(function () { return { ok: false, code: 'internal', message: T.sendInternal }; })
        .then(function (r) {
          delete sending[sid];
          lastSend[sid] = r;
          notify(sid);
          return r;
        });
      sending[sid] = tracked;
      notify(sid);
      return tracked;
    }

    /**
     * Gonderim paneli durumu: {state: 'idle'|'sending'|'ok'|'error', message, receipt, accepted, rejected, note}.
     * 'ok' ve alici-ret sayisi depodaki kayittan turetilir; yeniden cizimde kaybolmaz.
     */
    function sendState(sid) {
      if (sending[sid]) return { state: 'sending', rejected: 0 };
      var s = sessionBySid(sid);
      var info = s ? summary(s) : null;
      var rejected = info ? info.rejected : 0;
      var last = lastSend[sid];
      if (last && !last.ok) return { state: 'error', message: last.message, code: last.code, rejected: rejected };
      if (last && last.ok && last.persisted === false) {
        return { state: 'ok', receipt: last.receipt, accepted: last.accepted, rejected: rejected, note: T.sendPersistNote };
      }
      if (s && s.sent_at && !hasNewSinceSend(s)) {
        return { state: 'ok', receipt: s.receipt || null, accepted: info.acceptedCount, rejected: rejected };
      }
      return { state: 'idle', rejected: rejected };
    }

    function subscribe(fn) {
      listeners.push(fn);
      return function () {
        var i = listeners.indexOf(fn);
        if (i >= 0) listeners.splice(i, 1);
      };
    }

    function finishedSessions() {
      reload();
      return sortedSessions()
        .filter(function (s) { return (s.status === 'completed' || s.status === 'abandoned') && hasAnswers(s) && sameBank(s); })
        .map(summary);
    }

    return {
      STORE_KEY: storeKey,
      QUARANTINE_KEY: quarantineKey,
      storageAvailable: storageAvailable,
      reload: reload,
      data: function () { return data; },
      sessions: function () { reload(); return sortedSessions().map(summary); },
      resumable: function () {
        reload();
        return sortedSessions().filter(function (s) { return isResumable(s) && sameBank(s); }).map(summary);
      },
      /** Tamamlanan ya da birakilan, yaniti olan, bu dosyanin havuzuyla baslamis oturumlar. */
      finished: finishedSessions,
      /** finished() icinden henuz (tam olarak) gonderilmemis olanlar. */
      unsentFinished: function () { return finishedSessions().filter(function (s) { return s.unsent; }); },
      /** Baska soru havuzu surumuyle baslamis, yaniti olan oturumlar (yalniz dosyaya kaydedilir). */
      legacySessions: function () {
        reload();
        return sortedSessions().filter(function (s) { return !sameBank(s) && hasAnswers(s); }).map(summary);
      },
      summary: function (sid) { var s = sessionBySid(sid); return s ? summary(s) : null; },
      startSession: startSession,
      question: question,
      submit: submit,
      pause: function (sid) { return changeStatus(sid, 'paused'); },
      abandon: function (sid) { return changeStatus(sid, 'abandoned'); },
      submissionObject: submissionObject,
      submissionText: submissionText,
      fileText: fileText,
      fileName: function (sid) { return fileNameFor(sid, now()); },
      send: send,
      beginSend: beginSend,
      sendState: sendState,
      subscribe: subscribe,
      quarantineInfo: quarantineInfo,
      quarantineText: quarantineText,
      ackQuarantine: ackQuarantine,
      canSend: function () { return sendCfg.type !== 'none' && Boolean(sendCfg.url); },
    };
  }

  // ------------------------------------------------------------------ arayuz

  function boot() {
    var doc = document;
    var core = root.SurveyCore;
    var appEl = doc.getElementById('app');
    var engine = null;
    var config = null;
    var bank = null;
    var screen = ''; // 'start' | 'question' | ...
    var startNotice = null; // karttan basarili gonderimin gecici iletisi; baslangictan ayrilinca silinir

    function h(tag, props) {
      var el = doc.createElement(tag);
      var p = props || {};
      Object.keys(p).forEach(function (k) {
        var v = p[k];
        if (v === null || v === undefined || v === false) return;
        if (k === 'class') el.className = v;
        else if (k === 'text') el.textContent = v;
        else if (k.slice(0, 2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2), v);
        else el.setAttribute(k, v === true ? '' : String(v));
      });
      for (var i = 2; i < arguments.length; i++) append(el, arguments[i]);
      return el;
    }

    function append(el, child) {
      if (child === null || child === undefined || child === false) return;
      if (Array.isArray(child)) child.forEach(function (c) { append(el, c); });
      else if (typeof child === 'string') el.appendChild(doc.createTextNode(child));
      else el.appendChild(child);
    }

    function button(label, kind, onclick, extra) {
      return h('button', Object.assign({ type: 'button', class: 'btn btn-' + kind, onclick: onclick }, extra || {}), label);
    }

    // ---- diyalog

    function confirmDialog(o) {
      return new Promise(function (resolve) {
        var dlg = doc.createElement('dialog');
        if (typeof dlg.showModal !== 'function') {
          resolve(root.confirm(o.title + '\n\n' + o.text));
          return;
        }
        var titleId = 'dlg-title-' + Math.random().toString(36).slice(2);
        var result = false;
        dlg.className = 'dialog';
        dlg.setAttribute('aria-labelledby', titleId);
        var confirmBtn = button(o.confirmLabel, 'primary', function () { result = true; dlg.close(); });
        var cancelBtn = button(o.cancelLabel || T.cancel, 'text', function () { dlg.close(); });
        dlg.appendChild(h('h2', { id: titleId, class: 'dialog-title' }, o.title));
        dlg.appendChild(h('p', { class: 'dialog-text' }, o.text));
        dlg.appendChild(h('div', { class: 'dialog-actions' }, cancelBtn, confirmBtn));
        dlg.addEventListener('close', function () {
          dlg.remove();
          resolve(result);
        });
        doc.body.appendChild(dlg);
        dlg.showModal();
        cancelBtn.focus();
      });
    }

    // ---- taslak (sekme bazli, yalniz sayfa yenilemesine karsi)

    function draftKey(sid, pos) {
      return 'sesli-anket/taslak/' + sid + '/' + pos;
    }
    function draftGet(sid, pos) {
      try { return root.sessionStorage.getItem(draftKey(sid, pos)) || ''; } catch (e) { return ''; }
    }
    function draftSet(sid, pos, text) {
      try {
        if (text) root.sessionStorage.setItem(draftKey(sid, pos), text);
        else root.sessionStorage.removeItem(draftKey(sid, pos));
      } catch (e) { /* yut */ }
    }

    // ---- yonlendirme

    var guard = { dirty: function () { return false; } };
    root.addEventListener('beforeunload', function (ev) {
      if (guard.dirty()) {
        ev.preventDefault();
        ev.returnValue = '';
      }
    });

    function show(title, node, focusSel, o) {
      guard.dirty = function () { return false; };
      var soft = Boolean(o && o.soft); // gonderim bitince baslangic ekranini sessizce tazele: kaydirma/odak degismez
      var y = soft ? root.scrollY : 0;
      appEl.replaceChildren(node);
      doc.title = title + ' – ' + T.appName;
      if (soft) {
        root.scrollTo(0, y);
        return;
      }
      root.scrollTo(0, 0);
      var f = focusSel ? appEl.querySelector(focusSel) : appEl.querySelector('h1');
      if (f) {
        if (!f.hasAttribute('tabindex') && !/^(INPUT|TEXTAREA|BUTTON)$/.test(f.tagName)) f.setAttribute('tabindex', '-1');
        f.focus({ preventScroll: true });
      }
    }

    // ---- dosyaya kaydetme

    var fileEnv = {
      showSaveFilePicker: typeof root.showSaveFilePicker === 'function' ? root.showSaveFilePicker.bind(root) : null,
      download: function (name, text) {
        var blob = new Blob([text], { type: 'application/json;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var a = h('a', { href: url, download: name, class: 'sr-only' });
        doc.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
        return Promise.resolve();
      },
    };

    function savedToFile(sid) {
      return Promise.resolve().then(function () {
        return saveTextToFile(fileEnv, engine.fileName(sid), engine.fileText(sid));
      });
    }

    // ---- gonderim paneli

    var panels = []; // ekranda olan paneller; oturum basina gonderim durumu motorda tutulur
    var fileMsg = {}; // oturum -> {text, count, error}: son dosya iletisi, yanit sayisi degisince gecersiz

    function repaintPanels(sid) {
      panels = panels.filter(function (p) { return p.box.isConnected; });
      panels.forEach(function (p) { if (p.sid === sid) p.paint(); });
    }

    function onSendChange(sid) {
      repaintPanels(sid);
      // gonderim bittiyse ve katilimci baslangic ekranindaysa kartlar (gonderilmemis uyarisi) tazelensin.
      // Basarili gonderimde kart kaybolur; iletisi ve alindi kodu baslangicta gecici bildirim olarak kalir.
      if (screen !== 'start') return;
      var st = engine.sendState(sid);
      if (st.state === 'sending') return;
      if (st.state === 'ok') startNotice = { receipt: st.receipt, rejected: st.rejected };
      renderStart({ soft: true });
    }

    /** Gonder / Dosyaya kaydet paneli; durum motordadir, ekran degisse de ayni oturumun panelleri birlikte guncellenir. */
    function sendPanel(sid, o) {
      o = o || {};
      var box = h('div', { class: 'send-panel' });
      var live = h('div', { class: 'send-live', role: 'status', 'aria-live': 'polite' });
      var alertBox = h('div', { class: 'send-alert', role: 'alert' });
      var controls = h('div', { class: 'send-controls' });
      box.appendChild(live);
      box.appendChild(alertBox);
      box.appendChild(controls);
      var canSend = engine.canSend() && !o.saveOnly;

      function paint() {
        var st = engine.sendState(sid);
        var info = engine.summary(sid);
        live.textContent = '';
        alertBox.textContent = '';
        controls.replaceChildren();
        var busy = st.state === 'sending';
        if (busy) {
          live.appendChild(h('p', {}, T.sending));
        } else if (st.state === 'ok') {
          live.appendChild(h('p', { class: 'success' }, st.rejected > 0 ? 'Yanıtların bir kısmı gönderildi.' : T.sendOk));
          if (st.receipt) live.appendChild(h('p', { class: 'receipt' }, 'Alındı kodu: ', h('strong', {}, st.receipt)));
          if (typeof st.accepted === 'number') live.appendChild(h('p', {}, st.accepted + ' yanıt alıcıya ulaştı.'));
          if (st.note) alertBox.appendChild(h('p', { class: 'error' }, st.note));
        } else if (st.state === 'error') {
          alertBox.appendChild(h('p', { class: 'error' }, T.sendFailed + st.message));
        }
        if (!busy && st.rejected > 0) {
          alertBox.appendChild(h('p', { class: 'error' }, st.rejected + ' yanıt alıcı tarafından kabul edilmedi. Lütfen "Dosyaya kaydet" ile bir kopya alıp araştırmacıya ilet.'));
        }
        var fm = fileMsg[sid];
        if (fm && info && fm.count === info.responseCount) {
          (fm.error ? alertBox : live).appendChild(h('p', fm.error ? { class: 'error' } : {}, fm.text));
        }

        if (canSend && !(info && info.legacyBank)) {
          var label = st.state === 'error' ? T.sendRetry : (st.state === 'ok' ? T.sendAgain : (o.partial ? T.sendPartial : T.send));
          var kind = st.state === 'ok' ? 'outline' : (o.compact ? 'outline' : 'primary');
          controls.appendChild(button(busy ? T.sending : label, kind, doSend, { disabled: busy, 'aria-busy': busy ? 'true' : null }));
        }
        controls.appendChild(button(T.saveFile, canSend ? 'outline' : 'primary', doSave, { disabled: busy }));
      }

      function doSend() {
        if (engine.sendState(sid).state === 'sending') return;
        engine.beginSend(sid).then(function (r) {
          if (o.onDone) o.onDone(r);
        });
      }

      function doSave() {
        var info = engine.summary(sid);
        var count = info ? info.responseCount : 0;
        savedToFile(sid).then(function (res) {
          if (res === 'cancelled') return;
          fileMsg[sid] = { text: res === 'saved' ? T.fileSaved : T.fileDownloadStarted, count: count };
          paint();
        }, function () {
          fileMsg[sid] = { text: T.fileFailed, count: count, error: true };
          paint();
        });
      }

      panels.push({ sid: sid, box: box, paint: paint });
      paint();
      return box;
    }

    // ---- ekranlar

    function renderStart(o) {
      try {
        renderStartInner(o);
      } catch (e) {
        fatal(T.fatalBoot);
      }
    }

    function recoveryBanner() {
      var q = engine.quarantineInfo();
      if (q.count === 0) return null;
      var msg = h('p', { class: 'muted', role: 'status' });
      return h('section', { class: 'card card-warn', 'aria-labelledby': 'recovery-title' },
        h('h2', { id: 'recovery-title', class: 'card-title' }, T.recoveryTitle),
        h('p', {}, T.recoveryText),
        msg,
        h('div', { class: 'row' },
          button(T.recoverySave, 'outline', function () {
            Promise.resolve().then(function () {
              return saveTextToFile(fileEnv, fileNameFor('karantina', Date.now()), engine.quarantineText());
            }).then(function (res) {
              if (res === 'cancelled') return;
              msg.textContent = res === 'saved' ? T.fileSaved : T.fileDownloadStarted;
            }, function () {
              msg.textContent = T.fileFailed;
            });
          }, { id: 'recovery-save' }),
          button(T.recoveryAck, 'text', function () {
            engine.ackQuarantine();
            renderStart();
          }, { id: 'recovery-ack' })));
    }

    function renderStartInner(o) {
      screen = 'start';
      panels = [];
      engine.reload();
      var resumable = engine.resumable();
      var oosCount = bank.groupsFor('oos').length;
      var storageOk = engine.storageAvailable();
      var main = h('main', { class: 'screen' });
      main.appendChild(h('h1', { class: 'title' }, T.appName));
      main.appendChild(h('p', { class: 'lead' }, T.startSubtitle));
      main.appendChild(h('p', { class: 'note' }, engine.canSend() ? T.startLocalInfo : T.startLocalInfoNone));
      main.appendChild(h('p', { class: 'note', id: 'privacy-note' }, T.startPrivacyNote));
      if (startNotice) {
        main.appendChild(h('div', { class: 'banner banner-info', role: 'status', id: 'send-notice' },
          h('p', { class: 'success' }, startNotice.rejected > 0 ? 'Yanıtların bir kısmı gönderildi.' : T.sendOk),
          startNotice.receipt ? h('p', { class: 'receipt' }, 'Alındı kodu: ', h('strong', {}, startNotice.receipt)) : null));
      }

      if (!storageOk) {
        main.appendChild(h('p', { class: 'banner banner-error', role: 'alert' }, T.storageUnavailable));
      }
      append(main, recoveryBanner());

      // baska soru havuzu surumuyle baslamis oturumlar: yalniz dosyaya kaydedilebilir
      engine.legacySessions().forEach(function (s) {
        main.appendChild(h('section', { class: 'card card-warn', 'aria-labelledby': 'legacy-' + s.sessionId },
          h('h2', { id: 'legacy-' + s.sessionId, class: 'card-title' }, T.legacyTitle),
          h('p', {}, T.legacyText),
          h('p', { class: 'muted' }, (s.kind === 'oos' ? T.kindOos : T.kindMain) + ' · ' + s.answered + ' yanıt, ' + s.skipped + ' geçilen · Son işlem: ' + formatShortDateTime(s.lastActiveAt)),
          sendPanel(s.sessionId, { saveOnly: true })));
      });

      // tamamlanan ve birakilan oturumlar: gonderim varsa yalniz gonderilmemisler, yoksa hepsi (dosyaya kaydedilebilsin)
      var canSend = engine.canSend();
      engine.finished().forEach(function (s) {
        if (canSend && !s.unsent) return;
        var abandoned = s.status === 'abandoned';
        var title = canSend ? (abandoned ? T.abandonedTitle : T.unsentTitle) : (abandoned ? T.abandonedTitle : T.finishedTitle);
        var text = !canSend ? T.finishedText : (s.rejected > 0 ? T.partialRejectedText : (abandoned ? T.abandonedText : T.unsentText));
        var when = abandoned ? 'Bırakıldı: ' : 'Tamamlandı: ';
        main.appendChild(h('section', { class: canSend ? 'card card-warn' : 'card', 'aria-labelledby': 'unsent-' + s.sessionId },
          h('h2', { id: 'unsent-' + s.sessionId, class: 'card-title' }, title),
          h('p', {}, text),
          h('p', { class: 'muted' }, (s.kind === 'oos' ? T.kindOos : T.kindMain) + ' · ' + s.answered + ' yanıt, ' + s.skipped + ' geçilen · ' + when + formatShortDateTime(s.finishedAt || s.lastActiveAt)),
          sendPanel(s.sessionId, {})));
      });

      if (storageOk) {
        var primary = resumable[0];
        if (!primary) {
          main.appendChild(button(T.startBegin, 'primary', function () { renderConsent('main'); }, { id: 'start-button' }));
        } else {
          main.appendChild(button(T.startResume, 'primary', function () { resume(primary.sessionId); }, { id: 'resume-button' }));
          main.appendChild(h('p', { class: 'resume-info' }, 'Soru ' + primary.questionNumber + '/' + primary.total + ' · ' + formatShortDateTime(primary.lastActiveAt)));
          main.appendChild(button(T.startNew, 'outline', function () {
            confirmDialog({ title: T.startNewTitle, text: T.startNewText, confirmLabel: T.startNewConfirm }).then(function (yes) {
              if (yes) renderConsent('main');
            });
          }, { id: 'new-survey-button' }));
        }
        if (config.oos_enabled) {
          main.appendChild(button('Ek anket (' + oosCount + ' soru)', 'outline', function () { renderConsent('oos'); }, { id: 'oos-survey-button' }));
        }
      }

      if (resumable.length > 1) {
        main.appendChild(h('h2', { class: 'section-title' }, T.startSessions));
        resumable.forEach(function (s) { main.appendChild(sessionCard(s, true)); });
      } else if (resumable.length === 1 && resumable[0].answered + resumable[0].skipped > 0) {
        main.appendChild(sessionExtras(resumable[0]));
      }

      main.appendChild(h('p', { class: 'footer' }, 'Sürüm ' + core.APP_VERSION + ' · soru havuzu ' + bank.bankVersion));
      show(T.appName, main, null, o);
    }

    function abandonAction(s) {
      return function () {
        confirmDialog({ title: T.abandonTitle, text: T.abandonText, confirmLabel: T.abandon }).then(function (yes) {
          if (!yes) return;
          engine.abandon(s.sessionId);
          renderStart();
        });
      };
    }

    function sessionExtras(s) {
      return h('div', { class: 'extras' },
        h('div', { class: 'row' }, button(T.abandon, 'text', abandonAction(s))),
        sendPanel(s.sessionId, { partial: true, compact: true }));
    }

    function sessionCard(s) {
      var children = [
        h('h3', { class: 'card-title' }, s.kind === 'oos' ? T.kindOos : T.kindMain),
        s.code ? h('p', {}, T.cardCode + s.code) : null,
        h('p', {}, 'Soru ' + s.questionNumber + '/' + s.total),
        h('p', { class: 'muted' }, T.cardLastActive + formatShortDateTime(s.lastActiveAt)),
        h('div', { class: 'row' },
          button(T.cardResume, 'primary', function () { resume(s.sessionId); }, { id: 'session-resume-' + s.sessionId }),
          button(T.abandon, 'text', abandonAction(s))),
      ];
      if (s.answered + s.skipped > 0) children.push(sendPanel(s.sessionId, { partial: true, compact: true }));
      return h('section', { class: 'card', id: 'session-card-' + s.sessionId }, children);
    }

    function resume(sid) {
      try {
        var q = engine.question(sid);
        if (q) renderQuestion(sid);
        else if (engine.summary(sid) && engine.summary(sid).status === 'completed') renderCompleted(sid);
        else renderStart();
      } catch (e) {
        showFault();
      }
    }

    function renderConsent(kind) {
      screen = 'consent';
      startNotice = null;
      var total = bank.groupsFor(kind).length;
      var main = h('main', { class: 'screen' });
      main.appendChild(h('h1', { class: 'title' }, T.consentTitle));
      consentSections(config, total).forEach(function (sec) {
        main.appendChild(h('section', { class: 'consent-section' },
          h('h2', { class: 'consent-h' }, sec.h),
          sec.p.map(function (para) { return h('p', {}, para); })));
      });
      main.appendChild(h('p', { class: 'note' }, 'Anket ' + total + ' sorudan oluşuyor; istediğin an ara verip daha sonra kaldığın yerden sürdürebilirsin.'));

      var codeInput = h('input', {
        id: 'participant-code', type: 'text', maxlength: MAX_CODE_LENGTH, autocomplete: 'off',
        autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false', 'aria-describedby': 'code-hint', class: 'field',
      });
      main.appendChild(h('div', { class: 'field-group' },
        h('label', { for: 'participant-code', class: 'label' }, T.consentCodeLabel),
        codeInput,
        h('p', { id: 'code-hint', class: 'hint' }, T.consentCodeHint)));

      var check = h('input', { id: 'consent-checkbox', type: 'checkbox', class: 'check' });
      var errorBox = h('div', { class: 'consent-error', role: 'alert' });
      var accept = button(T.consentAccept, 'primary', onAccept, { id: 'consent-accept', disabled: true });
      var cancel = button(T.consentCancel, 'outline', function () { renderStart(); }, { id: 'consent-cancel' });
      check.addEventListener('change', function () { accept.disabled = !check.checked; });
      main.appendChild(h('label', { class: 'check-row', for: 'consent-checkbox' }, check, h('span', {}, T.consentCheckbox)));
      main.appendChild(errorBox);
      main.appendChild(h('div', { class: 'actions' }, accept, cancel));

      var starting = false;
      function onAccept() {
        if (!check.checked || starting) return;
        starting = true;
        accept.disabled = true;
        cancel.disabled = true;
        accept.textContent = T.consentStarting;
        var res;
        try {
          res = engine.startSession({ kind: kind, code: codeInput.value });
        } catch (e) {
          res = { ok: false, reason: 'generic' };
        }
        if (res.ok) {
          renderQuestion(res.sessionId);
          return;
        }
        starting = false;
        accept.textContent = T.consentAccept;
        accept.disabled = !check.checked;
        cancel.disabled = false;
        errorBox.textContent = res.reason === 'selection' ? T.consentErrorSelection
          : res.reason === 'storage' ? T.consentErrorStorage : T.consentErrorGeneric;
      }
      show(T.consentTitle, main);
    }

    function renderQuestion(sid, opts) {
      opts = opts || {};
      var q = engine.question(sid);
      if (!q) {
        var info = engine.summary(sid);
        if (info && info.status === 'completed') renderCompleted(sid);
        else renderStart();
        return;
      }
      screen = 'question';
      startNotice = null;
      var counter = 'Soru ' + (q.position + 1) + '/' + q.total;
      var main = h('main', { class: 'screen screen-question' });
      var later = button(T.questionLater, 'text', requestLater, { id: 'later-button' });
      main.appendChild(h('div', { class: 'topbar' }, h('h1', { class: 'counter', id: 'question-counter' }, counter), later));
      main.appendChild(h('progress', {
        class: 'progress', id: 'question-progress', max: q.total, value: q.position + 1, 'aria-label': T.questionProgress,
      }));
      var region = h('div', { class: 'notice-region', role: 'status', 'aria-live': 'polite' });
      main.appendChild(region);
      main.appendChild(h('p', { class: 'prompt', id: 'question-text' }, q.promptText));

      var area = h('textarea', {
        id: 'answer-field', class: 'field answer', rows: 5, maxlength: MAX_ANSWER_LENGTH, autocomplete: 'off',
        autocorrect: 'off', autocapitalize: 'off', spellcheck: 'false', placeholder: T.questionPlaceholder,
        'aria-describedby': 'question-text',
      });
      area.value = opts.carryText ? String(opts.carryText).slice(0, MAX_ANSWER_LENGTH) : draftGet(sid, q.position);
      if (opts.carryText) draftSet(sid, q.position, area.value);
      main.appendChild(h('div', { class: 'field-group' },
        h('label', { for: 'answer-field', class: 'label' }, T.questionAnswerLabel), area));

      var errorRegion = h('div', { class: 'error-region', role: 'alert' });
      main.appendChild(errorRegion);
      var submitBtn = button(T.questionSubmit, 'primary', function () { doSubmit('answer'); }, { id: 'submit-button' });
      var skipBtn = button(T.questionSkip, 'outline', onSkip, { id: 'skip-button' });
      main.appendChild(h('div', { class: 'actions' }, submitBtn, skipBtn));
      main.appendChild(h('p', { class: 'hint' }, T.questionHint));

      if (opts.restBanner) {
        var dismiss = button(T.restDismiss, 'text', function () { region.replaceChildren(); area.focus(); }, { id: 'rest-dismiss' });
        region.appendChild(h('div', { class: 'banner banner-info', id: 'rest-banner' }, h('span', {}, T.questionRestBanner), dismiss));
      }

      var saving = false;
      var lastAction = null;

      function meaningful() {
        return core.answerPolicy.isMeaningful(area.value);
      }
      function refresh() {
        submitBtn.disabled = saving || !meaningful();
      }
      area.addEventListener('input', function () {
        draftSet(sid, q.position, area.value);
        errorRegion.replaceChildren();
        refresh();
      });
      area.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) {
          ev.preventDefault();
          if (!submitBtn.disabled) doSubmit('answer');
        }
      });

      function setBusy(b) {
        saving = b;
        submitBtn.textContent = b ? T.questionSaving : T.questionSubmit;
        submitBtn.setAttribute('aria-busy', b ? 'true' : 'false');
        skipBtn.disabled = b;
        later.disabled = b;
        refresh();
      }

      function doSubmit(action) {
        if (saving) return;
        lastAction = action;
        setBusy(true);
        errorRegion.replaceChildren();
        var typed = area.value;
        var res;
        try {
          // ekranda gosterilen soru ile birlikte gonderilir: baska sekme o soruyu kaydettiyse yazilmaz (bayat sekme)
          res = engine.submit(sid, { action: action, text: typed, position: q.position, questionId: q.questionId });
        } catch (e) {
          setBusy(false);
          showFault();
          return;
        }
        setBusy(false);
        var out = submitOutcome(res, action, typed);
        if (out.kind === 'completed') {
          draftSet(sid, q.position, '');
          renderCompleted(sid);
        } else if (out.kind === 'next') {
          draftSet(sid, q.position, '');
          renderQuestion(sid, { restBanner: out.restDue });
        } else if (out.kind === 'storage_error') {
          var retry = button(T.questionRetry, 'outline', function () { doSubmit(lastAction); }, { id: 'save-retry' });
          errorRegion.appendChild(h('div', { class: 'banner banner-error', id: 'save-error' }, h('span', {}, T.questionSaveError), retry));
          retry.focus();
        } else if (out.kind === 'empty') {
          errorRegion.appendChild(h('p', { class: 'error' }, T.questionNoticeEmpty));
        } else if (out.kind === 'too_long') {
          errorRegion.appendChild(h('p', { class: 'error' }, T.questionTooLong));
        } else if (out.kind === 'stale') {
          draftSet(sid, q.position, '');
          renderQuestion(sid, { carryText: out.carryText, notice: T.questionStale });
        } else {
          renderStart();
        }
      }

      function onSkip() {
        if (saving) return;
        if (!meaningful()) {
          doSubmit('skip');
          return;
        }
        confirmDialog({ title: T.skipTitle, text: T.skipText, confirmLabel: T.skipConfirm }).then(function (yes) {
          if (yes) doSubmit('skip');
        });
      }

      function requestLater() {
        if (saving) return;
        var unsaved = meaningful();
        confirmDialog({
          title: T.laterTitle,
          text: unsaved ? T.laterUnsavedText : T.laterText,
          confirmLabel: unsaved ? T.laterUnsavedConfirm : T.laterConfirm,
        }).then(function (yes) {
          if (!yes) return;
          draftSet(sid, q.position, '');
          engine.pause(sid);
          renderStart();
        });
      }

      refresh();
      show(counter, main, '#question-counter');
      guard.dirty = function () { return meaningful() && !saving; };
      if (opts.notice) {
        // canli bolge ekran kurulduktan sonra doldurulur ki ekran okuyucu duyursun
        setTimeout(function () {
          region.appendChild(h('div', { class: 'banner banner-info', id: 'stale-notice' }, h('span', {}, opts.notice)));
        }, 50);
      }
    }

    function renderCompleted(sid) {
      screen = 'completed';
      startNotice = null;
      panels = [];
      var info = engine.summary(sid);
      var main = h('main', { class: 'screen screen-center' });
      main.appendChild(h('h1', { class: 'title', id: 'completed-title' }, T.completedTitle));
      if (info) {
        main.appendChild(h('p', { class: 'lead', id: 'completed-counts' }, info.answered + ' soru yanıtlandı, ' + info.skipped + ' soru geçildi.'));
        main.appendChild(h('p', { class: 'note' }, engine.canSend() ? T.completedSendInfo : T.sendNoneInfo));
        main.appendChild(sendPanel(sid, {}));
      }
      main.appendChild(button(T.completedHome, 'outline', function () { renderStart(); }, { id: 'home-button' }));
      show(T.completedTitle, main);
    }

    function fatal(msg) {
      screen = 'fatal';
      appEl.replaceChildren(h('main', { class: 'screen' }, h('h1', { class: 'title' }, T.appName), h('p', { class: 'banner banner-error', role: 'alert' }, msg)));
    }

    /** Beklenmeyen hata: ekran kilitlenmez, yanitlar silinmez; ana ekrana donus sunulur. */
    function showFault() {
      screen = 'fault';
      appEl.replaceChildren(h('main', { class: 'screen' },
        h('h1', { class: 'title' }, T.appName),
        h('p', { class: 'banner banner-error', role: 'alert' }, T.fault),
        button(T.completedHome, 'primary', function () { renderStart(); }, { id: 'fault-home' })));
    }

    // ---- baslat
    try {
      config = JSON.parse(doc.getElementById('survey-config').textContent);
      var bankJson = JSON.parse(doc.getElementById('survey-bank').textContent);
      bank = core.bank.load(bankJson);
    } catch (e) {
      fatal(T.fatalBoot);
      return;
    }
    if (bank.validate().length > 0) {
      fatal(T.fatalBank);
      return;
    }
    var storage = null;
    try { storage = root.localStorage; } catch (e) { storage = null; }
    engine = createEngine({ core: core, bank: bank, config: config, storage: storage, bankChecksum: config.bank_checksum });
    engine.subscribe(onSendChange);
    requestPersistence(root.navigator); // en iyi caba: tarayici depoyu kalici isaretlerse otomatik temizlenmez
    renderStart();
  }

  var api = {
    STORE_PREFIX: STORE_PREFIX,
    QUARANTINE_PREFIX: QUARANTINE_PREFIX,
    SEND_TIMEOUT_MS: SEND_TIMEOUT_MS,
    MAX_ANSWER_LENGTH: MAX_ANSWER_LENGTH,
    TEXTS: T,
    ERROR_MESSAGES: ERROR_MESSAGES,
    errorMessageFor: errorMessageFor,
    createEngine: createEngine,
    consentSections: consentSections,
    formatShortDateTime: formatShortDateTime,
    fileNameFor: fileNameFor,
    sessionProblem: sessionProblem,
    saveTextToFile: saveTextToFile,
    requestPersistence: requestPersistence,
    submitOutcome: submitOutcome,
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  root.SurveyApp = api;
  if (typeof document !== 'undefined' && document.getElementById && document.getElementById('app')) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
    else boot();
  }
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
</body>
</html>
